    initialButchers: [],

    initButcherData: function() {
        try {
            const raw = localStorage.getItem('meedo_legacy_butchers');
            if (raw) {
                const parsed = JSON.parse(raw);
                const hasMock = Array.isArray(parsed) && parsed.some(b => 
                    b.name === 'Danny Fernandez' || 
                    b.name === 'Bert Sison' ||
                    b.id === 'BTC-001' || 
                    b.contact === '0917-889-0123' ||
                    b.contact === '0920-554-3211' ||
                    b.code === 'undefined' ||
                    b.name === 'undefined'
                );
                if (hasMock) {
                    this.state.butcherData = [];
                    localStorage.removeItem('meedo_legacy_butchers');
                } else {
                    this.state.butcherData = Array.isArray(parsed) ? parsed : [];
                }
            } else {
                this.state.butcherData = [];
            }
        } catch(e) {
            this.state.butcherData = [];
        }

        // Clean any undefined artifacts
        this.state.butcherData = (this.state.butcherData || []).filter(b => {
            const n = b.name || b.fullName;
            const c = b.code || b.id;
            return (n && n !== 'undefined') || (c && c !== 'undefined');
        });
        this.state.butcherData.forEach(b => {
            b.code = (b.code && b.code !== 'undefined') ? b.code : (b.id && b.id !== 'undefined' ? b.id : '');
            b.name = (b.name && b.name !== 'undefined') ? b.name : (b.fullName || '');
            b.id = b.id || b.code || '';
        });

        this.populateButcherDropdown();
    },

    saveButcherStorage: function() {
        try {
            localStorage.setItem('meedo_legacy_butchers', JSON.stringify(this.state.butcherData));
        } catch(e) {}
        if (window.google && window.google.script && google.script.run.saveButchersData) {
            google.script.run.saveButchersData(this.state.butcherData);
        }
    },

    populateButcherDropdown: function() {
        const shButcher = document.getElementById('shButcher');
        const shFilterButcher = document.getElementById('shFilterButcher');
        const editShButcher = document.getElementById('editShButcher');

        const activeButchers = (this.state.butcherData || []).filter(b => b.status === 'Active');
        const allButchers = this.state.butcherData || [];

        if (shButcher) {
            const curVal = shButcher.value;
            let opts = '<option value="">-- Select Butcher --</option>';
            activeButchers.forEach(b => {
                opts += `<option value="${b.id}">${this.escapeHTML(b.name)} - ${this.escapeHTML(b.code)} (${this.escapeHTML(b.specialization || 'General')})</option>`;
            });
            shButcher.innerHTML = opts;
            if (curVal) shButcher.value = curVal;
        }

        if (shFilterButcher) {
            const curVal = shFilterButcher.value;
            let opts = '<option value="">All Butchers</option>';
            allButchers.forEach(b => {
                opts += `<option value="${b.id}">${this.escapeHTML(b.name)} (${this.escapeHTML(b.code)})</option>`;
            });
            shFilterButcher.innerHTML = opts;
            if (curVal) shFilterButcher.value = curVal;
        }

        if (editShButcher) {
            const curVal = editShButcher.value;
            let opts = '<option value="">-- None / Unassigned --</option>';
            allButchers.forEach(b => {
                opts += `<option value="${b.id}">${this.escapeHTML(b.name)} (${this.escapeHTML(b.code)})</option>`;
            });
            editShButcher.innerHTML = opts;
            if (curVal) editShButcher.value = curVal;
        }
    },

    renderButchers: function() {
        const tbody = document.getElementById('butcherTableBody');
        const summaryCont = document.getElementById('butcherSummaryCards');
        if (!tbody) return;

        const all = this.state.butcherData || [];
        const searchInput = (document.getElementById('butcherSearch')?.value || '').toLowerCase().trim();
        const statusFilter = document.getElementById('butcherFilterStatus')?.value || 'All';
        const specFilter = document.getElementById('butcherFilterSpec')?.value || 'All';

        const today = new Date();
        const activeCount = all.filter(b => b.status === 'Active').length;
        const certifiedCount = all.filter(b => {
            if (!b.healthExpiry) return false;
            return new Date(b.healthExpiry) >= today;
        }).length;
        const expiredCount = all.length - certifiedCount;

        if (summaryCont) {
            summaryCont.innerHTML = `
                <div class="summary-card">
                    <div class="summary-value">${all.length}</div>
                    <div class="summary-label"><i class="fas fa-users"></i> Total Butchers</div>
                </div>
                <div class="summary-card" style="background:var(--success-light); border-color:rgba(16,185,129,0.3);">
                    <div class="summary-value" style="color:var(--stall-occupied-text);">${activeCount}</div>
                    <div class="summary-label" style="color:var(--stall-occupied-text);"><i class="fas fa-user-check"></i> Active on Duty</div>
                </div>
                <div class="summary-card" style="background:var(--primary-light); border-color:rgba(37,99,235,0.2);">
                    <div class="summary-value" style="color:var(--primary-dark);">${certifiedCount}</div>
                    <div class="summary-label" style="color:var(--primary-dark);"><i class="fas fa-id-card"></i> Health Certified</div>
                </div>
                <div class="summary-card" style="background:${expiredCount > 0 ? 'var(--warning-light)' : '#f8fafc'}; border-color:${expiredCount > 0 ? 'rgba(245,158,11,0.3)' : 'var(--border-color)'};">
                    <div class="summary-value" style="color:${expiredCount > 0 ? 'var(--warning-color)' : 'var(--text-sub)'};">${expiredCount}</div>
                    <div class="summary-label"><i class="fas fa-exclamation-triangle"></i> Expired / Pending</div>
                </div>
            `;
        }

        const filtered = all.filter(b => {
            if (statusFilter !== 'All' && b.status !== statusFilter) return false;
            if (specFilter !== 'All' && b.specialization !== specFilter) return false;
            if (searchInput !== '') {
                const hay = `${b.code} ${b.name} ${b.barangay || ''} ${b.contact || ''} ${b.specialization || ''}`.toLowerCase();
                if (!hay.includes(searchInput)) return false;
            }
            return true;
        });

        if (all.length === 0) {
            tbody.innerHTML = `<tr><td colspan="8" style="text-align:center; padding: 40px 20px; color:var(--text-sub);">
                <i class="fas fa-user-slash" style="font-size: 2rem; color: #cbd5e1; margin-bottom: 8px; display: block;"></i>
                <strong style="font-size: 0.95rem; color: var(--text-main);">No butcher profiles registered yet.</strong>
                <p style="margin: 4px 0 0; font-size: 0.85rem; color: var(--text-muted);">Click <strong>+ Register Butcher</strong> to add accredited meat handlers to the registry.</p>
            </td></tr>`;
            return;
        }

        if (filtered.length === 0) {
            tbody.innerHTML = `<tr><td colspan="8" style="text-align:center; padding: 25px; color:var(--text-sub);">No butchers found matching filters.</td></tr>`;
            return;
        }

        let html = '';
        filtered.forEach(b => {
            let healthBadge = '<span class="badge badge-neutral">No Clearance</span>';
            if (b.healthExpiry) {
                const expDate = new Date(b.healthExpiry);
                const diffDays = Math.ceil((expDate - today) / (1000 * 60 * 60 * 24));
                if (diffDays < 0) {
                    healthBadge = `<span class="badge badge-expired"><i class="fas fa-times-circle"></i> Expired (${b.healthExpiry})</span>`;
                } else if (diffDays <= 30) {
                    healthBadge = `<span class="badge badge-expiring"><i class="fas fa-exclamation-triangle"></i> Expiring Soon (${diffDays}d)</span>`;
                } else {
                    healthBadge = `<span class="badge badge-valid"><i class="fas fa-check-circle"></i> Valid (${b.healthExpiry})</span>`;
                }
            }

            const statusBadge = b.status === 'Active' 
                ? '<span class="badge badge-approved"><i class="fas fa-circle" style="font-size:0.6rem;"></i> Active</span>'
                : '<span class="badge badge-admin"><i class="fas fa-circle" style="font-size:0.6rem;"></i> Inactive</span>';

            const displayCode = (b.code && b.code !== 'undefined') ? b.code : (b.id && b.id !== 'undefined' ? b.id : '-');
            const displayName = (b.name && b.name !== 'undefined') ? b.name : (b.fullName && b.fullName !== 'undefined' ? b.fullName : 'Unnamed Butcher');
            const displayContact = (b.contact && b.contact !== 'undefined') ? b.contact : '';
            const displayBarangay = (b.barangay && b.barangay !== 'undefined') ? b.barangay : '-';
            const displaySpec = (b.specialization && b.specialization !== 'undefined') ? b.specialization : 'General';
            const safeId = String(b.id || displayCode).replace(/'/g, "\\'");

            html += `<tr>
                <td><strong>${this.escapeHTML(displayCode)}</strong></td>
                <td>
                    <strong>${this.escapeHTML(displayName)}</strong>
                    ${displayContact ? `<br><small style="color:var(--text-sub);"><i class="fas fa-phone-alt" style="font-size:0.75rem;"></i> ${this.escapeHTML(displayContact)}</small>` : ''}
                </td>
                <td><span class="badge-unit">${this.escapeHTML(displaySpec)}</span></td>
                <td>${this.escapeHTML(displayBarangay)}</td>
                <td>${healthBadge}</td>
                <td>${statusBadge}</td>
                <td style="text-align:right;"><strong>${b.totalSlaughtered || 0}</strong> heads</td>
                <td class="no-print" style="text-align:center; white-space:nowrap;">
                    <button class="btn btn-ghost btn-sm" style="color:var(--primary-color); padding:4px 6px;" onclick="window.app.openButcherModal('${safeId}')" title="Edit Profile"><i class="fas fa-edit"></i></button>
                    <button class="btn btn-ghost btn-sm" style="color:${b.status === 'Active' ? 'var(--warning-color)' : 'var(--success-color)'}; padding:4px 6px;" onclick="window.app.toggleButcherStatus('${safeId}')" title="${b.status === 'Active' ? 'Set Inactive' : 'Set Active'}"><i class="fas ${b.status === 'Active' ? 'fa-pause' : 'fa-play'}"></i></button>
                    <button class="btn btn-ghost btn-sm" style="color:var(--danger-color); padding:4px 6px;" onclick="window.app.deleteButcher('${safeId}')" title="Delete Profile"><i class="fas fa-trash-alt"></i></button>
                </td>
            </tr>`;
        });
        tbody.innerHTML = html;
    },

    openButcherModal: function(id = null) {
        const titleEl = document.getElementById('butcherModalTitle');
        const overlay = document.getElementById('butcherModalOverlay');
        if (!overlay) return;

        if (id) {
            const b = this.state.butcherData.find(x => x.id === id);
            if (!b) return;
            if (titleEl) titleEl.textContent = 'Edit Butcher Profile';
            document.getElementById('butcherEditId').value = b.id;
            document.getElementById('butcherCode').value = b.code || '';
            document.getElementById('butcherName').value = b.name || '';
            document.getElementById('butcherContact').value = b.contact || '';
            document.getElementById('butcherBarangay').value = b.barangay || '';
            document.getElementById('butcherSpec').value = b.specialization || 'Swine / Hog Specialist';
            document.getElementById('butcherStatus').value = b.status || 'Active';
            document.getElementById('butcherHealthExp').value = b.healthExpiry || '';
        } else {
            if (titleEl) titleEl.textContent = 'Register New Butcher';
            document.getElementById('butcherEditId').value = '';
            const nextNum = (this.state.butcherData || []).length + 1;
            document.getElementById('butcherCode').value = 'BTC-' + String(nextNum).padStart(3, '0');
            document.getElementById('butcherName').value = '';
            document.getElementById('butcherContact').value = '';
            document.getElementById('butcherBarangay').value = '';
            document.getElementById('butcherSpec').value = 'Swine / Hog Specialist';
            document.getElementById('butcherStatus').value = 'Active';
            let exp = new Date();
            exp.setMonth(exp.getMonth() + 6);
            document.getElementById('butcherHealthExp').value = exp.toISOString().split('T')[0];
        }
        overlay.classList.add('open');
    },

    closeButcherModal: function() {
        const overlay = document.getElementById('butcherModalOverlay');
        if (overlay) overlay.classList.remove('open');
    },

    saveButcher: function() {
        const editId = document.getElementById('butcherEditId').value;
        const code = document.getElementById('butcherCode').value.trim();
        const name = document.getElementById('butcherName').value.trim();
        const contact = document.getElementById('butcherContact').value.trim();
        const barangay = document.getElementById('butcherBarangay').value.trim();
        const specialization = document.getElementById('butcherSpec').value;
        const status = document.getElementById('butcherStatus').value;
        const healthExpiry = document.getElementById('butcherHealthExp').value;

        if (!name) {
            Toast.fire({ icon: 'warning', title: 'Full Name is required' });
            return;
        }

        if (editId) {
            const b = this.state.butcherData.find(x => x.id === editId);
            if (b) {
                b.code = code || b.code;
                b.name = name;
                b.contact = contact;
                b.barangay = barangay;
                b.specialization = specialization;
                b.status = status;
                b.healthExpiry = healthExpiry;
            }
            Toast.fire({ icon: 'success', title: 'Butcher profile updated' });
        } else {
            const newId = code || ('BTC-' + Date.now().toString().slice(-4));
            this.state.butcherData.push({
                id: newId,
                code: code || newId,
                name: name,
                contact: contact,
                barangay: barangay,
                specialization: specialization,
                healthExpiry: healthExpiry,
                status: status,
                totalSlaughtered: 0
            });
            Toast.fire({ icon: 'success', title: 'Butcher registered successfully' });
        }

        this.saveButcherStorage();
        this.populateButcherDropdown();
        this.renderButchers();
        this.closeButcherModal();
    },

    toggleButcherStatus: function(id) {
        const b = this.state.butcherData.find(x => x.id === id);
        if (!b) return;
        b.status = b.status === 'Active' ? 'Inactive' : 'Active';
        this.saveButcherStorage();
        this.populateButcherDropdown();
        this.renderButchers();
        Toast.fire({ icon: 'info', title: `${b.name} is now ${b.status}` });
    },

    deleteButcher: function(id) {
        const b = this.state.butcherData.find(x => x.id === id);
        if (!b) return;

        Swal.fire({
            title: 'Delete Butcher Profile?',
            text: `Are you sure you want to remove ${b.name} (${b.code}) from the registry?`,
            icon: 'warning',
            showCancelButton: true,
            confirmButtonColor: '#ef4444',
            cancelButtonColor: '#6b7280',
            confirmButtonText: 'Yes, delete!'
        }).then((result) => {
            if (result.isConfirmed) {
                this.state.butcherData = this.state.butcherData.filter(x => x.id !== id);
                this.saveButcherStorage();
                this.populateButcherDropdown();
                this.renderButchers();
                Toast.fire({ icon: 'success', title: 'Butcher profile deleted' });
            }
        });
    },

    // =========================================================================
    // INVENTORY & SUPPLIES MANAGEMENT MODULE (LGU MEEDO)
    // =========================================================================
    initialInventoryItems: [],

    initialInventoryTransactions: [],

    initInventoryData: function() {
        try {
            const rawItems = localStorage.getItem('meedo_legacy_inventory_items');
            if (rawItems) {
                const parsed = JSON.parse(rawItems);
                const hasMock = Array.isArray(parsed) && parsed.some(x => 
                    (x.name === 'Bond Paper A4') || 
                    (x.name === 'Disinfectant Bleach') || 
                    (x.code === 'INV-001' && x.name === 'Bond Paper A4')
                );
                if (hasMock) {
                    this.state.inventoryItems = [];
                    localStorage.removeItem('meedo_legacy_inventory_items');
                } else {
                    this.state.inventoryItems = Array.isArray(parsed) ? parsed : [];
                }
            } else {
                this.state.inventoryItems = [];
            }

            const rawTxns = localStorage.getItem('meedo_legacy_inventory_transactions');
            if (rawTxns) {
                const parsedTx = JSON.parse(rawTxns);
                const hasMockTx = Array.isArray(parsedTx) && parsedTx.some(x => 
                    (x.id === 'TXN-001') || 
                    (x.itemName === 'Bond Paper A4')
                );
                if (hasMockTx) {
                    this.state.inventoryTransactions = [];
                    localStorage.removeItem('meedo_legacy_inventory_transactions');
                } else {
                    this.state.inventoryTransactions = Array.isArray(parsedTx) ? parsedTx : [];
                }
            } else {
                this.state.inventoryTransactions = [];
            }
        } catch(e) {
            this.state.inventoryItems = [];
            this.state.inventoryTransactions = [];
        }

        (this.state.inventoryItems || []).forEach((item, idx) => {
            if (!item.code || item.code === 'undefined') {
                item.code = item.id || ('INV-' + String(idx + 1).padStart(3, '0'));
            }
            if (!item.id) {
                item.id = item.code;
            }
        });
    },

    saveInventoryStorage: function() {
        try {
            localStorage.setItem('meedo_legacy_inventory_items', JSON.stringify(this.state.inventoryItems));
            localStorage.setItem('meedo_legacy_inventory_transactions', JSON.stringify(this.state.inventoryTransactions));
        } catch(e) {}
        if (window.google && window.google.script && google.script.run.saveInventoryData) {
            google.script.run.saveInventoryData(this.state.inventoryItems, this.state.inventoryTransactions);
        }
    },

    renderInventory: function() {

                    <div class="summary-value">${items.length}</div>
                    <div class="summary-label"><i class="fas fa-boxes"></i> Total Catalog Items</div>
                </div>
                <div class="summary-card" style="background:var(--primary-light); border-color:rgba(37,99,235,0.2);">
                    <div class="summary-value" style="color:var(--primary-dark);">${totalQty.toLocaleString()}</div>
                    <div class="summary-label" style="color:var(--primary-dark);"><i class="fas fa-cubes"></i> Total Stock On Hand</div>
                </div>
                <div class="summary-card" style="background:${lowStockItems.length > 0 ? 'var(--danger-light)' : '#f8fafc'}; border-color:${lowStockItems.length > 0 ? 'rgba(239,68,68,0.3)' : 'var(--border-color)'};">
                    <div class="summary-value" style="color:${lowStockItems.length > 0 ? 'var(--danger-color)' : 'var(--text-sub)'};">${lowStockItems.length}</div>
                    <div class="summary-label" style="color:${lowStockItems.length > 0 ? 'var(--danger-color)' : 'var(--text-sub)'};"><i class="fas fa-exclamation-circle"></i> Low Stock Alerts</div>
                </div>
                <div class="summary-card" style="background:var(--success-light); border-color:rgba(16,185,129,0.3);">
                    <div class="summary-value" style="color:var(--stall-occupied-text);">${releasesCount}</div>
                    <div class="summary-label" style="color:var(--stall-occupied-text);"><i class="fas fa-hand-holding"></i> Requisitions Handled</div>
                </div>
            `;

        this.renderInventoryTransactionsTable();

    switchInventoryTab: function(tab) {
        this.state.inventoryActiveTab = tab;
        const tabStock = document.getElementById('tabInvStock');
        const tabTxn = document.getElementById('tabInvTxn');
        const contStock = document.getElementById('containerInvStock');
        const contTxn = document.getElementById('containerInvTxn');

        if (tab === 'stock') {
            if (tabStock) tabStock.classList.add('active');
            if (tabTxn) tabTxn.classList.remove('active');
            if (contStock) contStock.classList.remove('hidden');
            if (contTxn) contTxn.classList.add('hidden');
            this.renderInventoryStockTable();
        } else {
            if (tabTxn) tabTxn.classList.add('active');
            if (tabStock) tabStock.classList.remove('active');
            if (contTxn) contTxn.classList.remove('hidden');
            if (contStock) contStock.classList.add('hidden');
            this.renderInventoryTransactionsTable();
        }
    },

    renderInventoryStockTable: function() {
        const tbody = document.getElementById('invStockTableBody');
        if (!tbody) return;

        const items = this.state.inventoryItems || [];
        const searchInput = (document.getElementById('invStockSearch')?.value || '').toLowerCase().trim();
        const unitFilter = document.getElementById('invStockUnit')?.value || 'All';
        const statusFilter = document.getElementById('invStockStatus')?.value || 'All';

        const filtered = items.filter(i => {
            if (unitFilter !== 'All' && i.unit !== unitFilter) return false;
            const qty = parseInt(i.quantity) || 0;
            const min = parseInt(i.minStock) || 0;

            if (statusFilter === 'low' && qty > min) return false;
            if (statusFilter === 'in_stock' && qty <= min) return false;
            if (statusFilter === 'out_of_stock' && qty > 0) return false;

            if (searchInput !== '') {
                const hay = `${i.code} ${i.name} ${i.description || ''} ${i.unit || ''}`.toLowerCase();
                if (!hay.includes(searchInput)) return false;
            }
            return true;
        });

        if (items.length === 0) {
            tbody.innerHTML = `<tr><td colspan="7" style="text-align:center; padding: 40px 20px; color:var(--text-sub);">
                <i class="fas fa-boxes" style="font-size: 2rem; color: #cbd5e1; margin-bottom: 8px; display: block;"></i>
                <strong style="font-size: 0.95rem; color: var(--text-main);">No inventory items recorded yet.</strong>
                <p style="margin: 4px 0 0; font-size: 0.85rem; color: var(--text-muted);">Click <strong>+ Add New Item</strong> or <strong>Restock Supplies</strong> to start tracking supplies.</p>
            </td></tr>`;
            return;
        }

        if (filtered.length === 0) {
            tbody.innerHTML = `<tr><td colspan="7" style="text-align:center; padding: 25px; color:var(--text-sub);">No inventory items found matching filters.</td></tr>`;
            return;
        }

        let html = '';
        filtered.forEach((i, idx) => {
            const qty = parseInt(i.quantity) || 0;
            const min = parseInt(i.minStock) || 0;
            let qtyDisplay = '';

            if (qty === 0) {
                qtyDisplay = `<span class="badge badge-out-of-stock">0 (Out of Stock)</span>`;
            } else if (qty <= min) {
                qtyDisplay = `<span class="badge badge-low-stock"><i class="fas fa-exclamation-triangle"></i> ${qty} (Low Stock)</span>`;
            } else {
                qtyDisplay = `<strong style="font-size:1.1rem; color:#0f172a;">${qty}</strong>`;
            }

            const itemKey = (i.code && i.code !== 'undefined') ? i.code : (i.id && i.id !== 'undefined' ? i.id : ('inv_' + idx));
            const safeKey = String(itemKey).replace(/'/g, "\\'");
            const codeSubtext = (i.code && i.code !== 'undefined') ? `<br><small style="color:var(--text-muted); font-family:monospace;">${this.escapeHTML(i.code)}</small>` : '';

            html += `<tr>
                <td>
                    <strong style="color:var(--text-main); font-size:0.95rem;">${this.escapeHTML(i.name)}</strong>
                    ${codeSubtext}
                </td>
                <td style="color:var(--text-sub);">${this.escapeHTML(i.description || '-')}</td>
                <td><span class="badge-unit">${this.escapeHTML(i.unit)}</span></td>
                <td style="text-align:right;">${qtyDisplay}</td>
                <td style="text-align:right; color:var(--text-sub);">${min}</td>
                <td>${i.dateReceived || '-'}</td>
                <td class="no-print" style="text-align:center; white-space:nowrap;">
                    <button class="btn btn-sm btn-table-action" style="background:#ecfdf5; color:#047857; border:1px solid #a7f3d0;" onclick="window.app.openReleaseModal('${safeKey}')" title="Release Item">
                        <i class="fas fa-hand-holding"></i> Release
                    </button>
                    <button class="btn btn-sm btn-table-action" style="background:#eff6ff; color:#1d4ed8; border:1px solid #bfdbfe;" onclick="window.app.openStockInModal('restock', '${safeKey}')" title="Stock In">
                        <i class="fas fa-plus"></i> Restock
                    </button>
                    <button class="btn btn-sm btn-table-action" style="background:#fffbeb; color:#b45309; border:1px solid #fde68a;" onclick="window.app.openAdjustModal('${safeKey}')" title="Count Adjustment">
                        <i class="fas fa-sliders-h"></i>
                    </button>
                </td>
            </tr>`;
        });
        tbody.innerHTML = html;
    },

    renderInventoryTransactionsTable: function() {
        const tbody = document.getElementById('invTxnTableBody');
        if (!tbody) return;

        const txns = this.state.inventoryTransactions || [];
        const searchInput = (document.getElementById('invTxnSearch')?.value || '').toLowerCase().trim();
        const deptFilter = document.getElementById('invTxnDept')?.value || 'All';
        const typeFilter = document.getElementById('invTxnType')?.value || 'All';

        const filtered = txns.filter(t => {
            if (deptFilter !== 'All' && t.department !== deptFilter) return false;
            if (typeFilter !== 'All' && t.type !== typeFilter) return false;
            if (searchInput !== '') {
                const hay = `${t.id} ${t.itemName || ''} ${t.recipientName || ''} ${t.department || ''} ${t.purpose || ''}`.toLowerCase();
                if (!hay.includes(searchInput)) return false;
            }
            return true;
        }).sort((a,b) => new Date(b.timestamp) - new Date(a.timestamp));

        if (filtered.length === 0) {
            tbody.innerHTML = `<tr><td colspan="10" style="text-align:center; padding: 25px; color:var(--text-sub);">No transaction records found matching filters.</td></tr>`;
            return;
        }

        let html = '';
        filtered.forEach(t => {
            let typeBadge = '';
            if (t.type === 'Release') {
                typeBadge = '<span class="badge badge-release"><i class="fas fa-arrow-down"></i> Release</span>';
            } else if (t.type === 'Restock') {
                typeBadge = '<span class="badge badge-restock"><i class="fas fa-arrow-up"></i> Restock</span>';
            } else {
                typeBadge = '<span class="badge badge-adjust"><i class="fas fa-sliders-h"></i> Adjust</span>';
            }

            let dateStr = t.timestamp;
            try {
                const dt = new Date(t.timestamp);
                dateStr = `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')} ${String(dt.getHours()%12||12).padStart(2,'0')}:${String(dt.getMinutes()).padStart(2,'0')} ${dt.getHours()>=12?'PM':'AM'}`;
            } catch(e) {}

            html += `<tr>
                <td><span style="font-family:monospace; font-weight:700; color:var(--text-sub);">${this.escapeHTML(t.id)}</span></td>
                <td style="font-size:0.85rem;">${dateStr}</td>
                <td><strong>${this.escapeHTML(t.itemName)}</strong></td>
                <td>${typeBadge}</td>
                <td style="text-align:right;"><strong>${t.quantity}</strong> ${this.escapeHTML(t.unit || '')}</td>
                <td><span class="badge-unit">${this.escapeHTML(t.department || '-')}</span></td>
                <td>${this.escapeHTML(t.recipientName || '-')}</td>
                <td>${this.escapeHTML(t.approvedBy || '-')}</td>
                <td style="text-align:right;"><strong>${t.balanceAfter !== undefined ? t.balanceAfter : '-'}</strong></td>
                <td style="font-size:0.85rem; color:var(--text-sub);">${this.escapeHTML(t.purpose || '-')}</td>
            </tr>`;
        });
        tbody.innerHTML = html;
    },

    openReleaseModal: function(itemCode = '') {
        const select = document.getElementById('relItemSelect');
        const overlay = document.getElementById('modalInventoryRelease');
        if (!overlay || !select) return;

        const items = this.state.inventoryItems || [];

            const codeLbl = (i.code && i.code !== 'undefined') ? ` (${i.code})` : '';

        document.getElementById('relRecipient').value = '';

        document.getElementById('relPurpose').value = '';

    closeReleaseModal: function() {
        const overlay = document.getElementById('modalInventoryRelease');
        if (overlay) overlay.classList.remove('open');
    },

    onReleaseItemSelect: function() {
        const select = document.getElementById('relItemSelect');
        const itemCode = select ? select.value : '';
        const item = (this.state.inventoryItems || []).find(i => 
            (i.code && i.code === itemCode) || 
            (i.id && i.id === itemCode) || 
            (i.name && i.name === itemCode)
        );

        const stockText = document.getElementById('relAvailableStockText');
        const unitDisplay = document.getElementById('relUnitDisplay');
        const qtyInput = document.getElementById('relQuantity');

        if (item) {
            const qty = parseInt(item.quantity) || 0;
            stockText.textContent = `${qty} ${item.unit}`;
            stockText.style.color = qty <= item.minStock ? 'var(--danger-color)' : 'var(--primary-dark)';
            unitDisplay.value = item.unit;
            qtyInput.max = qty;
        } else {
            stockText.textContent = '--';
            unitDisplay.value = '';
            qtyInput.removeAttribute('max');
        }
        this.onReleaseQtyInput();

    onReleaseQtyInput: function() {
        const select = document.getElementById('relItemSelect');
        const itemCode = select ? select.value : '';
        const item = (this.state.inventoryItems || []).find(i => 
            (i.code && i.code === itemCode) || 
            (i.id && i.id === itemCode) || 
            (i.name && i.name === itemCode)
        );
        const qtyVal = parseInt(document.getElementById('relQuantity')?.value) || 0;
        const feedback = document.getElementById('relQtyFeedback');

        if (!feedback) return;

        if (item && qtyVal > (parseInt(item.quantity) || 0)) {
            feedback.textContent = `Warning: Requested quantity (${qtyVal}) exceeds available stock (${item.quantity} ${item.unit})`;
            feedback.style.display = 'block';
        } else {
            feedback.style.display = 'none';
        }
    },

    validateAndPromptReleaseConfirm: function() {
        const dept = document.getElementById('relDepartment').value.trim();
        const itemCode = document.getElementById('relItemSelect').value;
        const qty = parseInt(document.getElementById('relQuantity').value) || 0;
        const rec = document.getElementById('relRecipient').value.trim();
        const app = document.getElementById('relApprovedBy').value.trim();
        const purpose = document.getElementById('relPurpose').value.trim();

        if (!dept) {
            Toast.fire({ icon: 'warning', title: 'Please select a Requesting Department' });
            return;
        }
        if (!itemCode) {
            Toast.fire({ icon: 'warning', title: 'Please select an Item to release' });
            return;
        }
        if (qty <= 0) {
            Toast.fire({ icon: 'warning', title: 'Please enter a valid Quantity greater than 0' });
            return;
        }
        if (!rec) {
            Toast.fire({ icon: 'warning', title: 'Please enter Receiver / Requisitioner Name' });
            return;
        }

        const item = (this.state.inventoryItems || []).find(i => 
            (i.code && i.code === itemCode) || 
            (i.id && i.id === itemCode) || 
            (i.name && i.name === itemCode)
        );
        if (!item) {
            Toast.fire({ icon: 'error', title: 'Selected item not found' });
            return;
        }

        const currentQty = parseInt(item.quantity) || 0;
        if (qty > currentQty) {
            Swal.fire({
                title: 'Insufficient Stock',
                html: `Requested <strong>${qty} ${item.unit}</strong>, but only <strong>${currentQty} ${item.unit}</strong> are available in stock.`,
                icon: 'error',
                confirmButtonColor: '#ef4444'
            });
            return;
        }

        const remaining = currentQty - qty;

        const resolvedCode = (item.code && item.code !== 'undefined') ? item.code : (item.id && item.id !== 'undefined' ? item.id : '');
        const codeSub = resolvedCode ? `<small style="color:#64748b;">(${this.escapeHTML(resolvedCode)})</small>` : '';

        Swal.fire({
            title: 'Confirm Supply Requisition',
            html: `
                <div style="text-align:left; font-size:0.95rem; line-height:1.6; background:#f8fafc; padding:16px; border-radius:8px; border:1px solid #e2e8f0;">
                    <p style="margin:0 0 8px;"><strong>Item:</strong> ${this.escapeHTML(item.name)} ${codeSub}</p>
                    <p style="margin:0 0 8px;"><strong>Department:</strong> ${this.escapeHTML(dept)}</p>
                    <p style="margin:0 0 8px;"><strong>Quantity to Release:</strong> <span style="color:#2563eb; font-weight:700; font-size:1.05rem;">${qty} ${this.escapeHTML(item.unit)}</span></p>
                    <p style="margin:0 0 8px;"><strong>Received By:</strong> ${this.escapeHTML(rec)}</p>
                    ${app ? `<p style="margin:0 0 8px;"><strong>Approved By:</strong> ${this.escapeHTML(app)}</p>` : ''}
                    <div style="border-top:1px dashed #cbd5e1; margin:12px 0 0; padding-top:10px; display:flex; justify-content:space-between; align-items:center;">
                        <span>Current Stock: <strong>${currentQty} ${item.unit}</strong></span>
                        <span>Stock After: <strong style="color:${remaining <= item.minStock ? '#ef4444' : '#10b981'}; font-size:1.05rem;">${remaining} ${item.unit}</strong></span>
                    </div>
                </div>
            `,
            icon: 'question',
            showCancelButton: true,
            confirmButtonColor: '#10b981',
            cancelButtonColor: '#6b7280',
            confirmButtonText: '<i class="fas fa-check"></i> Confirm & Release',
            cancelButtonText: 'Cancel'
        }).then((result) => {
            if (result.isConfirmed) {
                this.executeReleaseItem({
                    dept: dept,
                    item: item,
                    qty: qty,
                    rec: rec,
                    app: app,
                    purpose: purpose,
                    remaining: remaining
                });
            }
        });
    },

    executeReleaseItem: function(payload) {
        const { dept, item, qty, rec, app, purpose, remaining } = payload;

        item.quantity = remaining;

        const txn = {
            id: 'TXN-' + Date.now().toString().slice(-6),
            itemCode: item.code,
            itemName: item.name,
            unit: item.unit,
            type: 'Release',
            quantity: qty,
            department: dept,
            recipientName: rec,
            approvedBy: app || 'Authorized Officer',
            timestamp: new Date().toISOString(),
            balanceAfter: remaining,
            purpose: purpose || 'Official department requisition'
        };

        this.state.inventoryTransactions.unshift(txn);
        this.saveInventoryStorage();
        this.closeReleaseModal();
        this.renderInventory();

        Swal.fire({
            title: 'Requisition Released!',
            html: `Successfully released <strong>${qty} ${item.unit}</strong> of <strong>${this.escapeHTML(item.name)}</strong> to <strong>${this.escapeHTML(dept)}</strong>.<br><br>Remaining Stock: <strong>${remaining} ${item.unit}</strong>`,
            icon: 'success',
            confirmButtonColor: '#2563eb'
        });
    },

    openStockInModal: function(mode = 'restock', itemCode = '') {
        const select = document.getElementById('restockItemSelect');
        const overlay = document.getElementById('modalInventoryStockIn');
        if (!overlay || !select) return;

        const items = this.state.inventoryItems || [];
        let opts = '<option value="">-- Choose Item to Restock --</option>';
        items.forEach((i, idx) => {
            const key = (i.code && i.code !== 'undefined') ? i.code : (i.id && i.id !== 'undefined' ? i.id : ('inv_' + idx));
            const codeLbl = (i.code && i.code !== 'undefined') ? ` (${i.code})` : '';
            opts += `<option value="${key}">${this.escapeHTML(i.name)}${codeLbl} — Current: ${i.quantity} ${this.escapeHTML(i.unit)}</option>`;
        });
        select.innerHTML = opts;

        const today = new Date().toISOString().split('T')[0];
        document.getElementById('restockDate').value = today;
        document.getElementById('newItemDate').value = today;
        document.getElementById('restockQuantity').value = '';
        document.getElementById('restockSupplier').value = '';

        if (itemCode) {
            select.value = itemCode;
            this.onRestockItemSelect();
        }

        this.toggleStockInMode(mode);
        overlay.classList.add('open');
    },

    closeStockInModal: function() {
        const overlay = document.getElementById('modalInventoryStockIn');
        if (overlay) overlay.classList.remove('open');
    },

    toggleStockInMode: function(mode) {
        const tabReplenish = document.getElementById('tabModeReplenish');
        const tabNewItem = document.getElementById('tabModeNewItem');
        const secReplenish = document.getElementById('stockInReplenishSection');
        const secNewItem = document.getElementById('stockInNewItemSection');
        const titleEl = document.getElementById('invStockInTitle');

        if (mode === 'new') {
            if (tabNewItem) tabNewItem.classList.add('active');
            if (tabReplenish) tabReplenish.classList.remove('active');
            if (secNewItem) secNewItem.classList.remove('hidden');
            if (secReplenish) secReplenish.classList.add('hidden');
            if (titleEl) titleEl.textContent = 'Register New Catalog Item';
            const nextCode = 'INV-' + String((this.state.inventoryItems || []).length + 1).padStart(3, '0');
            document.getElementById('newItemCode').value = nextCode;
            document.getElementById('newItemName').value = '';
            document.getElementById('newItemDesc').value = '';
            document.getElementById('newItemQty').value = '0';
            document.getElementById('newItemMin').value = '5';
        } else {
            if (tabReplenish) tabReplenish.classList.add('active');
            if (tabNewItem) tabNewItem.classList.remove('active');
            if (secReplenish) secReplenish.classList.remove('hidden');
            if (secNewItem) secNewItem.classList.add('hidden');
            if (titleEl) titleEl.textContent = 'Restock Existing Supplies';
        }
    },

    onRestockItemSelect: function() {
        const select = document.getElementById('restockItemSelect');
        const itemCode = select ? select.value : '';
        const item = (this.state.inventoryItems || []).find(i => 
            (i.code && i.code === itemCode) || 
            (i.id && i.id === itemCode) || 
            (i.name && i.name === itemCode)
        );
        const textEl = document.getElementById('restockCurrentStockText');
        if (textEl) {
            textEl.textContent = item ? `${item.quantity} ${item.unit}` : '--';
        }
    },

    saveStockIn: function() {
        const isNewItem = !document.getElementById('stockInNewItemSection').classList.contains('hidden');

        if (isNewItem) {
            const code = document.getElementById('newItemCode').value.trim();
            const name = document.getElementById('newItemName').value.trim();
            const desc = document.getElementById('newItemDesc').value.trim();
            const unit = document.getElementById('newItemUnit').value;
            const qty = parseInt(document.getElementById('newItemQty').value) || 0;
            const min = parseInt(document.getElementById('newItemMin').value) || 5;
            const date = document.getElementById('newItemDate').value || new Date().toISOString().split('T')[0];

            if (!name) {
                Toast.fire({ icon: 'warning', title: 'Item Name is required' });
                return;
            }

            const itemCode = code || ('INV-' + Date.now().toString().slice(-4));
            const newItem = {
                code: itemCode,
                name: name,
                description: desc,
                unit: unit,
                quantity: qty,
                minStock: min,
                dateReceived: date,
                category: 'General Supplies'
            };

            this.state.inventoryItems.push(newItem);

            if (qty > 0) {
                this.state.inventoryTransactions.unshift({
                    id: 'TXN-' + Date.now().toString().slice(-6),
                    itemCode: itemCode,
                    itemName: name,
                    unit: unit,
                    type: 'Restock',
                    quantity: qty,
                    department: 'General Warehouse',
                    recipientName: 'Property Custodian',
                    approvedBy: this.state.currentUser || 'Admin',
                    timestamp: new Date().toISOString(),
                    balanceAfter: qty,
                    purpose: 'Initial catalog stock registration'
                });
            }

            this.saveInventoryStorage();
            this.renderInventory();
            this.closeStockInModal();
            Toast.fire({ icon: 'success', title: `Item "${name}" registered successfully` });
        } else {
            const itemCode = document.getElementById('restockItemSelect').value;
            const qty = parseInt(document.getElementById('restockQuantity').value) || 0;
            const supplier = document.getElementById('restockSupplier').value.trim();
            const date = document.getElementById('restockDate').value || new Date().toISOString().split('T')[0];

            if (!itemCode) {
                Toast.fire({ icon: 'warning', title: 'Please select an Item to restock' });
                return;
            }
            if (qty <= 0) {
                Toast.fire({ icon: 'warning', title: 'Please enter a valid Quantity added' });
                return;
            }

            const item = (this.state.inventoryItems || []).find(i => 
                (i.code && i.code === itemCode) || 
                (i.id && i.id === itemCode) || 
                (i.name && i.name === itemCode)
            );
            if (!item) return;

            item.quantity = (parseInt(item.quantity) || 0) + qty;
            item.dateReceived = date;

            const resolvedCode = (item.code && item.code !== 'undefined') ? item.code : (item.id && item.id !== 'undefined' ? item.id : '');
            this.state.inventoryTransactions.unshift({
                id: 'TXN-' + Date.now().toString().slice(-6),
                itemCode: resolvedCode,
                itemName: item.name,
                unit: item.unit,
                type: 'Restock',
                quantity: qty,
                department: 'Central Supplies Warehouse',
                recipientName: 'Property Custodian',
                approvedBy: this.state.currentUser || 'Admin',
                timestamp: new Date().toISOString(),
                balanceAfter: item.quantity,
                purpose: supplier ? `Replenishment delivery from ${supplier}` : 'Regular supply replenishment'
            });

            this.saveInventoryStorage();
            this.renderInventory();
            this.closeStockInModal();
            Toast.fire({ icon: 'success', title: `Restocked ${qty} ${item.unit} of ${item.name}` });
        }
    },

    openAdjustModal: function(itemKey) {
        const overlay = document.getElementById('modalInventoryAdjust');
        if (!overlay) {
            console.error('Adjustment modal not found in DOM');
            return;
        }

        const item = (this.state.inventoryItems || []).find(i => 
            (i.code && i.code === itemKey) || 
            (i.id && i.id === itemKey) || 
            (i.name && i.name === itemKey)
        );
        if (!item) {
            Toast.fire({ icon: 'warning', title: 'Item not found for adjustment' });
            return;
        }

        const resolvedCode = (item.code && item.code !== 'undefined') ? item.code : (item.id && item.id !== 'undefined' ? item.id : '');
        document.getElementById('adjItemCode').value = resolvedCode || item.name;
        document.getElementById('adjItemName').value = resolvedCode ? `${item.name} (${resolvedCode})` : item.name;
        document.getElementById('adjSystemQty').value = item.quantity;
        document.getElementById('adjPhysicalQty').value = item.quantity;
        document.getElementById('adjAuthorizedBy').value = this.state.currentUser || 'Auditor / Property Officer';
        document.getElementById('adjRemarks').value = '';

        this.onAdjustCountInput();
        overlay.classList.add('open');
    },

    closeAdjustModal: function() {
        const overlay = document.getElementById('modalInventoryAdjust');
        if (overlay) overlay.classList.remove('open');
    },

    onAdjustCountInput: function() {
        const sysQty = parseInt(document.getElementById('adjSystemQty')?.value) || 0;
        const physQty = parseInt(document.getElementById('adjPhysicalQty')?.value) || 0;
        const diff = physQty - sysQty;
        const diffText = document.getElementById('adjDiffText');
        const diffBox = document.getElementById('adjDiffBox');

        if (!diffText || !diffBox) return;

        if (diff > 0) {
            diffText.textContent = `+${diff} Units (Surplus / Found)`;
            diffBox.style.background = '#ecfdf5';
            diffBox.style.borderColor = '#a7f3d0';
            diffBox.style.color = '#065f46';
        } else if (diff < 0) {
            diffText.textContent = `${diff} Units (Deficit / Shortage)`;
            diffBox.style.background = '#fef2f2';
            diffBox.style.borderColor = '#fca5a5';
            diffBox.style.color = '#991b1b';
        } else {
            diffText.textContent = '0 Units (Balanced / No Discrepancy)';
            diffBox.style.background = '#f8fafc';
            diffBox.style.borderColor = '#cbd5e1';
            diffBox.style.color = '#475569';
        }
    },

    saveAdjust: function() {
        const itemCode = document.getElementById('adjItemCode').value;
        const physQty = parseInt(document.getElementById('adjPhysicalQty').value);
        const reason = document.getElementById('adjReason').value;
        const auth = document.getElementById('adjAuthorizedBy').value.trim();
        const remarks = document.getElementById('adjRemarks').value.trim();

        if (isNaN(physQty) || physQty < 0) {
            Toast.fire({ icon: 'warning', title: 'Please enter a valid non-negative physical count' });
            return;
        }

        const item = (this.state.inventoryItems || []).find(i => 
            (i.code && i.code === itemCode) || 
            (i.id && i.id === itemCode) || 
            (i.name && i.name === itemCode)
        );
        if (!item) {
            Toast.fire({ icon: 'error', title: 'Target item not found' });
            return;
        }

        const oldQty = parseInt(item.quantity) || 0;
        const diff = physQty - oldQty;
        item.quantity = physQty;

        const resolvedCode = (item.code && item.code !== 'undefined') ? item.code : (item.id && item.id !== 'undefined' ? item.id : '');
        this.state.inventoryTransactions.unshift({
            id: 'TXN-' + Date.now().toString().slice(-6),
            itemCode: resolvedCode,
            itemName: item.name,
            unit: item.unit,
            type: 'Adjustment',
            quantity: Math.abs(diff),
            department: 'Property Reconciliation',
            recipientName: auth || 'Property Custodian',
            approvedBy: auth || 'Property Officer',
            timestamp: new Date().toISOString(),
            balanceAfter: physQty,
            purpose: `Stock Count Adjustment: ${reason}. (${diff >= 0 ? '+' : ''}${diff} ${item.unit})${remarks ? ' — ' + remarks : ''}`
        });

        this.saveInventoryStorage();
        this.renderInventory();
        this.closeAdjustModal();
        Toast.fire({ icon: 'success', title: `Stock for ${item.name} adjusted to ${physQty} ${item.unit}` });
    },

    deleteInventoryItem: function(itemKey) {
        const item = (this.state.inventoryItems || []).find(i => 
            (i.code && i.code === itemKey) || 
            (i.id && i.id === itemKey) || 
            (i.name && i.name === itemKey)
        );
        if (!item) return;

        Swal.fire({
            title: 'Delete Supply Item?',
            text: `Are you sure you want to remove "${item.name}" from the inventory catalog?`,
            icon: 'warning',
            showCancelButton: true,
            confirmButtonColor: '#ef4444',
            cancelButtonColor: '#6b7280',
            confirmButtonText: 'Yes, delete!'
        }).then((result) => {
            if (result.isConfirmed) {
                this.state.inventoryItems = this.state.inventoryItems.filter(i => 
                    i !== item && i.code !== itemKey && i.id !== itemKey
                );
                this.saveInventoryStorage();
                this.renderInventory();
                Toast.fire({ icon: 'success', title: 'Item deleted from inventory' });
            }
        });
    },

    resetInventoryData: function() {
        Swal.fire({
            title: 'Clear Inventory Data?',
            text: 'Are you sure you want to completely clear the local inventory items and transactions?',
            icon: 'warning',
            showCancelButton: true,
            confirmButtonColor: '#ef4444',
            cancelButtonColor: '#6b7280',

        }).then((result) => {

                this.state.inventoryTransactions = [];
                localStorage.removeItem('meedo_legacy_inventory_items');
                localStorage.removeItem('meedo_legacy_inventory_transactions');
                this.saveInventoryStorage();
                this.renderInventory();
                Toast.fire({ icon: 'success', title: 'Inventory data cleared' });
            }
        });
    },
