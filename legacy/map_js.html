<script>
  const Toast = Swal.mixin({ 
      toast: true, position: window.innerWidth < 768 ? 'top' : 'top-end', 
      showConfirmButton: false, timer: 3000, timerProgressBar: true, 
      didOpen: (toast) => { toast.addEventListener('mouseenter', Swal.stopTimer); toast.addEventListener('mouseleave', Swal.resumeTimer); } 
  });

  window.app = {
    state: {
      activeTab: 'wet', currentUser: null, userRole: 'Staff', userSection: 'A', // Dynamic Section Assignment
      stallData: {}, rawRows: [], monitoringHistory: [], latestReadings: {}, electricBills: [], opifData: [], slaughterData: [], uniqueClients: [], todaData: [], memberData: [], cemeteryData: [],
      csuData: [], columnIHeader: 'Column I', selectedStallId: null, currentStatus: 'Non-Compliant', pendingUpload: null, 
      searchTerm: '', filterStatus: 'all', reportActiveTab: 'general', reportPage: 1, reportLimit: 20,
      genFilterStatus: 'All', genFilterSection: 'All', genFilterYear: 'All', genSort: 'Stall No',
      compFilterMonth: 'latest', compFilterMetric: 'all', compSort: 'Stall No',
      isBatchMode: false
    },

    icons: { user: `<i class="fas fa-user stall-icon"></i>`, cemCalendarInstance: null, },

    // Helper to prevent Cross-Site Scripting (XSS)
    escapeHTML: function(str) {
        return String(str).replace(/[&<>'"]/g, match => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[match]));
    },

    init: function() {
      this.initOpifData(); // Initialize OPIF Data Model
      document.getElementById('loginUser').focus();
      document.getElementById('loginPass').addEventListener('keypress', (e) => { if (e.key === 'Enter') this.login(); });
    },

    // --- AUTH & SIDEBAR ---
    toggleAuth: function(view) {
        if(view === 'register') { document.getElementById('loginCard').classList.add('hidden'); document.getElementById('registerCard').classList.remove('hidden'); }
        else { document.getElementById('registerCard').classList.add('hidden'); document.getElementById('loginCard').classList.remove('hidden'); }
    },
    register: function() {
        const user = document.getElementById('regUser').value; 
        const pass = document.getElementById('regPass').value; 
        const conf = document.getElementById('regPassConfirm').value; 
        const err = document.getElementById('regError');
        
        // Grab section from dropdown (Default to A if not found)
        const sectionEl = document.getElementById('regSection');
        const section = sectionEl ? sectionEl.value : 'A'; 
        
        const btn = document.getElementById('btnReg'); 
        
        if(!user || !pass) { err.textContent = "All fields required"; err.style.display = 'block'; return; }
        if(pass !== conf) { err.textContent = "Passwords do not match"; err.style.display = 'block'; return; }
        
        btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Registering...';
        
        if (window.google && window.google.script) {
            google.script.run.withSuccessHandler(res => {
                btn.disabled = false; btn.innerHTML = "Register";
                if(res.success) {
                    document.getElementById('regUser').value = ''; document.getElementById('regPass').value = ''; document.getElementById('regPassConfirm').value = '';
                    Swal.fire({ title: 'Registration Successful!', text: 'Please wait for admin approval.', icon: 'success', confirmButtonText: 'OK', confirmButtonColor: '#2563eb' }).then(() => { this.toggleAuth('login'); });
                } else { err.textContent = res.message; err.style.display = 'block'; }
            }).registerUser(user, pass, section); // Passing section to Backend!
        }
    },
    login: function() {
       const user = document.getElementById('loginUser').value; const pass = document.getElementById('loginPass').value; const btn = document.getElementById('btnLogin'); const errorMsg = document.getElementById('loginError');
       if (!user || !pass) { errorMsg.textContent = "Enter user and password"; errorMsg.style.display = 'block'; return; }
       btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Verifying...'; btn.disabled = true; errorMsg.style.display = 'none';
       if (window.google && window.google.script) {
          google.script.run.withSuccessHandler(res => {
             if (res.success) {
                 this.state.currentUser = res.username; 
                 this.state.userRole = res.role;
                 
                 // Dynamically assign backend section, Default to ALL for Admin
                 this.state.userSection = res.role === 'Admin' ? 'ALL' : (res.section || 'A'); 
                 
                 document.getElementById('sidebarUser').textContent = res.username; document.getElementById('sidebarRole').textContent = res.role;
                 if(res.role === 'Admin') document.getElementById('navUserMgmt').classList.remove('hidden');
                 
                 // TRIGGER ROLE-BASED ACCESS CONTROL
                 this.applyRBAC();
                 
                 this.startLoadingSequence(); Toast.fire({ icon: 'success', title: 'Welcome back, ' + res.username });
             } else { errorMsg.textContent = res.message; errorMsg.style.display = 'block'; btn.innerHTML = "Sign In"; btn.disabled = false; }
          }).withFailureHandler(err => { errorMsg.textContent = "Error: " + err.message; errorMsg.style.display = 'block'; btn.innerHTML = "Sign In"; btn.disabled = false; }).checkLogin(user, pass);
       } else {
          errorMsg.textContent = "Unable to connect to server."; errorMsg.style.display = 'block'; btn.innerHTML = "Sign In"; btn.disabled = false; 
       }
    },
    logout: function(){
         if(confirm('Are you sure you want to log out?')) {
             const user = this.state.currentUser || 'Unknown';
             if (window.google && window.google.script) google.script.run.logClientEvent(user, 'Logout', 'User logged out manually');
             document.getElementById('loginUser').value=''; document.getElementById('loginPass').value=''; this.state.currentUser = null; this.state.userRole = null;
             document.getElementById('navUserMgmt').classList.add('hidden'); document.getElementById('mainContainer').classList.remove('visible');
             document.getElementById('authScreen').style.display = 'flex'; document.getElementById('fullPageLoader').style.display = 'none';
             this.toggleAuth('login'); document.getElementById('btnLogin').innerHTML = "Sign In"; document.getElementById('btnLogin').disabled = false; document.getElementById('appSidebar').classList.remove('open');
         }
    },
    applyRBAC: function() {
        const role = this.state.userRole;
        const section = this.state.userSection; 

        // Define which wrapper ID maps to which assigned section letter
        const sectionMap = {
            'navMarketWrapper': 'A',
            'navSlaughterWrapper': 'B',
            'navCemeteryWrapper': 'C',
            'navTransportWrapper': 'D',
            'navCsuWrapper': 'F'
        };

        // Hide or Show the navigation wrappers dynamically
        Object.keys(sectionMap).forEach(wrapperId => {
            const el = document.getElementById(wrapperId);
            if (el) {
                // Show if Admin, or if the user's section matches the menu's section
                if (role === 'Admin' || section === 'ALL' || section === sectionMap[wrapperId]) {
                    el.style.display = 'block';
                } else {
                    el.style.display = 'none';
                }
            }
        });

        // Automatically load them into their specific screen upon login
        if (role !== 'Admin' && section !== 'ALL') {
            if(section === 'A') this.navigate('map');
            else if(section === 'B') this.navigate('slaughter');
            else if(section === 'C') this.navigate('cem_booking');
            else if(section === 'D') this.navigate('transport_toda');
            else if(section === 'E') this.navigate('opif');
            else if(section === 'F') this.navigate('csu');
        } else {
            this.navigate('map'); // Admins land on the main map
        }
    },

    startLoadingSequence: function() {
       document.getElementById('authScreen').style.display = 'none'; document.getElementById('fullPageLoader').style.display = 'flex'; this.loadData();
    },
    
    toggleSidebar: function() { document.getElementById('appSidebar').classList.toggle('open'); },
    
    toggleNavMenu: function(menuId) {
        const submenu = document.getElementById(menuId);
        if (!submenu) return;
        const parent = submenu.previousElementSibling;
        const isOpen = submenu.classList.contains('open');
        
        // Close all submenus for an accordion effect (optional, feels cleaner)
        document.querySelectorAll('.nav-submenu').forEach(el => {
            el.classList.remove('open');
            if (el.previousElementSibling) el.previousElementSibling.classList.remove('open');
        });
        
        // If it wasn't open, open it now
        if (!isOpen) {
            submenu.classList.add('open');
            parent.classList.add('open');
        }
    },

    navigate: function(viewId) {
        // Handle Active states across both parent menus and sub-items
        document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
        
        if (event && event.currentTarget) {
            event.currentTarget.classList.add('active');
            // Keep the parent tab highlighted if a sub-item is active
            const parentSub = event.currentTarget.closest('.nav-submenu');
            if (parentSub && parentSub.previousElementSibling) {
                parentSub.previousElementSibling.classList.add('active');
            }
        }
        
        // Handle View Section switching
        document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active')); 
        
        // Close sidebar on mobile devices after clicking a link
        if(window.innerWidth < 768) {
            document.getElementById('appSidebar').classList.remove('open');
        }

        if(viewId === 'map') document.getElementById('viewMap').classList.add('active');
        else if (viewId === 'reports') { document.getElementById('viewReports').classList.add('active'); this.renderReportView(); }
        else if (viewId === 'users') { document.getElementById('viewUsers').classList.add('active'); this.loadUsers(); }
        else if (viewId === 'monitoring') { document.getElementById('viewMonitoring').classList.add('active'); this.populateMonitoringStalls(); }
        else if (viewId === 'opif') { 
            // NEW ROUTE FOR OPIF
            document.getElementById('viewOpif').classList.add('active'); 
            document.getElementById('opifContentArea').innerHTML = this.templates.opifReportHTML();
            this.renderOpifTable();
        }

        else if (viewId === 'csu') {
            document.getElementById('viewCsu').classList.add('active');
            this.csu.loadData(); // Load saved local data
        }

        else if (viewId === 'slaughter') { 
            document.getElementById('viewSlaughter').classList.add('active'); 
            this.renderSlaughterReport(); 
        }
        else if (viewId === 'ebill') { 
            document.getElementById('viewEbill').classList.add('active'); 
            
            // Reset Batch Mode UI
            this.state.isBatchMode = false;
            if(document.getElementById('ebillBatchContainer')) document.getElementById('ebillBatchContainer').classList.add('hidden');
            if(document.getElementById('btnToggleBatch')) document.getElementById('btnToggleBatch').innerHTML = '<i class="fas fa-table"></i> Batch Entry Mode';
            document.getElementById('ebillStallSelect').style.display = 'block';
            
            this.populateEbillStalls();
            if(!document.getElementById('ebillDueDate').value) {
                let d = new Date(); d.setDate(d.getDate() + 15);
                document.getElementById('ebillDueDate').value = d.toISOString().split('T')[0];
                d.setDate(d.getDate() + 5);
                document.getElementById('ebillDiscDate').value = d.toISOString().split('T')[0];
            }
            this.renderEbillSummary(); // Update the summary right away
        }
        // --- TRANSPORT TERMINAL LOGIC ---
        else if (viewId.startsWith('transport_')) {
            document.getElementById('viewTransport').classList.add('active');
            
            document.getElementById('tabTodaList').classList.remove('active');
            document.getElementById('tabTodaMembers').classList.remove('active');
            document.getElementById('tabTodaReport').classList.remove('active');
            document.getElementById('containerTodaList').classList.add('hidden');
            document.getElementById('containerTodaMembers').classList.add('hidden');
            document.getElementById('containerTodaReport').classList.add('hidden');

            if (viewId === 'transport_toda') {
                document.getElementById('tabTodaList').classList.add('active');
                document.getElementById('containerTodaList').classList.remove('hidden');
                this.renderTodaTable();
            } else if (viewId === 'transport_members') {
                document.getElementById('tabTodaMembers').classList.add('active');
                document.getElementById('containerTodaMembers').classList.remove('hidden');
                this.populateTodaDropdown();
            } else if (viewId === 'transport_report') {
                document.getElementById('tabTodaReport').classList.add('active');
                document.getElementById('containerTodaReport').classList.remove('hidden');
                this.renderTodaReport();
            }
        }
        // --- CEMETERY MANAGEMENT LOGIC ---
        else if (viewId.startsWith('cem_')) {
            document.getElementById('viewCemetery').classList.add('active');
            document.getElementById('tabCemBooking').classList.remove('active');
            document.getElementById('tabCemReport').classList.remove('active');
            document.getElementById('containerCemBooking').classList.add('hidden');
            document.getElementById('containerCemReport').classList.add('hidden');

            // [FIXED] Correctly handles both Booking and Report tabs!
            if (viewId === 'cem_booking') {
                document.getElementById('tabCemBooking').classList.add('active');
                document.getElementById('containerCemBooking').classList.remove('hidden');
                this.renderCemeteryTable(); // Render Table instead of Report!
                setTimeout(() => { this.initCemeteryCalendar(); }, 100); 
            } else if (viewId === 'cem_report') {
                document.getElementById('tabCemReport').classList.add('active');
                document.getElementById('containerCemReport').classList.remove('hidden');
                this.renderCemeteryReport(); // Render the actual Report here
            }
        }
    },

    // --- USER MANAGEMENT ---
    loadUsers: function() {
        const tbody = document.getElementById('userTableBody'); 
        tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; padding: 20px;">Loading users...</td></tr>';
        
        if (window.google && window.google.script) {
            google.script.run
                .withSuccessHandler(users => {
                    if (!users || !Array.isArray(users)) {
                        tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; padding: 20px; color: var(--danger-color);">Error loading users from database. Please check configuration.</td></tr>';
                        return;
                    }
                    if (users.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; padding: 20px;">No users found.</td></tr>';
                        return;
                    }
                    
                    let html = '';
                    users.forEach(u => {
                        let badgeClass = u.status === 'Approved' ? 'badge-approved' : (u.status === 'Blocked' ? 'badge-blocked' : 'badge-pending');
                        let actions = '';
                        if(u.role !== 'Admin') {
                            if(u.status === 'Pending' || u.status === 'Blocked') actions += `<button class="btn btn-success btn-sm" onclick="window.app.userAction('${u.username}', 'approve')">Approve</button> `;
                            if(u.status === 'Approved') actions += `<button class="btn btn-danger btn-sm" onclick="window.app.userAction('${u.username}', 'block')">Block</button> `;
                            actions += `<button class="btn btn-ghost btn-sm" style="color:var(--danger-color)" onclick="window.app.userAction('${u.username}', 'delete')"><i class="fas fa-trash"></i></button>`;
                        } else { actions = '<span style="color:var(--text-muted); font-size:0.8rem">Super User</span>'; }
                        html += `<tr><td>${u.username}</td><td><span class="badge ${u.role==='Admin'?'badge-admin':''}">${u.role}</span></td><td><span class="badge ${badgeClass}">${u.status}</span></td><td><div style="display:flex; gap: 8px;">${actions}</div></td></tr>`;
                    });
                    tbody.innerHTML = html;
                })
                .withFailureHandler(err => {
                    tbody.innerHTML = `<tr><td colspan="4" style="text-align:center; padding: 20px; color: var(--danger-color);">Server Error: ${err.message}</td></tr>`;
                    console.error("User load error:", err);
                })
                .getAllUsers();
        }
    },
    userAction: function(username, action) {
        Swal.fire({ title: 'Are you sure?', text: `You are about to ${action} user ${username}.`, icon: 'warning', showCancelButton: true, confirmButtonColor: '#2563eb', cancelButtonColor: '#ef4444', confirmButtonText: 'Yes, proceed!'
        }).then((result) => {
            if (result.isConfirmed && window.google && window.google.script) {
                google.script.run.withSuccessHandler(res => {
                    if(res.success) { Toast.fire({icon:'success', title: 'User updated'}); this.loadUsers(); } else Toast.fire({icon:'error', title: res.message});
                }).updateUserStatus(username, action);
            }
        });
    },

    // --- MAIN APP LOGIC ---
    updateProgressBar: function(percent, text) {
       document.getElementById('loadingProgressBar').style.width = percent + '%'; if(text) document.getElementById('loadingText').textContent = text;
    },
    loadData: function() {
       let progress = 0; this.updateProgressBar(5, "Connecting...");
       const interval = setInterval(() => { if (progress < 90) { progress += Math.floor(Math.random() * 10) + 1; if(progress>90) progress=90; this.updateProgressBar(progress, `Loading... ${progress}%`); } }, 300);

       if (window.google && window.google.script) {
         google.script.run.withSuccessHandler(response => {
            clearInterval(interval); this.updateProgressBar(100, "Done");
            if(response.headers && response.headers.length >= 9) this.state.columnIHeader = response.headers[8]; 
            this.processData(response);
            this.renderMapTabs(); this.renderMap(); this.attachEvents();
            if(document.getElementById('viewMonitoring').classList.contains('active')) {
                this.populateMonitoringStalls();
                if(document.getElementById('monStallSelect').value) this.loadMonitoringData(document.getElementById('monStallSelect').value);
            }
            if(document.getElementById('viewEbill').classList.contains('active')) {
                this.populateEbillStalls();
                this.renderEbillSummary(); // Update the summary if view is active
            }
            if(document.getElementById('viewReports').classList.contains('active')) this.renderReportView();

            setTimeout(() => { document.getElementById('fullPageLoader').style.display = 'none'; document.getElementById('mainContainer').classList.add('visible'); }, 500);
         }).withFailureHandler(err => { clearInterval(interval); Toast.fire({ icon: 'error', title: 'Data Load Failed' }); }).getSheetData();
       } else {
          // Mock Data
          setTimeout(() => {
             clearInterval(interval); this.updateProgressBar(100, "Done");
             this.processData({data: [{'Stall No.': 'G-01-A', 'Stall Owner': 'Maria Clara', 'Operator': 'Jose', 'Line of Business': 'Rice', 'Period_Index': 2, 'Status': 'Compliant', 'Year': '2024', '_rowIndex': 2}], monitoringHistory: [], latestReadings: {'G-01-A': 120}, electricBills: [], slaughterData: []});
             this.renderMapTabs(); this.renderMap(); this.attachEvents();
             setTimeout(() => { document.getElementById('fullPageLoader').style.display = 'none'; document.getElementById('mainContainer').classList.add('visible'); }, 500);
          }, 1000);
       }
    },

    processData: function(response) {
      this.state.csuData = response.csuData || [];
      this.state.cemeteryData = response.cemeteryData || [];
      this.state.todaData = response.todaData || [];
      this.state.memberData = response.memberData || [];
      this.state.slaughterData = response.slaughterData || [];
      this.updateClientList(); // Extracts unique clients for autocomplete
      
      const rawData = response.data || [];
      this.state.monitoringHistory = response.monitoringHistory || [];
      this.state.latestReadings = response.latestReadings || {};
      this.state.electricBills = response.electricBills || [];
      this.state.rawRows = []; const map = {};
      if (!Array.isArray(rawData)) return;
      
      rawData.forEach(row => {
         const id = row['Stall No.']; if (!id) return;
         if (!map[id]) map[id] = [];
         const record = {
            stallNo: id, stallOwner: row['Stall Owner'] || '', operator: row['Operator'] || '', lineOfBusiness: row['Line of Business'] || '',
            periodIndex: row['Period_Index'] || 0, year: row['Year'] || '', status: row['Status'] || 'Non-Compliant', columnI: row[this.state.columnIHeader] || '', rowIndex: row['_rowIndex'],
            monDate: row['DATE OF MONITORING'] || '', monGoodwill: row['GOODWILL (BALANCE)'] || '', monStatus: row['NON-OPERATIONAL/OPERATIONAL'] || 'Operational',
            monPermit: row['BUSINESS PERMIT'] || '', monLease: row['CONTRACT OF LEASE'] || '', monRental: row['STALL RENTAL'] || '', monSeminars: row['SEMINARS ATTENDED'] || '',
            monClaygo: row['CLAYGO Compliance'] || row['CLAYGO'] || '',
            monCctv: row['CCTV Available'] || row['CCTV'] || '',
            monPalengqr: row['PalengQR Implemented'] || row['PalengQR'] || '',
            monEbillAmount: row['Electric Bill Amount'] || '',
            monEbillStatus: row['Electric Bill Status'] || '',
            monEbillDate: row['Electric Bill Due Date'] || ''
         };
         map[id].push(record); this.state.rawRows.push(record);
      });
      
      const processedMap = {};
      for (const [id, entries] of Object.entries(map)) {
         entries.sort((a, b) => (parseFloat(b.periodIndex)||0) - (parseFloat(a.periodIndex)||0));
         processedMap[id] = { current: entries[0], history: entries.slice(1) };
      }
      this.state.stallData = processedMap;
    },

    stall: function(id, customClass='', style='') {
      const data = this.state.stallData[id] || {};
      const current = data.current || {};
      const isOccupied = !!current.stallOwner;
      
      const term = this.state.searchTerm.toLowerCase();
      const safeOwner = (current.stallOwner || '').toLowerCase();
      const matchesSearch = term==='' || id.toLowerCase().includes(term) || safeOwner.includes(term);
      const matchesFilter = this.state.filterStatus==='all' || (this.state.filterStatus==='occupied' && isOccupied) || (this.state.filterStatus==='vacant' && !isOccupied);
      const isDimmed = (!matchesSearch || !matchesFilter) && (term!=='' || this.state.filterStatus!=='all');
      const ownerAttr = (current.stallOwner || 'Vacant').replace(/"/g, '&quot;');
      
      return `<div class="stall ${isOccupied?'occupied':'vacant'} ${customClass} ${isDimmed?'dimmed':''}" style="${style}" data-stall-id="${id}" title="${ownerAttr}"><span>${id}</span>${isOccupied?this.icons.user:''}</div>`;
    },

    renderMapTabs: function() {
      const tabs = [{id:'wet',label:'Wet Section'}, {id:'dry',label:'Dry Goods'}, {id:'old',label:'Old Building'}, {id:'triangular',label:'Triangular'}];
      document.getElementById('tabGroup').innerHTML = tabs.map(t => `<button class="tab-btn ${this.state.activeTab===t.id?'active':''}" onclick="window.app.setTab('${t.id}')">${t.label}</button>`).join('');
    },
    setTab: function(id) { this.state.activeTab = id; this.renderMapTabs(); this.renderMap(); },
    renderMap: function() {
       const container = document.getElementById('mapContent');
       let html = '';
       if(this.state.activeTab === 'wet') html = this.templates.wet();
       else if(this.state.activeTab === 'dry') html = this.templates.dry();
       else if(this.state.activeTab === 'old') html = this.templates.old();
       else if(this.state.activeTab === 'triangular') html = this.templates.triangular();
       container.innerHTML = html;
    },

    // --- ELECTRIC BILL GENERATOR LOGIC ---
    populateEbillStalls: function() {
        const select = document.getElementById('ebillStallSelect');
        const currentVal = select.value; 
        select.innerHTML = '<option value="">Select a Stall to Generate Bill...</option>';
        Object.keys(this.state.stallData).sort((a, b) => a.localeCompare(b, undefined, {numeric: true})).forEach(id => {
            select.insertAdjacentHTML('beforeend', `<option value="${id}">${id} - ${this.state.stallData[id].current.stallOwner || 'Vacant'}</option>`);
        });
        if(currentVal && this.state.stallData[currentVal]) select.value = currentVal;
    },
    loadEbillStall: function(stallId) {
        const formCont = document.getElementById('ebillFormContainer');
        if(!stallId || !this.state.stallData[stallId]) { formCont.classList.add('hidden'); return; }
        formCont.classList.remove('hidden');

        const stallData = this.state.stallData[stallId].current;
        document.getElementById('ebillStallLabel').textContent = stallId;
        document.getElementById('ebillOwnerLabel').textContent = stallData.stallOwner || 'N/A';
        
        // Reset Meter Checkbox
        if(document.getElementById('ebillMeterReset')) document.getElementById('ebillMeterReset').checked = false;

        const prevReading = this.state.latestReadings[stallId] || 0;
        document.getElementById('ebillPrev').value = prevReading;
        document.getElementById('ebillCurr').value = '';
        document.getElementById('ebillCons').value = '';
        
        // Find previous unpaid arrears
        let arrears = 0;
        if(stallData.monEbillStatus === 'Unpaid' || stallData.monEbillStatus === 'Partial') {
            arrears = parseFloat(stallData.monEbillAmount) || 0;
        }
        if(document.getElementById('ebillArrears')) document.getElementById('ebillArrears').value = arrears;

        // Historical Trend
        const historyText = document.getElementById('ebillHistoryText');
        if(historyText) {
            const pastBills = this.state.electricBills.filter(b => b.stallNo === stallId).sort((a,b) => new Date(b.dueDate) - new Date(a.dueDate));
            if(pastBills.length > 0) {
                historyText.innerHTML = `Last Bill: <strong>${pastBills[0].consumption} kWh</strong> (₱${Number(pastBills[0].bill).toLocaleString()})`;
            } else {
                historyText.innerHTML = `Last Bill: --`;
            }
        }

        this.calculateEbill();
    },
    calculateEbill: function() {
        const prev = parseFloat(document.getElementById('ebillPrev').value) || 0;
        const curr = parseFloat(document.getElementById('ebillCurr').value) || 0;
        const rate = parseFloat(document.getElementById('ebillRate').value) || 0;
        const arrears = parseFloat(document.getElementById('ebillArrears') ? document.getElementById('ebillArrears').value : 0) || 0;
        const isReset = document.getElementById('ebillMeterReset') ? document.getElementById('ebillMeterReset').checked : false;
        
        let cons = 0;
        if(isReset && curr > 0) {
            cons = curr; // If reset, current reading is the total consumption
        } else {
            cons = curr - prev;
            if(cons < 0) cons = 0; 
        }
        
        // Ensure format correctly updates in UI as 108.90
        document.getElementById('ebillCons').value = cons.toFixed(2);
        const total = (cons * rate) + arrears;
        document.getElementById('ebillTotal').value = total.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
    },
    generateBill: function() {
        const dueDate = document.getElementById('ebillDueDate').value;
        const discDate = document.getElementById('ebillDiscDate').value;
        if(!dueDate || !discDate) { Toast.fire({icon:'warning', title:'Please set Due and Disconnection dates'}); return; }
        
        const stallId = document.getElementById('ebillStallSelect').value;
        const currStr = document.getElementById('ebillCurr').value;
        const curr = parseFloat(currStr);
        if(currStr === '' || isNaN(curr)) { Toast.fire({icon:'warning', title:'Please enter Current Reading'}); return; }
        
        const prev = parseFloat(document.getElementById('ebillPrev').value) || 0;
        const isReset = document.getElementById('ebillMeterReset') ? document.getElementById('ebillMeterReset').checked : false;

        if(curr < prev && !isReset) { 
            if(!confirm('Current reading is lower than previous reading. Are you sure you want to proceed? (Or check "Meter Reset/Replaced")')) return; 
        }

        const cons = parseFloat(document.getElementById('ebillCons').value);

        // Anomaly Warning: Check if consumption is drastically higher
        const pastBills = this.state.electricBills.filter(b => b.stallNo === stallId).sort((a,b) => new Date(b.dueDate) - new Date(a.dueDate));
        if (pastBills.length > 0 && pastBills[0].consumption > 10) {
            if (cons > pastBills[0].consumption * 1.5) {
                if(!confirm(`Warning: Consumption (${cons} kWh) is >50% higher than last month (${pastBills[0].consumption} kWh). Proceed?`)) return;
            }
        }

        // Pass rowIndex to backend so it can auto-update the Monitoring tab!
        const rowIndex = this.state.stallData[stallId].current.rowIndex;

        const data = {
            stallNo: stallId,
            owner: this.state.stallData[stallId].current.stallOwner || 'N/A',
            previous: prev,
            current: curr,
            consumption: cons,
            rate: parseFloat(document.getElementById('ebillRate').value),
            bill: parseFloat(document.getElementById('ebillTotal').value.replace(/,/g, '')),
            dueDate: dueDate,
            discDate: discDate,
            status: 'Unpaid',
            rowIndex: rowIndex // Ensures linking!
        };

        const btn = document.getElementById('btnGenerateBill');
        const origText = btn.innerHTML;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving...'; btn.disabled = true;

        const handleSuccess = () => {
            btn.innerHTML = origText; btn.disabled = false;
            Toast.fire({icon:'success', title:'Electric Bill Saved!'});
            this.state.latestReadings[stallId] = curr;
            
            // Update local ledger for Print All
            this.state.electricBills = this.state.electricBills.filter(b => !(b.stallNo === stallId && b.dueDate === dueDate));
            this.state.electricBills.push(data);
            
            // --- Auto-Sync UI for Monthly Monitoring ---
            this.state.stallData[stallId].current.monEbillAmount = data.bill;
            this.state.stallData[stallId].current.monEbillStatus = 'Unpaid';
            this.state.stallData[stallId].current.monEbillDate = data.dueDate;

            document.getElementById('ebillCurr').value = '';
            this.renderEbillSummary(); // Update UI table

            // AUTO-NEXT STALL LOGIC
            const select = document.getElementById('ebillStallSelect');
            const currentIndex = select.selectedIndex;
            if(currentIndex > 0 && currentIndex < select.options.length - 1) {
                select.selectedIndex = currentIndex + 1;
                this.loadEbillStall(select.value);
                Toast.fire({icon:'info', title:'Loaded next stall'});
            } else {
                this.loadEbillStall(stallId); // Reload if end of list
            }
        };

        if (window.google && window.google.script) {
            google.script.run.withSuccessHandler(res => {
                if(res.success) handleSuccess();
                else { btn.innerHTML = origText; btn.disabled = false; Toast.fire({icon:'error', title:res.message}); }
            }).saveElectricBill(data);
        } else {
            setTimeout(handleSuccess, 1000);
        }
    },

    toggleBatchMode: function() {
        this.state.isBatchMode = !this.state.isBatchMode;
        const btn = document.getElementById('btnToggleBatch');
        const select = document.getElementById('ebillStallSelect');
        const formCont = document.getElementById('ebillFormContainer');
        const batchCont = document.getElementById('ebillBatchContainer');

        if(this.state.isBatchMode) {
            btn.innerHTML = '<i class="fas fa-user"></i> Single Entry Mode';
            select.style.display = 'none';
            formCont.classList.add('hidden');
            batchCont.classList.remove('hidden');
            this.renderBatchTable();
        } else {
            btn.innerHTML = '<i class="fas fa-table"></i> Batch Entry Mode';
            select.style.display = 'block';
            batchCont.classList.add('hidden');
            if(select.value) this.loadEbillStall(select.value);
        }

    renderBatchTable: function() {
        const tbody = document.getElementById('ebillBatchTableBody');
        if(!tbody) return;
        
        const filterSection = document.getElementById('ebillPrintSection') ? document.getElementById('ebillPrintSection').value : 'All';
        const rate = parseFloat(document.getElementById('ebillRate').value) || 0;

        let rowsHTML = '';
        let stalls = Object.keys(this.state.stallData).sort((a, b) => a.localeCompare(b, undefined, {numeric: true}));
        
        stalls.forEach(id => {
            const r = this.state.stallData[id].current;
            if(!r.stallOwner) return; // Skip vacant stalls
            
            // Section Filter Logic
            const prefix = id.split('-')[0]; const simpleMap = { 'G':'Wet','B':'Wet','I':'Wet','A':'Wet','C':'Wet','E':'Wet', 'J':'Dry','L':'Dry', 'HE':'Old', 'K':'Triangular','H':'Triangular' };
            const mapSection = simpleMap[prefix] || (id.includes('HE') ? 'Old' : (id.startsWith('D') ? (parseInt(id.split('-')[1])>=20 ? 'Triangular' : 'Dry') : 'Wet'));
            if(filterSection !== 'All' && mapSection !== filterSection) return;

            const prev = this.state.latestReadings[id] || 0;
            
            // Check if already billed for current due date
            const dueDate = document.getElementById('ebillDueDate').value;
            const existingBill = this.state.electricBills.find(b => b.stallNo === id && b.dueDate === dueDate);
            const currVal = existingBill ? existingBill.current : '';
            const consVal = existingBill ? existingBill.consumption : '0.00';
            const totalVal = existingBill ? existingBill.bill.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2}) : '0.00';

            rowsHTML += `<tr id="batch-row-${id}">
                <td><strong>${id}</strong></td>
                <td>${r.stallOwner}</td>
                <td><input type="number" id="batch-prev-${id}" class="input-field" value="${prev}" style="width: 80px; padding: 4px;" readonly></td>
                <td><input type="number" id="batch-curr-${id}" class="input-field" value="${currVal}" style="width: 80px; padding: 4px;" oninput="window.app.calculateBatchEbill('${id}')" placeholder="0"></td>
                <td><input type="text" id="batch-cons-${id}" class="input-field" value="${consVal}" style="width: 80px; padding: 4px; background:var(--bg-color); font-weight:bold" readonly></td>
                <td><input type="text" id="batch-total-${id}" class="input-field" value="${totalVal}" style="width: 100px; padding: 4px; background:var(--primary-light); color:var(--primary-dark); font-weight:bold" readonly></td>
                <td><button id="batch-btn-${id}" class="btn ${existingBill ? 'btn-success' : 'btn-primary'} btn-sm" onclick="window.app.saveBatchBill('${id}')">${existingBill ? 'Update' : 'Save'}</button></td>
            </tr>`;
        });
        
        tbody.innerHTML = rowsHTML || '<tr><td colspan="7" style="text-align:center; padding:20px; color:var(--text-muted)">No occupied stalls found for this section.</td></tr>';
    },

    calculateBatchEbill: function(id) {
        const prev = parseFloat(document.getElementById(`batch-prev-${id}`).value) || 0;
        const curr = parseFloat(document.getElementById(`batch-curr-${id}`).value) || 0;
        const rate = parseFloat(document.getElementById('ebillRate').value) || 0;
        
        let cons = curr - prev;
        if(cons < 0) cons = 0; 
        
        document.getElementById(`batch-cons-${id}`).value = cons.toFixed(2);
        const total = cons * rate;
        document.getElementById(`batch-total-${id}`).value = total.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
        
        const btn = document.getElementById(`batch-btn-${id}`);
        btn.className = 'btn btn-primary btn-sm';
        btn.innerHTML = '<i class="fas fa-save"></i> Save';
    },

    saveBatchBill: function(id) {
        const dueDate = document.getElementById('ebillDueDate').value;
        const discDate = document.getElementById('ebillDiscDate').value;
        if(!dueDate || !discDate) { Toast.fire({icon:'warning', title:'Please set Due and Disconnection dates'}); return; }
        
        const currStr = document.getElementById(`batch-curr-${id}`).value;
        const curr = parseFloat(currStr);
        if(currStr === '' || isNaN(curr)) { Toast.fire({icon:'warning', title:'Enter Current Reading'}); return; }
        
        const prev = parseFloat(document.getElementById(`batch-prev-${id}`).value) || 0;
        if(curr < prev) { 
            if(!confirm(`Stall ${id}: Current reading is lower than previous. Proceed?`)) return; 
        }

        const cons = parseFloat(document.getElementById(`batch-cons-${id}`).value);
        const billVal = parseFloat(document.getElementById(`batch-total-${id}`).value.replace(/,/g, ''));
        const rowIndex = this.state.stallData[id].current.rowIndex;

        // Anomaly Warning
        const pastBills = this.state.electricBills.filter(b => b.stallNo === id).sort((a,b) => new Date(b.dueDate) - new Date(a.dueDate));
        if (pastBills.length > 0 && pastBills[0].consumption > 10) {
            if (cons > pastBills[0].consumption * 1.5) {
                if(!confirm(`Warning for ${id}: Consumption (${cons} kWh) is >50% higher than last bill. Proceed?`)) return;
            }
        }

        const data = {
            stallNo: id, owner: this.state.stallData[id].current.stallOwner || 'N/A',
            previous: prev, current: curr, consumption: cons,
            rate: parseFloat(document.getElementById('ebillRate').value), bill: billVal,
            dueDate: dueDate, discDate: discDate, status: 'Unpaid', rowIndex: rowIndex
        };

        const btn = document.getElementById(`batch-btn-${id}`);
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>'; btn.disabled = true;

        const handleSuccess = () => {
            btn.innerHTML = '<i class="fas fa-check"></i> Saved'; btn.className = 'btn btn-success btn-sm'; btn.disabled = false;
            this.state.latestReadings[id] = curr;
            
            this.state.electricBills = this.state.electricBills.filter(b => !(b.stallNo === id && b.dueDate === dueDate));
            this.state.electricBills.push(data);
            
            this.state.stallData[id].current.monEbillAmount = data.bill;
            this.state.stallData[id].current.monEbillStatus = 'Unpaid';
            this.state.stallData[id].current.monEbillDate = data.dueDate;
            this.renderEbillSummary(); // Update UI table
        };

        if (window.google && window.google.script) {
            google.script.run.withSuccessHandler(res => {
                if(res.success) handleSuccess();
                else { btn.innerHTML = 'Retry'; btn.disabled = false; Toast.fire({icon:'error', title:res.message}); }
            }).saveElectricBill(data);
        } else { setTimeout(handleSuccess, 500); }
    },

    // --- MONTHLY MONITORING LOGIC ---
    populateMonitoringStalls: function() {
        const select = document.getElementById('monStallSelect');
        const currentVal = select.value; select.innerHTML = '<option value="">Select a Stall to Update...</option>';
        Object.keys(this.state.stallData).sort((a, b) => a.localeCompare(b, undefined, {numeric: true})).forEach(id => {
            select.insertAdjacentHTML('beforeend', `<option value="${id}">${id} - ${this.state.stallData[id].current.stallOwner || 'Vacant'}</option>`);
        });
        if(currentVal && this.state.stallData[currentVal]) select.value = currentVal;
    },
    toggleMonInput: function(chkId, inpId) {
        const chk = document.getElementById(chkId); const inp = document.getElementById(inpId);
        if(chk.checked) { inp.disabled = true; inp.value = ''; } else inp.disabled = false;
    },
    loadMonitoringData: function(stallId) {
        const emptyState = document.getElementById('monEmptyState'); const formCont = document.getElementById('monFormContainer');
        if(!stallId || !this.state.stallData[stallId]) { emptyState.classList.remove('hidden'); formCont.classList.add('hidden'); return; }
        emptyState.classList.add('hidden'); formCont.classList.remove('hidden');
        
        const data = this.state.stallData[stallId].current;
        let safeDate = ''; if(data.monDate) try { safeDate = new Date(data.monDate).toISOString().split('T')[0]; } catch(e){}

        document.getElementById('monDate').value = safeDate;
        document.getElementById('monGoodwill').value = data.monGoodwill || '';
        document.getElementById('monStatus').value = data.monStatus === 'Non-Operational' ? 'Non-Operational' : 'Operational';

        // Load specific fields (which are automatically synced from Bill Generator!)
        document.getElementById('monClaygo').value = data.monClaygo || '';
        document.getElementById('monCctv').value = data.monCctv || '';
        document.getElementById('monPalengqr').value = data.monPalengqr || '';
        document.getElementById('monEbillAmount').value = data.monEbillAmount || '';
        document.getElementById('monEbillStatus').value = data.monEbillStatus || '';
        
        if (data.monEbillDate) {
            try { document.getElementById('monEbillDate').value = new Date(data.monEbillDate).toISOString().split('T')[0]; } 
            catch(e) { document.getElementById('monEbillDate').value = data.monEbillDate; }
        } else {
            document.getElementById('monEbillDate').value = '';
        }

        const loadInputOrCheck = (val, chkId, inpId, noValText) => {
            const chk = document.getElementById(chkId); const inp = document.getElementById(inpId);
            if(val && String(val).trim().toLowerCase() === noValText.toLowerCase()) {
                chk.checked = true; inp.disabled = true; inp.value = '';
            } else {
                chk.checked = false; inp.disabled = false;
                if (inp.type === 'date' && val) { try { inp.value = new Date(val).toISOString().split('T')[0]; } catch(e) { inp.value = val; } }
                else inp.value = val || '';
            }
        };

        loadInputOrCheck(data.monPermit, 'monPermitNone', 'monPermitDate', 'No Submission');
        loadInputOrCheck(data.monLease, 'monLeaseNone', 'monLeaseDate', 'No Submission');
        loadInputOrCheck(data.monRental, 'monRentalNone', 'monRentalOR', 'No Payment');

        const list = document.getElementById('monSeminarsList'); list.innerHTML = '';
        let seminars = data.monSeminars ? data.monSeminars.split(/\r?\n/).map(s => s.trim()).filter(s => s !== '') : [];
        if(seminars.length === 0) this.addSeminarField(''); else seminars.forEach(s => this.addSeminarField(s));
        this.updateSeminarTotal();

        // Load History Table
        const historyBody = document.getElementById('monHistoryTableBody');
        const historyRecords = this.state.monitoringHistory.filter(h => String(h.stallNo) === String(stallId)).sort((a,b) => new Date(b.timestamp) - new Date(a.timestamp));
        if(historyRecords.length === 0) {
            historyBody.innerHTML = '<tr><td colspan="7" style="text-align:center; padding: 20px; color: var(--text-muted);">No history available</td></tr>';
        } else {
            let hHtml = '';
            historyRecords.forEach(h => {
                const safeStatusClass = h.status === 'Operational' ? 'badge-approved' : 'badge-blocked';
                hHtml += `<tr><td>${h.date || '-'}</td><td>${h.goodwill || '-'}</td><td><span class="badge ${safeStatusClass}">${h.status || '-'}</span></td><td>${h.permit || '-'}</td><td>${h.lease || '-'}</td><td>${h.rental || '-'}</td><td>${h.eBillStatus || '-'}</td></tr>`;
            });
            historyBody.innerHTML = hHtml;
        }
    },

        div.innerHTML = `<input type="text" class="input-field seminar-input" placeholder="Seminar Title/Details" value="${val}" style="flex:1" oninput="window.app.updateSeminarTotal()"><button class="btn btn-danger btn-sm" onclick="this.parentElement.remove(); window.app.updateSeminarTotal()" style="padding: 0 16px;"><i class="fas fa-trash-alt"></i></button>`;

    saveMonitoring: function() {
        const stallId = document.getElementById('monStallSelect').value;
        if(!stallId) { Toast.fire({icon:'warning', title:'Please select a stall'}); return; }
        
        const btn = document.getElementById('btnSaveMonitoring'); const originalText = btn.innerHTML;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving Data...'; btn.disabled = true;

        const rowIndex = this.state.stallData[stallId].current.rowIndex;
        const currentOwner = this.state.stallData[stallId].current.stallOwner;

        const getFieldVal = (chkId, inpId, noValText) => document.getElementById(chkId).checked ? noValText : document.getElementById(inpId).value;
        const seminars = Array.from(document.querySelectorAll('.seminar-input')).map(i => i.value.trim()).filter(v => v !== '').join('\n');

        const payload = {
            stallNo: stallId, owner: currentOwner, date: document.getElementById('monDate').value, goodwill: document.getElementById('monGoodwill').value,
            status: document.getElementById('monStatus').value, permit: getFieldVal('monPermitNone', 'monPermitDate', 'No Submission'),
            lease: getFieldVal('monLeaseNone', 'monLeaseDate', 'No Submission'), rental: getFieldVal('monRentalNone', 'monRentalOR', 'No Payment'), seminars: seminars,
            claygo: document.getElementById('monClaygo').value,
            cctv: document.getElementById('monCctv').value,
            palengqr: document.getElementById('monPalengqr').value,
            eBillAmount: document.getElementById('monEbillAmount').value,
            eBillStatus: document.getElementById('monEbillStatus').value, // Used to sync back to electric_bills!
            eBillDate: document.getElementById('monEbillDate').value
        };

        if (window.google && window.google.script) {
            google.script.run.withSuccessHandler(res => {
                btn.innerHTML = originalText; btn.disabled = false;
                if(res.success) { 
                    Toast.fire({ icon: 'success', title: 'Data Logged' }); 
                    
                    // Keep frontend local state immediately up to date
                    this.state.stallData[stallId].current.monEbillAmount = payload.eBillAmount;
                    this.state.stallData[stallId].current.monEbillStatus = payload.eBillStatus;
                    this.state.stallData[stallId].current.monEbillDate = payload.eBillDate;
                    
                    this.loadData(); // Re-fetch to guarantee sync 
                } else Toast.fire({ icon: 'error', title: res.message || 'Save Failed' });
            }).withFailureHandler(err => { btn.innerHTML = originalText; btn.disabled = false; Toast.fire({ icon: 'error', title: 'Communication Error' }); }).saveMonthlyMonitoring(rowIndex, payload);
        } else { setTimeout(() => { btn.innerHTML = originalText; btn.disabled = false; Toast.fire({ icon: 'success', title: 'Data Saved (Demo)' }); }, 1000); }
    },

        this.state.slaughterData.forEach(d => {

                // Keep the most recent contact info for the list
                if(!clientMap[d.clientId]) {
                    clientMap[d.clientId] = { id: d.clientId, name: d.clientName, contact: d.contact };

    saveSlaughterEntry: function() {
        const clientId = document.getElementById('shClientId').value.trim();
        const clientName = document.getElementById('shClientName').value.trim();
        const headCount = parseInt(document.getElementById('shHeadCount').value);
        const amount = parseFloat(document.getElementById('shAmount').value) || 0; // Capture amount
        
        if(!clientName) { Toast.fire({icon: 'warning', title: 'Client name required'}); return; }
        if(!headCount || headCount < 1) { Toast.fire({icon: 'warning', title: 'Valid head count required'}); return; }
        
        const btn = document.getElementById('btnSaveSlaughter');
        const origText = btn.innerHTML;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>'; btn.disabled = true;

        const data = {
            clientId: clientId, // Send Client ID if it exists
            clientName: clientName,
            contact: document.getElementById('shContact').value,
            orNumber: document.getElementById('shOR').value || 'Unpaid',
            status: document.getElementById('shStatus').value,
            livestockType: document.getElementById('shType').value,
            headCount: headCount,
            amount: amount // Add to payload
        };

        const handleSuccess = (res) => {
            btn.innerHTML = origText; btn.disabled = false;
            Toast.fire({icon: 'success', title: 'Log Saved!'});
            
            document.getElementById('shClientId').value = '';
            document.getElementById('shClientName').value = '';
            document.getElementById('shContact').value = '';
            document.getElementById('shOR').value = '';
            document.getElementById('shHeadCount').value = '1';
            document.getElementById('shAmount').value = ''; // Reset amount field
            
            // Instantly update UI without page reload
            data.timestamp = new Date().toISOString();
            data.clientId = res?.clientId || clientId || ('C-' + new Date().getTime().toString().slice(-6));
            this.state.slaughterData.unshift(data);
            
            this.updateClientList(); // Refresh autocomplete list
            this.renderSlaughterReport();
        };

        if (window.google && window.google.script) {
            google.script.run.withSuccessHandler(res => {
                if(res.success) handleSuccess(res);
                else { btn.innerHTML = origText; btn.disabled = false; Toast.fire({icon: 'error', title: res.message}); }
            }).saveSlaughterData(data);
        } else setTimeout(handleSuccess, 500); // Demo fallback
    },

    renderSlaughterReport: function() {
        const tbody = document.getElementById('shReportTableBody');
        const summaryCont = document.getElementById('shSummaryCards');
        const titleCont = document.getElementById('shReportTitle');
        if(!tbody) return;

        let filterMonth = document.getElementById('shFilterMonth').value;
        let filterClient = (document.getElementById('shFilterClient').value || '').toLowerCase().trim();

        if(!filterMonth) {
            const now = new Date();
            filterMonth = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
            document.getElementById('shFilterMonth').value = filterMonth;
        }

        let filtered = this.state.slaughterData.filter(d => {
            if(!d.timestamp) return false;
            
            // If they are searching for a specific client, ignore the month filter to show history
            if (filterClient !== '') {
                const searchStr = `${d.clientId} ${d.clientName} ${d.contact}`.toLowerCase();
                return searchStr.includes(filterClient);
            }
            
            return d.timestamp.startsWith(filterMonth);
        }).sort((a,b) => new Date(b.timestamp) - new Date(a.timestamp));

        // Update Title dynamically
        if(titleCont) titleCont.textContent = filterClient !== '' ? `Client History Search` : `Monthly Slaughter Report`;

        let html = '';
        filtered.forEach(d => {
            let dateStr = d.timestamp;
            try { 
                const dt = new Date(d.timestamp);
                dateStr = `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')} ${String(dt.getHours()%12||12).padStart(2,'0')}:${String(dt.getMinutes()).padStart(2,'0')} ${dt.getHours()>=12?'PM':'AM'}`;
            } catch(e){}
            html += `<tr>
                <td>${dateStr}</td>
                <td><span style="font-size:0.8rem; color:var(--text-muted);">${d.clientId}</span></td>
                <td><strong>${d.clientName}</strong></td>
                <td>${d.contact || '-'}</td>
                <td style="color:${(d.orNumber==='Unpaid'||d.orNumber==='')?'var(--danger-color)':'var(--text-main)'}; font-weight:bold;">${d.orNumber||'Unpaid'}</td>
                <td><span class="badge ${d.status==='Private'?'badge-admin':'badge-approved'}">${d.status}</span></td>
                <td>${d.livestockType}</td>
                <td><strong>${d.headCount}</strong></td>
                <td style="color:var(--primary-dark); font-weight:bold;">₱ ${(parseFloat(d.amount) || 0).toLocaleString('en-US', {minimumFractionDigits: 2})}</td>
            </tr>`;
        });
        
        if(filtered.length === 0) html = `<tr><td colspan="8" style="text-align:center; padding:20px;">No slaughterhouse records found matching criteria.</td></tr>`;
        tbody.innerHTML = html;

        // Generate Totals
        let totalAmount = 0;
        let totals = { 'Hogs': 0, 'Cow': 0, 'Goat': 0, 'Chicken': 0, 'Private': 0, 'Public': 0 };
        filtered.forEach(d => {
            const hc = parseInt(d.headCount) || 0;
            if(totals[d.livestockType] !== undefined) totals[d.livestockType] += hc;
            if(totals[d.status] !== undefined) totals[d.status] += hc;
        });

        // --- Summary Cards Generation with Correct Tags & Icons ---
summaryCont.innerHTML = `
    <div class="summary-card">
        <div class="summary-value">${totals['Hogs']}</div>
        <div class="summary-label"><i class="fas fa-piggy-bank"></i> Total Hogs</div>
    </div>
    <div class="summary-card">
        <div class="summary-value">${totals['Cow']}</div>
        <div class="summary-label"><i class="fas fa-cow"></i> Total Cattle/Cow</div>
    </div>
    <div class="summary-card">
        <div class="summary-value">${totals['Goat']}</div>
        <div class="summary-label"><i class="fas fa-paw"></i> Total Goats</div>
    </div>
    <div class="summary-card" style="background: var(--primary-light); border-color: rgba(37, 99, 235, 0.2);">
        <div class="summary-value" style="color: var(--primary-dark);">${totals['Private']}</div>
        <div class="summary-label" style="color: var(--primary-dark);"><i class="fas fa-lock"></i> Private Sector</div>
    </div>
    <div class="summary-card" style="background: var(--primary-light); border-color: rgba(37, 99, 235, 0.2);">
        <div class="summary-value" style="color: var(--primary-dark);">${totals['Public']}</div>
        <div class="summary-label" style="color: var(--primary-dark);"><i class="fas fa-users"></i> Public Sector</div>
    </div>
    <div class="summary-card" style="background: var(--success-light); border-color: rgba(16, 185, 129, 0.3);">
        <div class="summary-value" style="color: var(--stall-occupied-text);">₱ ${totalAmount.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</div>
        <div class="summary-label" style="color: var(--stall-occupied-text);"><i class="fas fa-coins"></i> Total Collections</div>

`;

    deleteOpifRow: function(id) {
        if(confirm('Are you sure you want to delete this row?')) {
            this.state.opifData = this.state.opifData.filter(r => r.id !== id);
            this.renderOpifTable();
            Toast.fire({ icon: 'info', title: 'Row deleted.' });
        }
    },

    updateOpifField: function(id, field, value) {
        const row = this.state.opifData.find(r => r.id === id);
        if(row && row[field] !== value) {
            row[field] = value;
            // Optionally auto-calculate % here if field is a target/accomp
        }
    },

    renderOpifTable: function() {
        const tbody = document.getElementById('opifDynamicBody');
        if (!tbody) return;

        const isAdmin = this.state.userRole === 'Admin';
        const activeSection = this.state.userSection; 

        const sectionNames = {
            'A': 'A. MARKET MANAGEMENT', 'B': 'B. SLAUGHTER HOUSE MANAGEMENT',
            'C': 'C. CEMETERY MANAGEMENT', 'D': 'D. TRANSPORT TERMINAL MANAGEMENT',
            'E': 'E. ADMINISTRATIVE SERVICES'
        };

        let html = '';

        Object.keys(sectionNames).forEach(secKey => {
            // Visibility Check: Only show assigned section for Staff, ALL for Admin
            if (activeSection !== 'ALL' && activeSection !== secKey) return;

            const secRows = this.state.opifData.filter(r => r.section === secKey);
            if (secRows.length === 0) return;

            // Pre-calculate spans dynamically
            for (let i = 0; i < secRows.length; i++) {
                // Col3 Span
                if (i === 0 || secRows[i].col3 !== secRows[i-1].col3) {
                    let span = 1;
                    for (let j = i + 1; j < secRows.length; j++) {
                        if (secRows[j].col3 === secRows[i].col3) span++; else break;
                    }
                    secRows[i].spanCol3 = span;
                } else secRows[i].spanCol3 = 0;

                // Col4 Span
                if (i === 0 || secRows[i].col4 !== secRows[i-1].col4 || secRows[i].spanCol3 > 0) {
                    let span = 1;
                    for (let j = i + 1; j < secRows.length; j++) {
                        if (secRows[j].col4 === secRows[i].col4 && secRows[j].col3 === secRows[i].col3) span++; else break;
                    }
                    secRows[i].spanCol4 = span;
                } else secRows[i].spanCol4 = 0;

                // Col5 Span
                if (i === 0 || secRows[i].col5 !== secRows[i-1].col5 || secRows[i].spanCol4 > 0) {
                    let span = 1;
                    for (let j = i + 1; j < secRows.length; j++) {
                        if (secRows[j].col5 === secRows[i].col5 && secRows[j].col4 === secRows[i].col4 && secRows[j].col3 === secRows[i].col3) span++; else break;
                    }
                    secRows[i].spanCol5 = span;
                } else secRows[i].spanCol5 = 0;
            }

            // Render Rows
            secRows.forEach((row, i) => {
                const canEditActual = isAdmin || (activeSection === secKey);
                const canEditTarget = isAdmin;
                const editableAttr = isAdmin ? 'contenteditable="true" class="editable-cell"' : '';

                html += `<tr>`;
                
                // Section Title (Rowspan across all items in section)
                if (i === 0) {
                    html += `<td rowspan="${secRows.length}" class="text-left align-top bold">${sectionNames[secKey]}</td>`;
                    html += `<td rowspan="${secRows.length}"></td>`;
                }

                if (row.spanCol3 > 0) html += `<td rowspan="${row.spanCol3}" class="text-left align-top" ${editableAttr} onblur="window.app.updateOpifField('${row.id}', 'col3', this.innerText)">${row.col3 || ''}</td>`;
                if (row.spanCol4 > 0) html += `<td rowspan="${row.spanCol4}" class="text-left align-top" ${editableAttr} onblur="window.app.updateOpifField('${row.id}', 'col4', this.innerText)">${row.col4 || ''}</td>`;
                if (row.spanCol5 > 0) html += `<td rowspan="${row.spanCol5}" class="text-left align-top" ${editableAttr} onblur="window.app.updateOpifField('${row.id}', 'col5', this.innerText)">${row.col5 || ''}</td>`;

                // Columns 6 & 7 (MFO & PPA)
                html += `<td class="text-left align-top" ${editableAttr} onblur="window.app.updateOpifField('${row.id}', 'col6', this.innerText)">${row.col6 || ''}</td>`;
                html += `<td class="text-left align-top" ${editableAttr} onblur="window.app.updateOpifField('${row.id}', 'col7', this.innerText)">${row.col7 || ''}</td>`;

                // Actual & Target
                html += `<td ${canEditActual ? 'contenteditable="true" class="editable-cell"' : ''} onblur="window.app.updateOpifField('${row.id}', 'actual', this.innerText)">${row.actual || ''}</td>`;
                html += `<td ${canEditTarget ? 'contenteditable="true" class="editable-cell"' : ''} onblur="window.app.updateOpifField('${row.id}', 'semi', this.innerText)">${row.semi || ''}</td>`;

                // Quarters
                if (row.specialSpan) {
                    html += `<td ${canEditTarget ? 'contenteditable="true" class="editable-cell"' : ''} onblur="window.app.updateOpifField('${row.id}', 'q1t', this.innerText)">${row.q1t || ''}</td>`;
                    html += `<td ${canEditTarget ? 'contenteditable="true" class="editable-cell"' : ''} onblur="window.app.updateOpifField('${row.id}', 'q1a', this.innerText)">${row.q1a || ''}</td>`;
                    html += `<td class="bg-yellow" ${canEditTarget ? 'contenteditable="true" class="editable-cell"' : ''} onblur="window.app.updateOpifField('${row.id}', 'q1p', this.innerText)">${row.q1p || ''}</td>`;
                    html += `<td colspan="${row.specialSpan}" class="bg-yellow text-center" ${canEditTarget ? 'contenteditable="true" class="editable-cell"' : ''} onblur="window.app.updateOpifField('${row.id}', 'specialText', this.innerText)">${row.specialText || ''}</td>`;
                } else {
                    ['q1', 'q2', 'q3', 'q4'].forEach(q => {
                        html += `<td ${canEditTarget ? 'contenteditable="true" class="editable-cell"' : ''} onblur="window.app.updateOpifField('${row.id}', '${q}t', this.innerText)">${row[`${q}t`] || ''}</td>`;
                        html += `<td ${canEditTarget ? 'contenteditable="true" class="editable-cell"' : ''} onblur="window.app.updateOpifField('${row.id}', '${q}a', this.innerText)">${row[`${q}a`] || ''}</td>`;
                        html += `<td class="bg-yellow" ${canEditTarget ? 'contenteditable="true" class="editable-cell"' : ''} onblur="window.app.updateOpifField('${row.id}', '${q}p', this.innerText)">${row[`${q}p`] || ''}</td>`;
                    });
                }

                // Delete Action (Admin Only)
                if (isAdmin) {
                    html += `<td class="print-hide" style="border:none; text-align:center;"><button class="btn btn-ghost btn-sm" style="color:var(--danger-color); padding: 4px;" onclick="window.app.deleteOpifRow('${row.id}')" title="Delete Row"><i class="fas fa-trash"></i></button></td>`;
                }

                html += `</tr>`;
            });

            // Add Row Action (Admin Only)
            if (isAdmin) {
                html += `<tr class="print-hide"><td colspan="21" style="text-align: center; padding: 12px; background: var(--bg-color); border: 2px dashed var(--border-color);">
                            <button class="btn btn-success btn-sm" onclick="window.app.addOpifRow('${secKey}')"><i class="fas fa-plus"></i> Add Row to ${sectionNames[secKey]}</button>
                         </td></tr>`;
            }
        });

        tbody.innerHTML = html;
    },

    // --- General Status Report Logic ---
    populateYearFilter: function() {
        const select = document.getElementById('repFilterYear'); if(!select) return;
        const years = new Set(); this.state.rawRows.forEach(row => { if(row.year) years.add(String(row.year).trim()); });
        const sortedYears = Array.from(years).sort().reverse();
        let options = '<option value="All">All Years</option>'; sortedYears.forEach(y => { options += `<option value="${y}">${y}</option>`; });
        select.innerHTML = options; select.value = this.state.genFilterYear || 'All';
    },
    renderGeneralReportTable: function(resetPage = false) {
        const tableBody = document.getElementById('reportTableBody'); const paginationInfo = document.getElementById('paginationInfo');
        const btnPrev = document.getElementById('btnPrevPage'); const btnNext = document.getElementById('btnNextPage');
        if(!tableBody) return; 

        const filterStatus = document.getElementById('repFilterStatus').value; const filterSection = document.getElementById('repFilterSection').value;
        const filterYear = document.getElementById('repFilterYear').value; const filterSearch = document.getElementById('repFilterSearch').value.toLowerCase();
        const sortBy = document.getElementById('repSortBy').value;
        
        this.state.genFilterStatus = filterStatus; this.state.genFilterSection = filterSection; this.state.genFilterYear = filterYear; this.state.genSort = sortBy;
        if(resetPage) this.state.reportPage = 1;

        let rows = Object.values(this.state.stallData).map(sd => sd.current).filter(r => r && r.stallOwner); 

        rows = rows.filter(r => {
            if(filterStatus !== 'All' && (r.status || 'Non-Compliant') !== filterStatus) return false;
            const prefix = r.stallNo.split('-')[0]; const simpleMap = { 'G':'Wet','B':'Wet','I':'Wet','A':'Wet','C':'Wet','E':'Wet', 'J':'Dry','L':'Dry', 'HE':'Old', 'K':'Triangular','H':'Triangular' };
            const mapSection = simpleMap[prefix] || (r.stallNo.includes('HE') ? 'Old' : (r.stallNo.startsWith('D') ? (parseInt(r.stallNo.split('-')[1])>=20 ? 'Triangular' : 'Dry') : 'Wet'));
            if(filterSection !== 'All' && mapSection !== filterSection) return false;
            if(filterYear !== 'All' && String(r.year).trim() !== filterYear) return false;
            if(filterSearch && !r.stallNo.toLowerCase().includes(filterSearch) && !r.stallOwner.toLowerCase().includes(filterSearch)) return false;
            return true;
        });

        rows.sort((a, b) => {
            if(sortBy === 'Stall No') return a.stallNo.localeCompare(b.stallNo, undefined, {numeric: true});
            if(sortBy === 'Owner') return a.stallOwner.localeCompare(b.stallOwner);
            if(sortBy === 'Status') return (a.status||'').localeCompare(b.status||'');
        });

        const totalRows = rows.length; const limit = this.state.reportLimit; const startIndex = (this.state.reportPage - 1) * limit; const endIndex = startIndex + limit;
        const paginatedRows = rows.slice(startIndex, endIndex);

        let html = '';
        paginatedRows.forEach(r => {
            let dotColor = r.status === 'Compliant' ? 'dot-green' : (r.status === 'Lacking' ? 'dot-orange' : 'dot-red');
            html += `<tr><td><strong>${r.stallNo}</strong></td><td>${r.stallOwner}</td><td>${r.operator}</td><td>${r.lineOfBusiness}</td><td>${r.year || ''}</td><td><span class="status-dot ${dotColor}"></span>${r.status||'Non-Compliant'}</td><td>${r.columnI || ''}</td></tr>`;
        });
        if(totalRows === 0) html = `<tr><td colspan="7" style="text-align:center; padding: 40px; color: var(--text-muted);">No records found matching filters</td></tr>`;
        tableBody.innerHTML = html;

        paginationInfo.textContent = `Showing ${totalRows > 0 ? startIndex + 1 : 0} to ${Math.min(endIndex, totalRows)} of ${totalRows} entries`;
        btnPrev.disabled = this.state.reportPage === 1; btnNext.disabled = endIndex >= totalRows;
    },

    // --- Monthly Compliance Report Logic ---
    populateComplianceMonths: function() {
        const select = document.getElementById('compFilterMonth'); if(!select) return;
        const months = new Set();
        this.state.monitoringHistory.forEach(h => {
            if(h.date && h.date.length >= 7) {
                const parts = h.date.split('-');
                if(parts.length >= 2) months.add(`${parts[0]}-${parts[1]}`);
            }
        });
        
        const sortedMonths = Array.from(months).sort().reverse();
        let options = '<option value="latest">Latest Updates (Current Data)</option>';
        
        sortedMonths.forEach(ym => {
            const parts = ym.split('-');
            if(parts.length === 2) {
                const dateObj = new Date(parseInt(parts[0]), parseInt(parts[1])-1, 1);
                const label = dateObj.toLocaleString('default', { month: 'long', year: 'numeric' });
                options += `<option value="${ym}">${label}</option>`;
            }
        });
        
        select.innerHTML = options;
        select.value = this.state.compFilterMonth;
    },

    renderComplianceReportTable: function(resetPage = false) {
        const tableBody = document.getElementById('compReportTableBody');
        const paginationInfo = document.getElementById('compPaginationInfo');
        const btnPrev = document.getElementById('btnCompPrevPage');

        if(!tableBody) return; 

        const monthVal = document.getElementById('compFilterMonth').value;
        const metricVal = document.getElementById('compFilterMetric').value;
        const sortVal = document.getElementById('compSortBy').value;
        
        this.state.compFilterMonth = monthVal;
        this.state.compFilterMetric = metricVal;
        this.state.compSort = sortVal;
        if(resetPage) this.state.reportPage = 1;

        let rawDataSet = [];
        if(monthVal === 'latest') {
            rawDataSet = Object.values(this.state.stallData)
                .filter(sd => sd.current && sd.current.stallOwner)
                .map(sd => {
                    const r = sd.current;
                    return {
                        stallNo: r.stallNo, owner: r.stallOwner,
                        date: r.monDate, status: r.monStatus || 'Operational',
                        permit: r.monPermit, lease: r.monLease, rental: r.monRental, seminars: r.monSeminars
                    };
                });
        } else {
            let recordsByStall = {};
            this.state.monitoringHistory.forEach(h => {
                if(h.date && h.date.startsWith(monthVal)) {
                    if(!recordsByStall[h.stallNo] || new Date(h.timestamp) > new Date(recordsByStall[h.stallNo].timestamp)) {
                        recordsByStall[h.stallNo] = h;
                    }
                }
            });
            rawDataSet = Object.values(recordsByStall);
        }

        this.renderComplianceSummaries(rawDataSet);

        let filteredRows = rawDataSet.filter(r => {
            if(metricVal === 'all') return true;
            if(metricVal === 'op') return r.status === 'Operational';
            if(metricVal === 'non_op') return r.status === 'Non-Operational';
            
            const permitSafe = String(r.permit || '');
            if(metricVal === 'permit_yes') return permitSafe && permitSafe.toLowerCase() !== 'no submission';
            if(metricVal === 'permit_no') return !permitSafe || permitSafe.toLowerCase() === 'no submission';

            const leaseSafe = String(r.lease || '');
            if(metricVal === 'lease_yes') return leaseSafe && leaseSafe.toLowerCase() !== 'no submission';
            if(metricVal === 'lease_no') return !leaseSafe || leaseSafe.toLowerCase() === 'no submission';

            const rentSafe = String(r.rental || '');
            if(metricVal === 'rental_yes') return rentSafe && rentSafe.toLowerCase() !== 'no payment';
            if(metricVal === 'rental_no') return !rentSafe || rentSafe.toLowerCase() === 'no payment';

            const semSafe = String(r.seminars || '');
            if(metricVal === 'sem_yes') return semSafe && semSafe.trim() !== '';
            if(metricVal === 'sem_no') return !semSafe || semSafe.trim() === '';
            
            return true;
        });

        filteredRows.sort((a, b) => {
            if(sortVal === 'Stall No') return a.stallNo.localeCompare(b.stallNo, undefined, {numeric: true});
            if(sortVal === 'Owner') return (a.owner||'').localeCompare(b.owner||'');
        });

        const totalRows = filteredRows.length; const limit = this.state.reportLimit; 
        const startIndex = (this.state.reportPage - 1) * limit; const endIndex = startIndex + limit;
        const paginatedRows = filteredRows.slice(startIndex, endIndex);

        let html = '';
        paginatedRows.forEach(r => {
            const sColor = r.status === 'Operational' ? 'badge-approved' : 'badge-blocked';
            let semCount = 0; if(r.seminars) semCount = r.seminars.split(/\r?\n/).filter(s=>s.trim()!=='').length;
            
            html += `<tr>
                <td><strong>${r.stallNo}</strong></td>
                <td>${r.owner}</td>
                <td><span class="badge ${sColor}">${r.status||'-'}</span></td>
                <td>${r.permit || '-'}</td>
                <td>${r.lease || '-'}</td>
                <td>${r.rental || '-'}</td>
                <td>${semCount > 0 ? `<span class="badge badge-admin">${semCount} Attended</span>` : '-'}</td>
            </tr>`;
        });

        if(totalRows === 0) html = `<tr><td colspan="7" style="text-align:center; padding: 40px; color: var(--text-muted);">No records found for these conditions</td></tr>`;
        tableBody.innerHTML = html;

        paginationInfo.textContent = `Showing ${totalRows > 0 ? startIndex + 1 : 0} to ${Math.min(endIndex, totalRows)} of ${totalRows} entries`;
        btnPrev.disabled = this.state.reportPage === 1; btnNext.disabled = endIndex >= totalRows;
    },

    renderComplianceSummaries: function(data) {
        let total = data.length;
        let op = 0, pYes = 0, lYes = 0, rYes = 0, sYes = 0;
        
        data.forEach(r => {
            if(r.status === 'Operational') op++;
            if(r.permit && String(r.permit).toLowerCase() !== 'no submission') pYes++;
            if(r.lease && String(r.lease).toLowerCase() !== 'no submission') lYes++;
            if(r.rental && String(r.rental).toLowerCase() !== 'no payment') rYes++;
            if(r.seminars && String(r.seminars).trim() !== '') sYes++;
        });

        const setVal = (id, val) => { const el = document.getElementById(id); if(el) el.textContent = val; };
        setVal('sumTotal', total);
        setVal('sumOp', op);
        setVal('sumPermit', pYes);
        setVal('sumLease', lYes);
        setVal('sumRental', rYes);
    },

    // --- UNIVERSAL CSV EXPORT FUNCTION ---
    exportToCSV: function(filename, tableSelectors) {
        let csv = [];
        // Support array of table selectors (for reports with multiple summary tables)
        let selectors = Array.isArray(tableSelectors) ? tableSelectors : [tableSelectors];
        
        selectors.forEach(selector => {
            const table = document.querySelector(selector);
            if (!table) return;
            
            const rows = table.querySelectorAll('tr');
            for (let i = 0; i < rows.length; i++) {
                let row = [], cols = rows[i].querySelectorAll('td, th');
                
                for (let j = 0; j < cols.length; j++) {
                    // Skip action columns or buttons
                    if (cols[j].innerText.trim().toLowerCase() === 'action') continue;
                    if (cols[j].querySelector('button') && cols[j].innerText.trim() === '') continue;
                    
                    // Clean text: remove newlines and escape quotes for CSV format
                    let data = cols[j].innerText.replace(/(\r\n|\n|\r)/gm, ' ').replace(/"/g, '""').trim();
                    row.push('"' + data + '"');
                }
                if (row.length > 0) csv.push(row.join(','));
            }
            csv.push(""); // Add an empty line between tables if there are multiple
        });

        // Trigger Download
        const csvFile = new Blob([csv.join('\n')], {type: 'text/csv;charset=utf-8;'});
        const downloadLink = document.createElement('a');
        downloadLink.download = filename + '_' + new Date().toISOString().split('T')[0] + '.csv';
        downloadLink.href = window.URL.createObjectURL(csvFile);
        downloadLink.style.display = 'none';
        document.body.appendChild(downloadLink);
        downloadLink.click();
        document.body.removeChild(downloadLink);
        
        Toast.fire({icon: 'success', title: 'Export Downloaded'});
    },
