    updateOpifField: function(id, field, value) {
        const row = this.state.opifData.find(r => r.id === id);
        if(row && row[field] !== value) {
            row[field] = value;
            // Optionally auto-calculate % here if field is a target/accomp
        }
    },

    renderOpifTable: function() {
        const tbody = document.getElementById('opifDynamicBody');
        if (!tbody) return;

        const isAdmin = this.state.userRole === 'Admin';
        const activeSection = this.state.userSection; 

        const sectionNames = {
            'A': 'A. MARKET MANAGEMENT', 'B': 'B. SLAUGHTER HOUSE MANAGEMENT',
            'C': 'C. CEMETERY MANAGEMENT', 'D': 'D. TRANSPORT TERMINAL MANAGEMENT',
            'E': 'E. ADMINISTRATIVE SERVICES'
        };

        let html = '';

        Object.keys(sectionNames).forEach(secKey => {
            // Visibility Check: Only show assigned section for Staff, ALL for Admin
            if (activeSection !== 'ALL' && activeSection !== secKey) return;

            const secRows = this.state.opifData.filter(r => r.section === secKey);
            if (secRows.length === 0) return;

            // Pre-calculate spans dynamically
            for (let i = 0; i < secRows.length; i++) {
                // Col3 Span
                if (i === 0 || secRows[i].col3 !== secRows[i-1].col3) {
                    let span = 1;
                    for (let j = i + 1; j < secRows.length; j++) {
                        if (secRows[j].col3 === secRows[i].col3) span++; else break;
                    }
                    secRows[i].spanCol3 = span;
                } else secRows[i].spanCol3 = 0;

                // Col4 Span
                if (i === 0 || secRows[i].col4 !== secRows[i-1].col4 || secRows[i].spanCol3 > 0) {
                    let span = 1;
                    for (let j = i + 1; j < secRows.length; j++) {
                        if (secRows[j].col4 === secRows[i].col4 && secRows[j].col3 === secRows[i].col3) span++; else break;
                    }
                    secRows[i].spanCol4 = span;
                } else secRows[i].spanCol4 = 0;

                // Col5 Span
                if (i === 0 || secRows[i].col5 !== secRows[i-1].col5 || secRows[i].spanCol4 > 0) {
                    let span = 1;
                    for (let j = i + 1; j < secRows.length; j++) {
                        if (secRows[j].col5 === secRows[i].col5 && secRows[j].col4 === secRows[i].col4 && secRows[j].col3 === secRows[i].col3) span++; else break;
                    }
                    secRows[i].spanCol5 = span;
                } else secRows[i].spanCol5 = 0;
            }

            // Render Rows
            secRows.forEach((row, i) => {
                const canEditActual = isAdmin || (activeSection === secKey);
                const canEditTarget = isAdmin;
                const editableAttr = isAdmin ? 'contenteditable="true" class="editable-cell"' : '';

                html += `<tr>`;
                
                // Section Title (Rowspan across all items in section)
                if (i === 0) {
                    html += `<td rowspan="${secRows.length}" class="text-left align-top bold">${sectionNames[secKey]}</td>`;
                    html += `<td rowspan="${secRows.length}"></td>`;
                }

                if (row.spanCol3 > 0) html += `<td rowspan="${row.spanCol3}" class="text-left align-top" ${editableAttr} onblur="window.app.updateOpifField('${row.id}', 'col3', this.innerText)">${row.col3 || ''}</td>`;
                if (row.spanCol4 > 0) html += `<td rowspan="${row.spanCol4}" class="text-left align-top" ${editableAttr} onblur="window.app.updateOpifField('${row.id}', 'col4', this.innerText)">${row.col4 || ''}</td>`;
                if (row.spanCol5 > 0) html += `<td rowspan="${row.spanCol5}" class="text-left align-top" ${editableAttr} onblur="window.app.updateOpifField('${row.id}', 'col5', this.innerText)">${row.col5 || ''}</td>`;

                // Columns 6 & 7 (MFO & PPA)
                html += `<td class="text-left align-top" ${editableAttr} onblur="window.app.updateOpifField('${row.id}', 'col6', this.innerText)">${row.col6 || ''}</td>`;
                html += `<td class="text-left align-top" ${editableAttr} onblur="window.app.updateOpifField('${row.id}', 'col7', this.innerText)">${row.col7 || ''}</td>`;

                // Actual & Target
                html += `<td ${canEditActual ? 'contenteditable="true" class="editable-cell"' : ''} onblur="window.app.updateOpifField('${row.id}', 'actual', this.innerText)">${row.actual || ''}</td>`;
                html += `<td ${canEditTarget ? 'contenteditable="true" class="editable-cell"' : ''} onblur="window.app.updateOpifField('${row.id}', 'semi', this.innerText)">${row.semi || ''}</td>`;

                // Quarters
                if (row.specialSpan) {
                    html += `<td ${canEditTarget ? 'contenteditable="true" class="editable-cell"' : ''} onblur="window.app.updateOpifField('${row.id}', 'q1t', this.innerText)">${row.q1t || ''}</td>`;
                    html += `<td ${canEditTarget ? 'contenteditable="true" class="editable-cell"' : ''} onblur="window.app.updateOpifField('${row.id}', 'q1a', this.innerText)">${row.q1a || ''}</td>`;
                    html += `<td class="bg-yellow" ${canEditTarget ? 'contenteditable="true" class="editable-cell"' : ''} onblur="window.app.updateOpifField('${row.id}', 'q1p', this.innerText)">${row.q1p || ''}</td>`;
                    html += `<td colspan="${row.specialSpan}" class="bg-yellow text-center" ${canEditTarget ? 'contenteditable="true" class="editable-cell"' : ''} onblur="window.app.updateOpifField('${row.id}', 'specialText', this.innerText)">${row.specialText || ''}</td>`;
                } else {
                    ['q1', 'q2', 'q3', 'q4'].forEach(q => {
                        html += `<td ${canEditTarget ? 'contenteditable="true" class="editable-cell"' : ''} onblur="window.app.updateOpifField('${row.id}', '${q}t', this.innerText)">${row[`${q}t`] || ''}</td>`;
                        html += `<td ${canEditTarget ? 'contenteditable="true" class="editable-cell"' : ''} onblur="window.app.updateOpifField('${row.id}', '${q}a', this.innerText)">${row[`${q}a`] || ''}</td>`;
                        html += `<td class="bg-yellow" ${canEditTarget ? 'contenteditable="true" class="editable-cell"' : ''} onblur="window.app.updateOpifField('${row.id}', '${q}p', this.innerText)">${row[`${q}p`] || ''}</td>`;
                    });
                }

                // Delete Action (Admin Only)
                if (isAdmin) {
                    html += `<td class="print-hide" style="border:none; text-align:center;"><button class="btn btn-ghost btn-sm" style="color:var(--danger-color); padding: 4px;" onclick="window.app.deleteOpifRow('${row.id}')" title="Delete Row"><i class="fas fa-trash"></i></button></td>`;
                }

                html += `</tr>`;
            });

            // Add Row Action (Admin Only)
            if (isAdmin) {
                html += `<tr class="print-hide"><td colspan="21" style="text-align: center; padding: 12px; background: var(--bg-color); border: 2px dashed var(--border-color);">
                            <button class="btn btn-success btn-sm" onclick="window.app.addOpifRow('${secKey}')"><i class="fas fa-plus"></i> Add Row to ${sectionNames[secKey]}</button>
                         </td></tr>`;
            }
        });

        tbody.innerHTML = html;
    },

    // --- General Status Report Logic ---
    populateYearFilter: function() {
        const select = document.getElementById('repFilterYear'); if(!select) return;
        const years = new Set(); this.state.rawRows.forEach(row => { if(row.year) years.add(String(row.year).trim()); });
        const sortedYears = Array.from(years).sort().reverse();
        let options = '<option value="All">All Years</option>'; sortedYears.forEach(y => { options += `<option value="${y}">${y}</option>`; });
        select.innerHTML = options; select.value = this.state.genFilterYear || 'All';
    },
    getFilteredGeneralRows: function() {
        const statusEl = document.getElementById('repFilterStatus');
        const sectionEl = document.getElementById('repFilterSection');
        const yearEl = document.getElementById('repFilterYear');
        const searchEl = document.getElementById('repFilterSearch');
        const sortEl = document.getElementById('repSortBy');

        const filterStatus = statusEl ? statusEl.value : (this.state.genFilterStatus || 'All');
        const filterSection = sectionEl ? sectionEl.value : (this.state.genFilterSection || 'All');
        const filterYear = yearEl ? yearEl.value : (this.state.genFilterYear || 'All');
        const filterSearch = (searchEl ? searchEl.value : '').toLowerCase().trim();
        const sortBy = sortEl ? sortEl.value : (this.state.genSort || 'Stall No');
        
        this.state.genFilterStatus = filterStatus; 
        this.state.genFilterSection = filterSection; 
        this.state.genFilterYear = filterYear; 
        this.state.genSort = sortBy;

        let rows = Object.values(this.state.stallData).map(sd => sd.current).filter(r => r && r.stallOwner); 

        rows = rows.filter(r => {
            if(filterStatus !== 'All' && (r.status || 'Non-Compliant') !== filterStatus) return false;
            const prefix = r.stallNo.split('-')[0]; const simpleMap = { 'G':'Wet','B':'Wet','I':'Wet','A':'Wet','C':'Wet','E':'Wet', 'J':'Dry','L':'Dry', 'HE':'Old', 'K':'Triangular','H':'Triangular' };
            const mapSection = simpleMap[prefix] || (r.stallNo.includes('HE') ? 'Old' : (r.stallNo.startsWith('D') ? (parseInt(r.stallNo.split('-')[1])>=20 ? 'Triangular' : 'Dry') : 'Wet'));
            if(filterSection !== 'All' && mapSection !== filterSection) return false;
            if(filterYear !== 'All' && String(r.year).trim() !== filterYear) return false;
            if(filterSearch && !r.stallNo.toLowerCase().includes(filterSearch) && !r.stallOwner.toLowerCase().includes(filterSearch)) return false;
            return true;
        });

        rows.sort((a, b) => {
            if(sortBy === 'Stall No') return a.stallNo.localeCompare(b.stallNo, undefined, {numeric: true});
            if(sortBy === 'Owner') return a.stallOwner.localeCompare(b.stallOwner);
            if(sortBy === 'Status') return (a.status||'').localeCompare(b.status||'');
        });

        return rows;
    },

    renderGeneralReportTable: function(resetPage = false) {
        const tableBody = document.getElementById('reportTableBody'); const paginationInfo = document.getElementById('paginationInfo');
        const btnPrev = document.getElementById('btnPrevPage'); const btnNext = document.getElementById('btnNextPage');
        if(!tableBody) return; 

        if(resetPage) this.state.reportPage = 1;
        const rows = this.getFilteredGeneralRows();

        const totalRows = rows.length; const limit = this.state.reportLimit; const startIndex = (this.state.reportPage - 1) * limit; const endIndex = startIndex + limit;
        const paginatedRows = rows.slice(startIndex, endIndex);

        let html = '';
        paginatedRows.forEach(r => {
            let dotColor = r.status === 'Compliant' ? 'dot-green' : (r.status === 'Lacking' ? 'dot-orange' : 'dot-red');
            html += `<tr><td><strong>${r.stallNo}</strong></td><td>${r.stallOwner}</td><td>${r.operator}</td><td>${r.lineOfBusiness}</td><td>${r.year || ''}</td><td><span class="status-dot ${dotColor}"></span>${r.status||'Non-Compliant'}</td><td>${r.columnI || ''}</td></tr>`;
        });
        if(totalRows === 0) html = `<tr><td colspan="7" style="text-align:center; padding: 40px; color: var(--text-muted);">No records found matching filters</td></tr>`;
        tableBody.innerHTML = html;

        if(paginationInfo) paginationInfo.textContent = `Showing ${totalRows > 0 ? startIndex + 1 : 0} to ${Math.min(endIndex, totalRows)} of ${totalRows} entries`;
        if(btnPrev) btnPrev.disabled = this.state.reportPage === 1; 
        if(btnNext) btnNext.disabled = endIndex >= totalRows;
    },

    // --- Monthly Compliance Report Logic ---
    populateComplianceMonths: function() {
        const select = document.getElementById('compFilterMonth'); if(!select) return;
        const months = new Set();
        this.state.monitoringHistory.forEach(h => {
            if(h.date && h.date.length >= 7) {
                const parts = h.date.split('-');
                if(parts.length >= 2) months.add(`${parts[0]}-${parts[1]}`);
            }
        });
        
        const sortedMonths = Array.from(months).sort().reverse();
        let options = '<option value="latest">Latest Updates (Current Data)</option>';
        
        sortedMonths.forEach(ym => {
            const parts = ym.split('-');
            if(parts.length === 2) {
                const dateObj = new Date(parseInt(parts[0]), parseInt(parts[1])-1, 1);
                const label = dateObj.toLocaleString('default', { month: 'long', year: 'numeric' });
                options += `<option value="${ym}">${label}</option>`;
            }
        });
        
        select.innerHTML = options;
        select.value = this.state.compFilterMonth;
    },

    getFilteredComplianceRows: function() {
        const monthSelect = document.getElementById('compFilterMonth');
        const monthVal = monthSelect ? monthSelect.value : (this.state.compFilterMonth || 'latest');
        const metricSelect = document.getElementById('compFilterMetric');
        const metricVal = metricSelect ? metricSelect.value : (this.state.compFilterMetric || 'all');
        const sortSelect = document.getElementById('compSortBy');
        const sortVal = sortSelect ? sortSelect.value : (this.state.compSort || 'Stall No');
        
        this.state.compFilterMonth = monthVal;
        this.state.compFilterMetric = metricVal;
        this.state.compSort = sortVal;

        let rawDataSet = [];
        if(monthVal === 'latest') {
            rawDataSet = Object.values(this.state.stallData)
                .filter(sd => sd.current && sd.current.stallOwner)
                .map(sd => {
                    const r = sd.current;
                    return {
                        stallNo: r.stallNo, owner: r.stallOwner,
                        date: r.monDate, status: r.monStatus || 'Operational',
                        permit: r.monPermit, lease: r.monLease, rental: r.monRental, seminars: r.monSeminars
                    };
                });
        } else {
            let recordsByStall = {};
            this.state.monitoringHistory.forEach(h => {
                if(h.date && h.date.startsWith(monthVal)) {
                    if(!recordsByStall[h.stallNo] || new Date(h.timestamp) > new Date(recordsByStall[h.stallNo].timestamp)) {
                        recordsByStall[h.stallNo] = h;
                    }
                }
            });
            rawDataSet = Object.values(recordsByStall);
        }

        let filteredRows = rawDataSet.filter(r => {
            if(metricVal === 'all') return true;
            if(metricVal === 'op') return r.status === 'Operational';
            if(metricVal === 'non_op') return r.status === 'Non-Operational';
            
            const permitSafe = String(r.permit || '');
            if(metricVal === 'permit_yes') return permitSafe && permitSafe.toLowerCase() !== 'no submission';
            if(metricVal === 'permit_no') return !permitSafe || permitSafe.toLowerCase() === 'no submission';

            const leaseSafe = String(r.lease || '');
            if(metricVal === 'lease_yes') return leaseSafe && leaseSafe.toLowerCase() !== 'no submission';
            if(metricVal === 'lease_no') return !leaseSafe || leaseSafe.toLowerCase() === 'no submission';

            const rentSafe = String(r.rental || '');
            if(metricVal === 'rental_yes') return rentSafe && rentSafe.toLowerCase() !== 'no payment';
            if(metricVal === 'rental_no') return !rentSafe || rentSafe.toLowerCase() === 'no payment';

            const semSafe = String(r.seminars || '');
            if(metricVal === 'sem_yes') return semSafe && semSafe.trim() !== '';
            if(metricVal === 'sem_no') return !semSafe || semSafe.trim() === '';
            
            return true;
        });

        filteredRows.sort((a, b) => {
            if(sortVal === 'Stall No') return a.stallNo.localeCompare(b.stallNo, undefined, {numeric: true});
            if(sortVal === 'Owner') return (a.owner||'').localeCompare(b.owner||'');
        });

        const monthLabel = monthSelect && monthSelect.options[monthSelect.selectedIndex] ? monthSelect.options[monthSelect.selectedIndex].text : monthVal;
        const metricLabel = metricSelect && metricSelect.options[metricSelect.selectedIndex] ? metricSelect.options[metricSelect.selectedIndex].text : metricVal;

        return { rawDataSet, filteredRows, monthLabel, metricLabel };
    },

    renderComplianceReportTable: function(resetPage = false) {
        const tableBody = document.getElementById('compReportTableBody');
        const paginationInfo = document.getElementById('compPaginationInfo');
        const btnPrev = document.getElementById('btnCompPrevPage');
        const btnNext = document.getElementById('btnCompNextPage');
        
        if(!tableBody) return; 

        if(resetPage) this.state.reportPage = 1;
        const { rawDataSet, filteredRows } = this.getFilteredComplianceRows();
        this.renderComplianceSummaries(rawDataSet);

        const totalRows = filteredRows.length; const limit = this.state.reportLimit; 
        const startIndex = (this.state.reportPage - 1) * limit; const endIndex = startIndex + limit;
        const paginatedRows = filteredRows.slice(startIndex, endIndex);

        let html = '';
        paginatedRows.forEach(r => {
            const sColor = r.status === 'Operational' ? 'badge-approved' : 'badge-blocked';
            let semCount = 0; if(r.seminars) semCount = r.seminars.split(/\r?\n/).filter(s=>s.trim()!=='').length;
            
            html += `<tr>
                <td><strong>${r.stallNo}</strong></td>
                <td>${r.owner}</td>
                <td><span class="badge ${sColor}">${r.status||'-'}</span></td>
                <td>${r.permit || '-'}</td>
                <td>${r.lease || '-'}</td>
                <td>${r.rental || '-'}</td>
                <td>${semCount > 0 ? `<span class="badge badge-admin">${semCount} Attended</span>` : '-'}</td>
            </tr>`;
        });

        if(totalRows === 0) html = `<tr><td colspan="7" style="text-align:center; padding: 40px; color: var(--text-muted);">No records found for these conditions</td></tr>`;
        tableBody.innerHTML = html;

        if(paginationInfo) paginationInfo.textContent = `Showing ${totalRows > 0 ? startIndex + 1 : 0} to ${Math.min(endIndex, totalRows)} of ${totalRows} entries`;
        if(btnPrev) btnPrev.disabled = this.state.reportPage === 1; 
        if(btnNext) btnNext.disabled = endIndex >= totalRows;
    },

    renderComplianceSummaries: function(data) {
        let total = data.length;
        let op = 0, pYes = 0, lYes = 0, rYes = 0, sYes = 0;
        
        data.forEach(r => {
            if(r.status === 'Operational') op++;
            if(r.permit && String(r.permit).toLowerCase() !== 'no submission') pYes++;
            if(r.lease && String(r.lease).toLowerCase() !== 'no submission') lYes++;
            if(r.rental && String(r.rental).toLowerCase() !== 'no payment') rYes++;
            if(r.seminars && String(r.seminars).trim() !== '') sYes++;
        });

        const setVal = (id, val) => { const el = document.getElementById(id); if(el) el.textContent = val; };
        setVal('sumTotal', total);
        setVal('sumOp', op);
        setVal('sumPermit', pYes);
        setVal('sumLease', lYes);
        setVal('sumRental', rYes);
    },

    // --- UNIVERSAL CSV EXPORT FUNCTION ---
    exportToCSV: function(filename, tableSelectors) {
        let csv = [];
        // Support array of table selectors (for reports with multiple summary tables)
        let selectors = Array.isArray(tableSelectors) ? tableSelectors : [tableSelectors];
        
        selectors.forEach(selector => {
            const table = document.querySelector(selector);
            if (!table) return;
            
            const rows = table.querySelectorAll('tr');
            for (let i = 0; i < rows.length; i++) {
                let row = [], cols = rows[i].querySelectorAll('td, th');
                
                for (let j = 0; j < cols.length; j++) {
                    // Skip action columns or buttons
                    if (cols[j].innerText.trim().toLowerCase() === 'action') continue;
                    if (cols[j].querySelector('button') && cols[j].innerText.trim() === '') continue;
                    
                    // Clean text: remove newlines and escape quotes for CSV format
                    let data = cols[j].innerText.replace(/(\r\n|\n|\r)/gm, ' ').replace(/"/g, '""').trim();
                    row.push('"' + data + '"');
                }
                if (row.length > 0) csv.push(row.join(','));
            }
            csv.push(""); // Add an empty line between tables if there are multiple
        });

        // Trigger Download
        const csvFile = new Blob([csv.join('\n')], {type: 'text/csv;charset=utf-8;'});
        const downloadLink = document.createElement('a');
        downloadLink.download = filename + '_' + new Date().toISOString().split('T')[0] + '.csv';
        downloadLink.href = window.URL.createObjectURL(csvFile);
        downloadLink.style.display = 'none';
        document.body.appendChild(downloadLink);
        downloadLink.click();
        document.body.removeChild(downloadLink);
        
        Toast.fire({icon: 'success', title: 'Export Downloaded'});
    },

            })

    closeModal: function() { document.getElementById('modalOverlay').classList.remove('open'); this.state.selectedStallId = null; },
    handleFileSelect: function(input) {
       if (input.files && input.files[0]) {
          const file = input.files[0];
          // Downscale & compress high-res camera/phone photos to ~25KB to prevent GAS payload crash
          const reader = new FileReader();
          reader.onload = e => {
             const tempImg = new Image();
             tempImg.onload = () => {
                const canvas = document.createElement('canvas');
                let width = tempImg.width;
                let height = tempImg.height;
                const maxDim = 400;
                if (width > maxDim || height > maxDim) {
                   if (width > height) {
                      height = Math.round((height * maxDim) / width);
                      width = maxDim;
                   } else {
                      width = Math.round((width * maxDim) / height);
                      height = maxDim;
                   }
                }
                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(tempImg, 0, 0, width, height);
                const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.82);

                const profileImgEl = document.getElementById('profileImage');
                profileImgEl.src = compressedDataUrl;
                profileImgEl.style.display = 'block';
                document.getElementById('profilePlaceholder').style.display = 'none';

                const uploadObj = {
                   data: compressedDataUrl.split(',')[1],
                   mimeType: 'image/jpeg'
                };
                window.app.state.pendingUpload = uploadObj;
                this.state.pendingUpload = uploadObj;
             };
             tempImg.src = e.target.result;
          };
          reader.readAsDataURL(file);
       }
    },
    handleDocUpload: function(input, type) {
       const owner = document.getElementById('inputOwner').value; if(!owner) { Toast.fire({icon:'warning', title:'Please set owner first'}); return; }
       if (input.files && input.files[0]) {
          const reader = new FileReader();
          reader.onload = e => {
             if(confirm(`Upload ${type} for ${owner}?`)) {
                const data = e.target.result.split(',')[1];
                if(window.google && window.google.script) {
                   google.script.run.withSuccessHandler(res => { if(res.success) { Toast.fire({icon:'success', title:'Document Uploaded'}); window.app.fetchVendorAssets(owner); } else { Toast.fire({icon:'error', title:'Upload Failed'}); } }).uploadVendorDocument(data, input.files[0].type, owner, type);
                }
             }
          };
          reader.readAsDataURL(input.files[0]);
       }
    },

    saveStall: function(mode) {
      const id = this.state.selectedStallId; if(!id) return;
      const btn = mode === 'update' ? document.getElementById('btnSaveUpdate') : document.getElementById('btnSaveNew');
      const originalText = btn.textContent; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving...'; btn.disabled = true;

      const payload = {
         stallNo: id, stallOwner: document.getElementById('inputOwner').value, operator: document.getElementById('inputOperator').value, lineOfBusiness: document.getElementById('inputLOB').value,
         periodIndex: document.getElementById('inputPeriod').value, columnI: document.getElementById('inputColI').value, status: this.state.currentStatus
      };
      const rowIndex = mode === 'update' ? (this.state.stallData[id]?.current?.rowIndex || 0) : 0;

      const proceedToUpdateData = () => {
         if (window.google && window.google.script) {
            google.script.run.withSuccessHandler(() => { 
               this.closeModal(); this.loadData(); btn.textContent = originalText; btn.disabled = false; Toast.fire({ icon: 'success', title: 'Data Saved Successfully' });
            }).withFailureHandler(err => { Toast.fire({ icon: 'error', title: 'Save Failed: ' + (err.message || '') }); btn.textContent = originalText; btn.disabled = false; }).updateStallData(rowIndex, payload);
         } else {
             setTimeout(() => { this.closeModal(); btn.textContent = originalText; btn.disabled = false; Toast.fire({ icon: 'success', title: 'Saved (Demo)'}); }, 1000);
         }
      };

      const pending = this.state.pendingUpload || window.app.state.pendingUpload;
      if (pending && payload.stallOwner && window.google && window.google.script) {
         btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Uploading Photo...';
         google.script.run
           .withSuccessHandler(res => { 
             if (res && res.success === false) {
               console.error("Photo upload error from server:", res.message);
               Toast.fire({ icon: 'error', title: 'Photo Upload Failed: ' + (res.message || 'Server error') });
               btn.textContent = originalText;
               btn.disabled = false;
               return;
             }
             if (res && res.url) {
               document.getElementById('profileImage').src = res.url;
             }
             this.state.pendingUpload = null;
             window.app.state.pendingUpload = null;
             proceedToUpdateData(); 
           })
           .withFailureHandler(err => {
             console.error("Photo upload failed:", err);
             Toast.fire({ icon: 'error', title: 'Upload Failed: ' + (err.message || 'Connection lost') });
             btn.textContent = originalText;
             btn.disabled = false;
           })
           .uploadVendorImage(pending.data, pending.mimeType, payload.stallOwner);
      } else { proceedToUpdateData(); }
    },

    deleteToda: function(id, name) {
        const memberCount = this.state.memberData.filter(m => m.todaName === name).length;
        let warningText = `Are you sure you want to delete ${name}?`;
        if (memberCount > 0) {
            warningText += ` Warning: This TODA currently has ${memberCount} associated driver member(s) that will also be removed.`;
        }

        Swal.fire({
            title: 'Delete TODA?',
            text: warningText,
            icon: 'warning',
            showCancelButton: true,
            confirmButtonColor: '#ef4444',
            cancelButtonColor: '#6b7280',
            confirmButtonText: 'Yes, delete it!'
        }).then((result) => {
            if (result.isConfirmed) {
                const handleSuccess = () => {
                    Toast.fire({ icon: 'success', title: 'TODA Deleted' });
                    if (this.state.editingTodaId === id) this.cancelEditToda();
                    this.state.todaData = this.state.todaData.filter(t => t.id !== id);
                    this.state.memberData = this.state.memberData.filter(m => m.todaName !== name);
                    this.renderTodaTable();
                    this.populateTodaDropdown();
                    this.renderTodaReport();
                };

                if (window.google && window.google.script) {
                    google.script.run.withSuccessHandler(res => {
                        if (res.success) handleSuccess();
                        else Toast.fire({ icon: 'error', title: res.message });
                    }).deleteTodaEntryDB(id, name);
                } else {
                    handleSuccess();
                }
            }
        });
    },

    saveToda: function() {
        const btn = document.getElementById('btnSaveToda') || event.currentTarget;
        const origText = btn.innerHTML;
        const isEditing = Boolean(this.state.editingTodaId);

        const data = {
            id: this.state.editingTodaId,
            originalName: this.state.editingTodaOrigName,
            regNo: document.getElementById('todaRegNo').value,
            name: document.getElementById('todaName').value.trim(),
            president: document.getElementById('todaPresident').value.trim(),
            contact: document.getElementById('todaContact').value.trim(),
            membersCount: document.getElementById('todaTotalMembers').value,
            address: document.getElementById('todaAddress').value.trim()
        };

        if(!data.name) { Toast.fire({icon:'warning', title:'TODA Name is required'}); return; }
        btn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> ${isEditing ? 'Updating...' : 'Saving...'}`;
        btn.disabled = true;

        const handleSuccess = (newId) => {
            btn.innerHTML = origText;
            btn.disabled = false;
            Toast.fire({icon:'success', title: isEditing ? 'TODA Updated' : 'TODA Saved'});

            if (isEditing) {
                const index = this.state.todaData.findIndex(t => t.id === data.id);
                if (index !== -1) {
                    this.state.todaData[index] = { ...this.state.todaData[index], ...data };
                }
                if (data.originalName && data.originalName !== data.name) {
                    this.state.memberData.forEach(m => {
                        if (m.todaName === data.originalName) m.todaName = data.name;
                    });
                }
                this.cancelEditToda();
            } else {
                data.id = newId || ('toda_' + Date.now());
                this.state.todaData.push(data);
                ['todaRegNo','todaName','todaPresident','todaContact','todaTotalMembers','todaAddress'].forEach(id => {
                    const el = document.getElementById(id);
                    if (el) el.value = '';
                });
            }

            this.renderTodaTable();
            this.populateTodaDropdown();
            this.renderTodaReport();
        };

        if (window.google && window.google.script) {
            if (isEditing) {
                google.script.run.withSuccessHandler(res => {
                    if (res.success) handleSuccess();
                    else { btn.innerHTML = origText; btn.disabled = false; Toast.fire({icon:'error', title:res.message}); }
                }).updateTodaEntry(data);
            } else {
                google.script.run.withSuccessHandler(res => {
                    if (res.success) handleSuccess(res.id);
                    else { btn.innerHTML = origText; btn.disabled = false; Toast.fire({icon:'error', title:res.message}); }
                }).saveTodaEntry(data);
            }
        } else {
            setTimeout(() => handleSuccess('demo_' + Date.now()), 500);
        }
    },

        Swal.fire({

            showCancelButton: true,
            confirmButtonColor: '#ef4444',
            cancelButtonColor: '#6b7280',

                    Toast.fire({ icon: 'success', title: 'Member Deleted' });

                    this.state.memberData = this.state.memberData.filter(m => m.id !== id);

                        if (res.success) handleSuccess();

    saveMember: function() {
        const btn = document.getElementById('btnSaveMember') || event.currentTarget;
        const origText = btn.innerHTML;
        const isEditing = Boolean(this.state.editingMemberId);

        const data = {
            id: this.state.editingMemberId,
            todaName: document.getElementById('memberTodaSelect').value,
            lastName: document.getElementById('memLastName').value.trim(),
            firstName: document.getElementById('memFirstName').value.trim(),
            middleName: document.getElementById('memMiddleName').value.trim(),
            extName: document.getElementById('memExtName').value.trim(),
            sex: document.getElementById('memSex').value,
            barangay: document.getElementById('memBarangay').value.trim(),
            municipality: document.getElementById('memMunicipality').value.trim(),
            contact: document.getElementById('memContact').value.trim(),
            idType: document.getElementById('memIdType').value.trim() || "Driver's License",
            idNumber: document.getElementById('memIdNumber').value.trim(),
            idExpiry: document.getElementById('memIdExpiry').value
        };
        
        if(!data.lastName || !data.firstName) { Toast.fire({icon:'warning', title:'Last Name and First Name are required'}); return; }
        btn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> ${isEditing ? 'Updating...' : 'Saving...'}`;
        btn.disabled = true;
        
        const handleSuccess = (newId) => {
            btn.innerHTML = origText;
            btn.disabled = false;
            Toast.fire({icon:'success', title: isEditing ? 'Member Updated' : 'Member Added'});

            if (isEditing) {
                const index = this.state.memberData.findIndex(m => m.id === data.id);
                if (index !== -1) {
                    this.state.memberData[index] = { ...this.state.memberData[index], ...data };
                }
                this.cancelEditMember();
            } else {
                data.id = newId || ('mem_' + Date.now());
                this.state.memberData.push(data);
                ['memLastName','memFirstName','memMiddleName','memExtName','memBarangay','memMunicipality','memContact','memIdNumber','memIdExpiry'].forEach(id => {
                    const el = document.getElementById(id);
                    if (el) el.value = '';
                });
                const idTypeEl = document.getElementById('memIdType');
                if (idTypeEl) idTypeEl.value = "Driver's License";
            }

            this.renderMembersTable();
            this.renderTodaReport();
        };

        if (window.google && window.google.script) {
            if (isEditing) {
                google.script.run.withSuccessHandler(res => {
                    if (res.success) handleSuccess();
                    else { btn.innerHTML = origText; btn.disabled = false; Toast.fire({icon:'error', title:res.message}); }
                }).updateMemberEntry(data);
            } else {
                google.script.run.withSuccessHandler(res => {
                    if (res.success) handleSuccess(res.id);
                    else { btn.innerHTML = origText; btn.disabled = false; Toast.fire({icon:'error', title:res.message}); }
                }).saveMemberEntry(data);
            }
        } else {
            setTimeout(() => handleSuccess('demo_' + Date.now()), 500);
        }
    },

    renderTodaReport: function() {
        const tbody = document.getElementById('todaReportTableBody');
        const summaryCont = document.getElementById('todaSummaryCards');
        if(!tbody || !summaryCont) return;

        let totalTodas = this.state.todaData.length;
        let totalMembers = this.state.memberData.length;
        let totalMale = 0;
        let totalFemale = 0;

        // Map to aggregate data per TODA
        let todaStats = {};
        this.state.todaData.forEach(t => {
            todaStats[t.name] = { 
                president: t.president, 
                regMembers: parseInt(t.membersCount) || 0, // Expected registered limit
                actualMembers: 0, // Encoded profiles
                male: 0, 
                female: 0 
            };
        });

        // Count profiles and map to their respective TODA
        this.state.memberData.forEach(m => {
            if (m.sex === 'Male') totalMale++;
            if (m.sex === 'Female') totalFemale++;
            
            if (todaStats[m.todaName]) {
                todaStats[m.todaName].actualMembers++;
                if (m.sex === 'Male') todaStats[m.todaName].male++;
                if (m.sex === 'Female') todaStats[m.todaName].female++;
            }
        });

        // Render Summary Cards
        summaryCont.innerHTML = `
            <div class="summary-card"><div class="summary-value">${totalTodas}</div><div class="summary-label">Total TODAs</div></div>
            <div class="summary-card"><div class="summary-value">${totalMembers}</div><div class="summary-label">Encoded Profiles</div></div>
            <div class="summary-card" style="background:var(--primary-light)"><div class="summary-value" style="color:var(--primary-dark)">${totalMale}</div><div class="summary-label">Male Drivers</div></div>
            <div class="summary-card" style="background:var(--danger-light)"><div class="summary-value" style="color:var(--danger-color)">${totalFemale}</div><div class="summary-label">Female Drivers</div></div>
        `;

        // Render Table Breakdown
        let html = '';
        for (const [todaName, stats] of Object.entries(todaStats)) {
            html += `<tr>
                <td><strong>${todaName}</strong></td>
                <td>${stats.president || '-'}</td>
                <td><strong>${stats.actualMembers}</strong> <span style="font-size:0.8rem; color:var(--text-muted)">(of ${stats.regMembers} Reg.)</span></td>
                <td>${stats.male}</td>
                <td>${stats.female}</td>
            </tr>`;
        }
        if(Object.keys(todaStats).length === 0) {
            html = `<tr><td colspan="5" style="text-align:center; padding:20px;">No TODA data available.</td></tr>`;
        }
        tbody.innerHTML = html;
    },

    // --- CEMETERY MANAGEMENT LOGIC ---
    renderCemeteryTable: function() {
        const tbody = document.getElementById('cemBookingTableBody');
        if(!tbody) return;

        const total = this.state.cemeteryData.length;
        const limit = this.state.cemBookingLimit || 15;
        const totalPages = Math.ceil(total / limit) || 1;
        if (!this.state.cemBookingPage || this.state.cemBookingPage < 1) this.state.cemBookingPage = 1;
        if (this.state.cemBookingPage > totalPages) this.state.cemBookingPage = totalPages;

        const startIdx = (this.state.cemBookingPage - 1) * limit;
        const endIdx = Math.min(startIdx + limit, total);
        const paged = this.state.cemeteryData.slice(startIdx, endIdx);

        let html = '';
        paged.forEach(c => {
            const rawId = String(c.id || '');
            const safeId = encodeURIComponent(rawId);
            const safeName = window.app.escapeHTML(c.deceasedName || '');
            html += `<tr>
                <td><strong>${c.deceasedName}</strong></td>
                <td>${c.address}</td>
                <td>${c.phone}</td>
                <td>${c.burialDate}</td>
                <td>${c.burialType}</td>
                <td style="color:var(--primary-dark); font-weight:bold;">₱ ${Number(c.amount).toLocaleString('en-US', {minimumFractionDigits: 2})}</td>
                <td class="no-print" style="text-align: center; white-space: nowrap;">
                    <button type="button" class="btn btn-ghost btn-sm" style="color:var(--primary-color); padding: 4px 6px;" onclick="window.app.openCemeteryEditModal('${safeId}')" title="Edit Booking">
                        <i class="fas fa-edit"></i>
                    </button>
                    <button type="button" class="btn btn-ghost btn-sm" style="color:var(--danger-color); padding: 4px 6px;" onclick="window.app.deleteCemeteryBooking('${safeId}', '${safeName}')" title="Delete Booking">
                        <i class="fas fa-trash-alt"></i>
                    </button>
                </td>
            </tr>`;
        });
        if(total === 0) html = '<tr><td colspan="7" style="text-align:center; padding: 20px;">No bookings found.</td></tr>';
        tbody.innerHTML = html;

        // Update Pagination Controls
        const infoEl = document.getElementById('cemBookingPaginationInfo');
        if (infoEl) infoEl.textContent = `Showing ${total === 0 ? 0 : startIdx + 1} to ${endIdx} of ${total} entries`;
        const btnPrev = document.getElementById('btnCemBookingPrevPage');
        if (btnPrev) btnPrev.disabled = this.state.cemBookingPage <= 1;
        const btnNext = document.getElementById('btnCemBookingNextPage');
        if (btnNext) btnNext.disabled = this.state.cemBookingPage >= totalPages;
    },

    openCemeteryEditModal: function(id) {
        if (!id) return;
        try { id = decodeURIComponent(id); } catch(e) {}
        const b = this.state.cemeteryData.find(c => String(c.id).trim() === String(id).trim());
        if (!b) {
            console.warn('Booking record not found for ID:', id);
            Toast.fire({ icon: 'warning', title: 'Booking record not found' });
            return;
        }

        const idEl = document.getElementById('editCemId');
        if (idEl) idEl.value = b.id || '';

        const titleEl = document.getElementById('cemModalTitle');
        if (titleEl) titleEl.textContent = 'Edit Burial Booking';

        const iconEl = document.getElementById('cemModalIcon');
        if (iconEl) iconEl.className = 'fas fa-edit text-sub';

        const btnSave = document.getElementById('btnSaveCemModal');
        if (btnSave) btnSave.innerHTML = '<i class="fas fa-save"></i> Update Booking';

        // Parse date & time
        let rawDate = b.rawDate || '';
        let rawTime = b.rawTime || '';
        if (!rawDate && b.burialDate) {
            const match = String(b.burialDate).match(/^(\d{4}-\d{2}-\d{2})/);
            if (match) rawDate = match[1];
        }
        if (!rawTime && b.burialDate) {
            const timeMatch = String(b.burialDate).match(/(\d{1,2}):(\d{2})\s*(AM|PM)?/i);
            if (timeMatch) {
                let hr = parseInt(timeMatch[1], 10);
                const min = timeMatch[2];
                const ampm = (timeMatch[3] || '').toUpperCase();
                if (ampm === 'PM' && hr < 12) hr += 12;
                if (ampm === 'AM' && hr === 12) hr = 0;
                rawTime = `${String(hr).padStart(2, '0')}:${min}`;
            }
        }

        if (document.getElementById('cemDate')) document.getElementById('cemDate').value = rawDate;
        if (document.getElementById('cemTime')) document.getElementById('cemTime').value = rawTime;
        if (document.getElementById('cemDeceased')) document.getElementById('cemDeceased').value = b.deceasedName || '';
        if (document.getElementById('cemAddress')) document.getElementById('cemAddress').value = b.address || '';
        if (document.getElementById('cemPhone')) document.getElementById('cemPhone').value = b.phone || '';
        if (document.getElementById('cemType')) document.getElementById('cemType').value = b.burialType || 'Apartment';
        if (document.getElementById('cemAmount')) document.getElementById('cemAmount').value = b.amount !== undefined ? b.amount : '';

    // --- CEMETERY RUNNING BALANCE & BASELINE INVENTORY ---
    calculateCemeteryInventory: function() {
        // Initial baseline tally provided from official records (as of March 2026):
        const baseline = {
            2023: { apartment: 25, ground: 12 },
            2024: { apartment: 63, ground: 4 },
            2025: { apartment: 62, ground: 9 },
            2026: { apartment: 21, ground: 3 }
        };
        const maxApartmentCapacity = 624;

        // Clone baseline
        let yearly = {};
        for (let y = 2023; y <= 2026; y++) {
            yearly[y] = { apartment: baseline[y].apartment, ground: baseline[y].ground };
        }

        // Add dynamic records from this.state.cemeteryData
        (this.state.cemeteryData || []).forEach(c => {
            if (!c.burialDate) return;
            let yr = 2026;
            const dateMatch = String(c.burialDate).match(/^(\d{4})/);
            if (dateMatch) {
                yr = parseInt(dateMatch[1], 10);
            } else {
                const d = new Date(c.burialDate);
                if (!isNaN(d.getFullYear())) yr = d.getFullYear();
            }
            if (!yearly[yr]) {
                yearly[yr] = { apartment: 0, ground: 0 };
            }

            const bType = String(c.burialType || '').trim().toLowerCase();
            if (bType.includes('apartment')) {
                yearly[yr].apartment++;
            } else if (bType.includes('ground') || bType.includes('tomb')) {
                yearly[yr].ground++;
            }
        });

        let totalApartment = 0;
        let totalGround = 0;
        Object.keys(yearly).sort().forEach(yr => {
            totalApartment += yearly[yr].apartment;
            totalGround += yearly[yr].ground;
        });

        const availableApartment = Math.max(0, maxApartmentCapacity - totalApartment);
        const occupancyPercent = ((totalApartment / maxApartmentCapacity) * 100).toFixed(1);

        return {
            yearly: yearly,
            maxApartmentCapacity: maxApartmentCapacity,
            totalApartment: totalApartment,
            totalGround: totalGround,
            availableApartment: availableApartment,
            occupancyPercent: occupancyPercent,
            grandTotal: totalApartment + totalGround
        };
    },

    updateCemModalHelper: function() {
        const typeSelect = document.getElementById('cemType');
        const helper = document.getElementById('cemTypeHelper');
        if (!typeSelect || !helper) return;

        const val = typeSelect.value;
        const inv = this.calculateCemeteryInventory();

        if (val === 'Apartment') {
            const nextSlot = inv.totalApartment + 1;
            const nextAvail = Math.max(0, inv.availableApartment - 1);
            helper.style.display = 'block';
            helper.innerHTML = `<i class="fas fa-info-circle"></i> <strong>Apartment Running Balance:</strong> Currently <strong>${inv.totalApartment}/${inv.maxApartmentCapacity}</strong> occupied (${inv.availableApartment} available). Scheduling this booking will be <strong>Slot #${nextSlot}/${inv.maxApartmentCapacity}</strong> (${nextAvail} remaining).`;
        } else if (val === 'Ground') {
            const nextCount = inv.totalGround + 1;
            helper.style.display = 'block';
            helper.innerHTML = `<i class="fas fa-info-circle"></i> <strong>Ground (Old Tomb):</strong> Currently <strong>${inv.totalGround}</strong> logged. Scheduling this booking will be <strong>#${nextCount}</strong>. Ground capacity is <strong>unlimited</strong>.`;
        } else {
            helper.style.display = 'none';
            helper.innerHTML = '';
        }
    },

    initCemeteryCalendar: function() {
        const calendarEl = document.getElementById('cemeteryCalendar');
        if (!calendarEl) return;

        const events = this.state.cemeteryData.map(c => ({
            title: c.deceasedName,
            start: c.burialDate,
            backgroundColor: 'var(--primary-color)',
            borderColor: 'var(--primary-dark)'
        }));

        if (this.cemCalendarInstance) this.cemCalendarInstance.destroy();

        this.cemCalendarInstance = new FullCalendar.Calendar(calendarEl, {
            initialView: 'dayGridMonth',
            height: 550,
            events: events,
            dateClick: function(info) {
                window.app.openCemeteryModal(info.dateStr);
            }
        });
        this.cemCalendarInstance.render();
    },

    saveCemeteryBooking: function() {
        const btn = document.getElementById('btnSaveCemModal'); 
        const origText = btn.innerHTML;
        // Format time to 12-hour AM/PM for display in tables and sheets
        const rawTime = document.getElementById('cemTime').value;
        let formattedTime = '';
        if (rawTime) {
            const [hours, minutes] = rawTime.split(':');
            const ampm = hours >= 12 ? 'PM' : 'AM';
            const hr12 = hours % 12 || 12;
            formattedTime = ` ${hr12}:${minutes} ${ampm}`;
        }

        const editId = document.getElementById('editCemId') ? document.getElementById('editCemId').value : '';

        const data = {
            id: editId || undefined,
            deceasedName: document.getElementById('cemDeceased').value.trim(), 
            address: document.getElementById('cemAddress').value.trim(),
            phone: document.getElementById('cemPhone').value.trim(), 
            burialDate: document.getElementById('cemDate').value + formattedTime, // Combined Date & Time string
            rawDate: document.getElementById('cemDate').value, // Kept separate for backend Calendar use
            rawTime: rawTime, // Kept separate for backend Calendar use
            burialType: document.getElementById('cemType').value, 
            amount: parseFloat(document.getElementById('cemAmount').value) || 0
        };
        
        if(!data.deceasedName || !data.rawDate) { Toast.fire({icon:'warning', title:'Name and Date are required'}); return; }
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving...'; btn.disabled = true;

        if (editId) {
            // Update Existing Booking
            const handleUpdateSuccess = () => {
                btn.innerHTML = origText; btn.disabled = false;
                Toast.fire({ icon: 'success', title: 'Booking Updated' });
                const idx = this.state.cemeteryData.findIndex(c => String(c.id).trim() === String(editId).trim());
                if (idx !== -1) {
                    this.state.cemeteryData[idx] = { ...this.state.cemeteryData[idx], ...data };
                }
                this.renderCemeteryTable();
                this.initCemeteryCalendar();
                this.renderCemeteryReport(false);
                this.updateCemModalHelper();
                this.closeCemeteryModal();
            };

            if (window.google && window.google.script) {
                google.script.run.withSuccessHandler(res => {
                    if (res && res.success) handleUpdateSuccess();
                    else { btn.innerHTML = origText; btn.disabled = false; Toast.fire({ icon: 'error', title: res ? res.message : 'Update failed' }); }
                }).updateCemeteryBooking(data);
            } else {
                setTimeout(handleUpdateSuccess, 400);
            }
            return;
        }
        
        // Create New Booking
        const handleSuccess = (newId) => {
            btn.innerHTML = origText; btn.disabled = false; Toast.fire({icon:'success', title:'Booking Saved'});
            if(newId) data.id = newId; // Apply the new ID
            this.state.cemeteryData.unshift(data); 
            this.renderCemeteryTable();
            this.initCemeteryCalendar(); // Refresh calendar to show new event
            this.renderCemeteryReport(false); // Refresh running balance cards & annual table
            this.updateCemModalHelper(); // Refresh modal preview
            this.closeCemeteryModal(); // Close modal
        };

        if (window.google && window.google.script) {
            google.script.run.withSuccessHandler(res => { 
                if(res && res.success) handleSuccess(res.id); 
                else { btn.innerHTML = origText; btn.disabled = false; Toast.fire({icon:'error', title:res ? res.message : 'Save failed'}); } 
            }).saveCemeteryBooking(data);
        } else { setTimeout(() => handleSuccess('demo-id-' + Date.now()), 500); }
    },

    deleteCemeteryBooking: function(id, name) {
        if (!id) return;
        try { id = decodeURIComponent(id); } catch(e) {}
    Swal.fire({
        title: 'Delete Booking?',
        text: `Are you sure you want to delete the scheduled burial for ${name}?`,
        icon: 'warning',
        showCancelButton: true,
        confirmButtonColor: '#ef4444',
        cancelButtonColor: '#6b7280',
        confirmButtonText: 'Yes, delete it!'
    }).then((result) => {
        if (result.isConfirmed) {
            const handleSuccess = () => {
                Toast.fire({ icon: 'success', title: 'Booking Deleted' });
                this.state.cemeteryData = this.state.cemeteryData.filter(c => String(c.id).trim() !== String(id).trim());
                this.renderCemeteryTable();
                this.initCemeteryCalendar();
                this.renderCemeteryReport(false);
                this.updateCemModalHelper();
            };

            if (window.google && window.google.script) {
                google.script.run.withSuccessHandler(res => {
                    if (res && res.success) {
                        handleSuccess();
                    } else {
                        Toast.fire({ icon: 'error', title: res ? res.message : 'Delete failed' });
                    }
                }).deleteCemeteryBookingDB(id);
            } else {
                handleSuccess();
            }
        }
    });
},

                    <td style="text-align: center; font-weight: 600; padding: 8px 12px;">${rowTotal}</td>

            brgyStats[brgy].amount += (parseFloat(c.amount) || 0);
        });

        let brgyArray = Object.keys(brgyStats).map(key => ({
            name: key,
            count: brgyStats[key].count,
            amount: brgyStats[key].amount
        })).sort((a, b) => b.count - a.count);

        let brgyHtml = '';
        if (brgyArray.length > 0) {

    csu: {
        STORAGE_KEY: 'csu_daily_report_data',
        calendarInstance: null,
        
        switchTab: function(tabName) {
            document.getElementById('tabCsuForm').classList.remove('active');
            document.getElementById('tabCsuCalendar').classList.remove('active');
            document.getElementById('containerCsuForm').classList.add('hidden');
            document.getElementById('containerCsuCalendar').classList.add('hidden');
            
            if (tabName === 'form') {
                document.getElementById('tabCsuForm').classList.add('active');
                document.getElementById('containerCsuForm').classList.remove('hidden');
            } else {
                document.getElementById('tabCsuCalendar').classList.add('active');
                document.getElementById('containerCsuCalendar').classList.remove('hidden');
                this.initCalendar();
            }
        },

        initCalendar: function() {
            const calendarEl = document.getElementById('csuCalendar');
            if (!calendarEl) return;
            
            const events = window.app.state.csuData.map(c => {
                let guardName = (c.prepName && c.prepName !== 'Unknown') ? c.prepName.trim() : '';
                if (!guardName && c.jsonData) {
                    try {
                        const parsed = JSON.parse(c.jsonData);
                        guardName = (parsed.signatures?.prepName || '').trim();
                        if (!guardName && parsed.tables?.personnel?.length > 0) {
                            // Fallback to first guard in deployment table
                            guardName = (parsed.tables.personnel[0][1] || '').trim();
                        }
                    } catch(e) {}
                }

                let title = 'Daily Report';
                if (guardName && c.shift) {
                    title = `${guardName} (${c.shift})`;
                } else if (guardName) {
                    title = guardName;
                } else if (c.shift) {
                    title = `Report: ${c.shift}`;
                }

                return {
                    title: title,
                    start: c.date,
                    backgroundColor: 'var(--primary-color)',
                    borderColor: 'var(--primary-dark)',
                    extendedProps: { rawJson: c.jsonData }
                };
            });

            if (this.calendarInstance) this.calendarInstance.destroy();

            this.calendarInstance = new FullCalendar.Calendar(calendarEl, {
                initialView: 'dayGridMonth',
                height: 550,
                events: events,
                eventClick: function(info) {
                    try {
                        const data = JSON.parse(info.event.extendedProps.rawJson);
                        window.app.csu.populateForm(data);
                        window.app.csu.setFormReadOnly(true);
                        window.app.csu.switchTab('form');
                        Toast.fire({icon: 'info', title: 'Submitted official report loaded (Read-Only)'});
                    } catch(e) { 
                        Toast.fire({icon: 'error', title: 'Error loading report data'}); 
                    }
                }
            });
            this.calendarInstance.render();
        },

        autoFillDay: function() {
            const dateInput = document.getElementById('csu-date');
            if (!dateInput) return;
            const dateVal = dateInput.value;
            if (dateVal) {
                const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
                const d = new Date(dateVal + 'T00:00:00');
                if (!isNaN(d.getTime())) document.getElementById('csu-day').value = days[d.getDay()];
            } else document.getElementById('csu-day').value = '';
        },
        autoResize: function(el) {
            el.style.height = 'auto'; el.style.height = (el.scrollHeight) + 'px';
        },
        getTodayDateStr: function() {
            const now = new Date();
            const y = now.getFullYear();
            const m = String(now.getMonth() + 1).padStart(2, '0');
            const d = String(now.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        },
        applyDateRestrictions: function() {
            const today = this.getTodayDateStr();
            const dateInput = document.getElementById('csu-date');
            if (!dateInput) return;

            const isAdmin = window.app.state.userRole === 'Admin';
            if (!dateInput.value || (!isAdmin && dateInput.value !== today)) {
                dateInput.value = today;
            }

            if (!isAdmin) {
                dateInput.min = today;
                dateInput.max = today;
                dateInput.setAttribute('readonly', 'true');
            } else {
                dateInput.removeAttribute('readonly');
                dateInput.removeAttribute('min');
                dateInput.max = today;
            }
            this.autoFillDay();
        },
        setFormReadOnly: function(isReadOnly) {
            this.isReadOnly = isReadOnly;
            const form = document.getElementById('csuReportForm');
            if (!form) return;

            form.querySelectorAll('input, textarea').forEach(el => {
                if (isReadOnly) {
                    el.setAttribute('disabled', 'true');
                    el.style.backgroundColor = '#f9fafb';
                    el.style.cursor = 'not-allowed';
                } else {
                    el.removeAttribute('disabled');
                    el.style.backgroundColor = '';
                    el.style.cursor = '';
                }
            });

            if (!isReadOnly) {
                this.applyDateRestrictions();
            }

            document.querySelectorAll('.csu-add-btn').forEach(btn => {
                btn.style.display = isReadOnly ? 'none' : '';
            });

            document.querySelectorAll('.csu-remove-btn').forEach(btn => {
                btn.style.display = isReadOnly ? 'none' : '';
            });

            const btnSubmit = document.getElementById('btnSubmitCsu');
            const btnClear = document.getElementById('btnClearCsu');
            const btnNew = document.getElementById('btnNewCsu');
            const banner = document.getElementById('csuLockedBanner');

            if (btnSubmit) btnSubmit.style.display = isReadOnly ? 'none' : '';
            if (btnClear) btnClear.style.display = isReadOnly ? 'none' : '';
            if (btnNew) btnNew.classList.toggle('hidden', !isReadOnly);
            if (banner) banner.classList.toggle('hidden', !isReadOnly);
        },
        createNewReport: function() {
            this.setFormReadOnly(false);
            this.loadData();
            this.applyDateRestrictions();
            Toast.fire({icon: 'info', title: 'Active report draft ready for today'});
        },
        addTableRow: function(tbodyId, type, triggerSave = true) {
            const tbody = document.getElementById(tbodyId);
            const tr = document.createElement('tr');
            tr.innerHTML = this.templates[type] + `<td class="text-center no-print align-top" style="vertical-align:middle;"><button type="button" class="btn btn-ghost btn-sm csu-remove-btn" style="color:var(--danger-color); padding:4px;" onclick="this.closest('tr').remove(); window.app.csu.saveData();" title="Remove"><i class="fas fa-times"></i></button></td>`;
            tbody.appendChild(tr);
            if (this.isReadOnly) {
                tr.querySelectorAll('input, textarea').forEach(el => {
                    el.setAttribute('disabled', 'true');
                    el.style.backgroundColor = '#f9fafb';
                    el.style.cursor = 'not-allowed';
                });
                const rmBtn = tr.querySelector('.csu-remove-btn');
                if (rmBtn) rmBtn.style.display = 'none';
            }
            if(triggerSave && !this.isReadOnly) this.saveData();
        },
        getTableData: function(tbodyId) {
            const tbody = document.getElementById(tbodyId);
            const rows = [];
            for (let tr of tbody.children) {
                const rowData = [];
                const inputs = tr.querySelectorAll('input, textarea');
                inputs.forEach(input => rowData.push(input.value));
                rows.push(rowData);
            }
            return rows;
        },
        setTableData: function(tbodyId, type, dataArray) {
            const tbody = document.getElementById(tbodyId);
            tbody.innerHTML = '';
            dataArray.forEach(rowData => {
                this.addTableRow(tbodyId, type, false);
                const newlyAddedRow = tbody.lastElementChild;
                const inputs = newlyAddedRow.querySelectorAll('input, textarea');
                rowData.forEach((val, index) => {
                    if(inputs[index]) {
                        if (inputs[index].type === 'time' && val) {
                            let t = String(val).trim();
                            let clean = t.replace(/[^0-9:]/g, '');
                            if (clean.length === 4 && !clean.includes(':')) {
                                clean = clean.slice(0, 2) + ':' + clean.slice(2);
                            }
                            inputs[index].value = clean;
                        } else {
                            inputs[index].value = val || '';
                        }
                        if(inputs[index].tagName === 'TEXTAREA') this.autoResize(inputs[index]);
                    }
                });
            });
        },
        populateForm: function(data) {
            if (!data) return;
            if (data.basic) {
                document.getElementById('csu-date').value = data.basic.date || '';
                document.getElementById('csu-day').value = data.basic.day || '';
                document.getElementById('csu-shift').value = data.basic.shift || '';
                document.getElementById('csu-area').value = data.basic.area || '';
            }
            if (data.tables) {
                this.setTableData('csu-personnel-body', 'personnel', data.tables.personnel || []);
                this.setTableData('csu-incident-body', 'incident', data.tables.incident || []);
                this.setTableData('csu-violations-body', 'violations', data.tables.violations || []);
                this.setTableData('csu-lostfound-body', 'lostfound', data.tables.lostfound || []);
            }
            if (data.texts) {
                const sumEl = document.getElementById('csu-summary-activities');
                if (sumEl) { sumEl.value = data.texts.summary || ''; this.autoResize(sumEl); }
                const turnEl = document.getElementById('csu-text-turnover');
                if (turnEl) { turnEl.value = data.texts.turnover || ''; this.autoResize(turnEl); }
            }
            if (data.signatures) {
                document.getElementById('csu-sig-prep-name').value = data.signatures.prepName || '';
                document.getElementById('csu-sig-prep-title').value = data.signatures.prepTitle || '';
                document.getElementById('csu-sig-ver-name').value = data.signatures.verName || '';
                document.getElementById('csu-sig-ver-title').value = data.signatures.verTitle || '';
                document.getElementById('csu-sig-app-name').value = data.signatures.appName || '';
                document.getElementById('csu-sig-app-title').value = data.signatures.appTitle || '';
            }
        },
        saveData: function() {
            if (this.isReadOnly) return;
            const data = {
                basic: {
                    date: document.getElementById('csu-date').value, day: document.getElementById('csu-day').value,
                    shift: document.getElementById('csu-shift').value, area: document.getElementById('csu-area').value,
                },
                tables: {
                    personnel: this.getTableData('csu-personnel-body'), incident: this.getTableData('csu-incident-body'),
                    violations: this.getTableData('csu-violations-body'), lostfound: this.getTableData('csu-lostfound-body')
                },
                texts: {
                    summary: document.getElementById('csu-summary-activities').value, turnover: document.getElementById('csu-text-turnover').value,
                },
                signatures: {
                    prepName: document.getElementById('csu-sig-prep-name').value, prepTitle: document.getElementById('csu-sig-prep-title').value,
                    verName: document.getElementById('csu-sig-ver-name').value, verTitle: document.getElementById('csu-sig-ver-title').value,
                    appName: document.getElementById('csu-sig-app-name').value, appTitle: document.getElementById('csu-sig-app-title').value,
                }
            };
            localStorage.setItem(this.STORAGE_KEY, JSON.stringify(data));
        },
        loadData: function() {
            this.setFormReadOnly(false);
            const savedStr = localStorage.getItem(this.STORAGE_KEY);
            if (savedStr) {
                try {
                    const data = JSON.parse(savedStr);
                    this.populateForm(data);
                } catch (e) { this.initializeEmptyRows(); }
            } else {
                this.initializeEmptyRows();
            }
            this.applyDateRestrictions();
        },
        initializeEmptyRows: function() {
            ['csu-personnel-body', 'csu-incident-body', 'csu-violations-body', 'csu-lostfound-body'].forEach(id => document.getElementById(id).innerHTML = '');
            this.addTableRow('csu-personnel-body', 'personnel', false); this.addTableRow('csu-incident-body', 'incident', false);
            this.addTableRow('csu-violations-body', 'violations', false); this.addTableRow('csu-lostfound-body', 'lostfound', false);
        },
        clearData: function() {
            if (this.isReadOnly) {
                Toast.fire({icon: 'warning', title: 'Cannot clear an official submitted report.'});
                return;
            }
            if(confirm("Are you sure you want to clear the entire form? This cannot be undone.")) {
                localStorage.removeItem(this.STORAGE_KEY); document.getElementById('csuReportForm').reset();
                this.initializeEmptyRows(); document.querySelectorAll('#csuReportForm textarea').forEach(ta => { ta.style.height = '80px'; });
                this.applyDateRestrictions();
            }
        },
        submitReport: function() {
            if (this.isReadOnly) {
                Toast.fire({icon: 'warning', title: 'This report has already been submitted and is locked.'});
                return;
            }
            this.saveData(); 
            const savedStr = localStorage.getItem(this.STORAGE_KEY);
            if (!savedStr) return;
            const data = JSON.parse(savedStr);

            if (!data.basic.date) { Toast.fire({icon: 'warning', title: 'Please select a Date before saving.'}); return; }

            const today = this.getTodayDateStr();
            const isAdmin = window.app.state.userRole === 'Admin';
            if (!isAdmin && data.basic.date !== today) {
                Toast.fire({
                    icon: 'error',
                    title: `Submission closed: Reports can only be submitted on the day of duty (${today}).`
                });
                return;
            }

            data.userRole = window.app.state.userRole || 'Staff';

            const btn = document.getElementById('btnSubmitCsu');
            const origText = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving...';
            btn.disabled = true;

            if (window.google && window.google.script) {
                google.script.run.withSuccessHandler(res => {
                    btn.innerHTML = origText; btn.disabled = false;
                    if (res.success) { 
                        Toast.fire({icon: 'success', title: 'CSU Report saved to database!'}); 
                        window.app.state.csuData.push({
                            date: data.basic.date, 
                            shift: data.basic.shift, 
                            prepName: (data.signatures?.prepName || '').trim(),
                            jsonData: savedStr
                        });
                        if (window.app.csu.calendarInstance) window.app.csu.initCalendar();
                        window.app.csu.setFormReadOnly(true);
                        localStorage.removeItem(window.app.csu.STORAGE_KEY);
                    }
                    else Toast.fire({icon: 'error', title: res.message});
                }).saveCsuReport(data);
            } else {
                setTimeout(() => { 
                    btn.innerHTML = origText; btn.disabled = false; 
                    Toast.fire({icon: 'success', title: 'Report saved (Demo)'}); 
                    window.app.state.csuData.push({
                        date: data.basic.date, 
                        shift: data.basic.shift, 
                        prepName: (data.signatures?.prepName || '').trim(),
                        jsonData: savedStr
                    });
                    if (window.app.csu.calendarInstance) window.app.csu.initCalendar();
                    window.app.csu.setFormReadOnly(true);
                    localStorage.removeItem(window.app.csu.STORAGE_KEY);
                }, 1000);
            }
        },
