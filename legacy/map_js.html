    attachEvents: function() {
      document.getElementById('mapContent').addEventListener('click', e => { const s = e.target.closest('.stall'); if(s && s.dataset.stallId) this.openModal(s.dataset.stallId); });
      
      let searchTimeout;
      document.getElementById('searchInput').addEventListener('input', e => { 
          clearTimeout(searchTimeout);
          searchTimeout = setTimeout(() => {
              this.state.searchTerm = e.target.value; 
              this.renderMap(); 
          }, 300);
      });
      document.getElementById('filterSelect').addEventListener('change', e => { this.state.filterStatus = e.target.value; this.renderMap(); });
    },
    switchModalTab: function(name) {
       const tabs = document.querySelectorAll('.modal-tab'); tabs.forEach(t=>t.classList.remove('active')); event.target.classList.add('active');
       document.querySelectorAll('.tab-content').forEach(c=>c.classList.remove('active'));
       if(name==='current') { document.getElementById('tabCurrent').classList.add('active'); this.resetModalButtons(); }
       else if(name==='documents') { document.getElementById('tabDocuments').classList.add('active'); document.getElementById('viewActions').classList.add('hidden'); }
       else { document.getElementById('tabHistory').classList.add('active'); document.getElementById('viewActions').classList.add('hidden'); }
    },
    openModal: function(id) {
      this.state.selectedStallId = id; const data = this.state.stallData[id] || {}; const current = data.current || {};
      document.getElementById('modalStallLabel').textContent = id; document.getElementById('lblColI').textContent = this.state.columnIHeader;
      document.getElementById('inputOwner').value = current.stallOwner||''; document.getElementById('inputOperator').value = current.operator||'';
      document.getElementById('inputLOB').value = current.lineOfBusiness||''; document.getElementById('inputPeriod').value = current.periodIndex||'';
      document.getElementById('inputColI').value = current.columnI||'';
      
      const isOccupied = !!current.stallOwner;
      this.state.currentStatus = isOccupied ? (current.status || 'Non-Compliant') : 'Vacant';
      const displayStatus = document.getElementById('displayStatus');
      displayStatus.textContent = this.state.currentStatus;
      displayStatus.className = 'status-badge ' + (this.state.currentStatus === 'Compliant' ? 'status-compliant' : (this.state.currentStatus === 'Lacking' ? 'status-lacking' : 'status-non-compliant'));
      if(!isOccupied) { displayStatus.textContent = 'Vacant'; displayStatus.className = 'status-badge'; displayStatus.style.backgroundColor = 'var(--text-muted)'; }

      this.cancelEdit(true); // Lock inputs initially without reloading

      const isAllowed = this.state.userRole === 'Admin' || (this.state.userRole === 'Staff' && (this.state.userSection === 'ALL' || true));
      document.getElementById('viewActions').style.display = isAllowed ? 'flex' : 'none';

      const histBody = document.getElementById('ownerHistoryTableBody'); const noHist = document.getElementById('noHistoryMsg'); histBody.innerHTML = '';
      if(!data.history || data.history.length===0) { noHist.style.display='block'; histBody.parentElement.style.display='none'; }
      else { noHist.style.display='none'; histBody.parentElement.style.display='table'; data.history.forEach(h => histBody.insertAdjacentHTML('beforeend', `<tr><td>${h.year||'-'}</td><td>${h.stallOwner}</td><td>${h.operator}</td><td>${h.lineOfBusiness}</td></tr>`)); }

      this.fetchVendorAssets(current.stallOwner); this.makeInputsReadOnly(true); this.resetModalButtons(); this.switchModalTab('current');
      const tabs = document.querySelectorAll('.modal-tab'); tabs.forEach(t=>t.classList.remove('active')); tabs[0].classList.add('active');
      document.getElementById('modalOverlay').classList.add('open');
    },
    fetchVendorAssets: function(owner) {
       const img = document.getElementById('profileImage'); const ph = document.getElementById('profilePlaceholder');
       img.style.display = 'none'; ph.style.display = 'flex'; img.src = '';
       document.getElementById('iframeLease').style.display='none'; document.getElementById('noLease').style.display='flex';
       document.getElementById('iframePermit').style.display='none'; document.getElementById('noPermit').style.display='flex';
       this.updateStatusBadge(0); 

       if(!owner) return;
       if(window.google && window.google.script) {
          google.script.run.withSuccessHandler(b64 => { if(b64) { img.src=b64; img.style.display='block'; ph.style.display='none'; } }).getVendorImage(owner);
          google.script.run.withSuccessHandler(docs => {
             let count = 0;
             if(docs.lease) { document.getElementById('iframeLease').src=docs.lease; document.getElementById('iframeLease').style.display='block'; document.getElementById('noLease').style.display='none'; count++; }
             if(docs.permit) { document.getElementById('iframePermit').src=docs.permit; document.getElementById('iframePermit').style.display='block'; document.getElementById('noPermit').style.display='none'; count++; }
             this.updateStatusBadge(count);
          }).getVendorDocuments(owner);
       }
    },
    updateStatusBadge: function(count) {
       const el = document.getElementById('displayStatus'); el.className = 'status-badge';
       if(count === 2) { el.textContent = 'Compliant'; el.classList.add('status-compliant'); this.state.currentStatus = 'Compliant'; }
       else if(count === 1) { el.textContent = 'Lacking'; el.classList.add('status-lacking'); this.state.currentStatus = 'Lacking'; }
       else { el.textContent = 'Non-Compliant'; el.classList.add('status-non-compliant'); this.state.currentStatus = 'Non-Compliant'; }
    },
    closeModal: function() { document.getElementById('modalOverlay').classList.remove('open'); this.state.selectedStallId = null; },
    handleFileSelect: function(input) {
       if (input.files && input.files[0]) {
          const reader = new FileReader();
          reader.onload = e => { document.getElementById('profileImage').src = e.target.result; document.getElementById('profileImage').style.display = 'block'; document.getElementById('profilePlaceholder').style.display = 'none'; window.app.state.pendingUpload = { data: e.target.result.split(',')[1], mimeType: input.files[0].type }; };
          reader.readAsDataURL(input.files[0]);
       }
    },
    handleDocUpload: function(input, type) {
       const owner = document.getElementById('inputOwner').value; if(!owner) { Toast.fire({icon:'warning', title:'Please set owner first'}); return; }
       if (input.files && input.files[0]) {
          const reader = new FileReader();
          reader.onload = e => {
             if(confirm(`Upload ${type} for ${owner}?`)) {
                const data = e.target.result.split(',')[1];
                if(window.google && window.google.script) {
                   google.script.run.withSuccessHandler(res => { if(res.success) { Toast.fire({icon:'success', title:'Document Uploaded'}); window.app.fetchVendorAssets(owner); } else { Toast.fire({icon:'error', title:'Upload Failed'}); } }).uploadVendorDocument(data, input.files[0].type, owner, type);
                }
             }
          };
          reader.readAsDataURL(input.files[0]);
       }
    },
    makeInputsReadOnly: function(ro) { document.querySelectorAll('#tabCurrent input').forEach(i => i.readOnly = ro); },
    resetModalButtons: function() { document.getElementById('viewActions').classList.remove('hidden'); document.getElementById('btnClose').classList.remove('hidden'); document.getElementById('btnCancel').classList.add('hidden'); document.getElementById('btnSaveUpdate').classList.add('hidden'); document.getElementById('btnSaveNew').classList.add('hidden'); document.getElementById('uploadBtn').classList.add('hidden'); },
    
    enableEditMode: function() { 
        this.makeInputsReadOnly(false); 
        document.querySelectorAll('.modal-form-side .input-field').forEach(el => { el.style.backgroundColor = 'white'; });
        document.getElementById('viewActions').classList.add('hidden'); 
        document.getElementById('btnClose').classList.add('hidden'); 
        document.getElementById('btnCancel').classList.remove('hidden'); 
        document.getElementById('btnSaveUpdate').classList.remove('hidden'); 
        document.getElementById('uploadBtn').classList.remove('hidden'); 
        
        // Setup status toggle
        const statusEl = document.getElementById('displayStatus');
        statusEl.style.cursor = 'pointer';
        statusEl.onclick = () => {
            const states = ['Compliant', 'Lacking', 'Non-Compliant'];
            let idx = states.indexOf(this.state.currentStatus);
            this.state.currentStatus = states[(idx + 1) % 3];
            statusEl.textContent = this.state.currentStatus;
            statusEl.className = 'status-badge ' + (this.state.currentStatus === 'Compliant' ? 'status-compliant' : (this.state.currentStatus === 'Lacking' ? 'status-lacking' : 'status-non-compliant'));
        };

       document.getElementById('profileImage').style.display='none'; document.getElementById('profilePlaceholder').style.display='flex'; window.app.state.pendingUpload = null; this.makeInputsReadOnly(false);

        this.makeInputsReadOnly(true);
        document.querySelectorAll('.modal-form-side .input-field').forEach(el => { el.style.backgroundColor = 'var(--bg-color)'; });
        document.getElementById('uploadBtn').classList.add('hidden');

    saveStall: function(mode) {
      const id = this.state.selectedStallId; if(!id) return;
      const btn = mode === 'update' ? document.getElementById('btnSaveUpdate') : document.getElementById('btnSaveNew');
      const originalText = btn.textContent; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving...'; btn.disabled = true;

      const payload = {
         stallNo: id, stallOwner: document.getElementById('inputOwner').value, operator: document.getElementById('inputOperator').value, lineOfBusiness: document.getElementById('inputLOB').value,
         periodIndex: document.getElementById('inputPeriod').value, columnI: document.getElementById('inputColI').value, status: this.state.currentStatus
      };
      const rowIndex = mode === 'update' ? (this.state.stallData[id]?.current?.rowIndex || 0) : 0;

      const proceedToUpdateData = () => {
         if (window.google && window.google.script) {
            google.script.run.withSuccessHandler(() => { 
               this.closeModal(); this.loadData(); btn.textContent = originalText; btn.disabled = false; Toast.fire({ icon: 'success', title: 'Data Saved Successfully' });
            }).withFailureHandler(err => { Toast.fire({ icon: 'error', title: 'Save Failed' }); btn.textContent = originalText; btn.disabled = false; }).updateStallData(rowIndex, payload);
         } else {
             setTimeout(() => { this.closeModal(); btn.textContent = originalText; btn.disabled = false; Toast.fire({ icon: 'success', title: 'Saved (Demo)'}); }, 1000);
         }
      };

      if (this.state.pendingUpload && payload.stallOwner && window.google && window.google.script) {
         btn.textContent = 'Uploading Image...';
         google.script.run.withSuccessHandler(res => { proceedToUpdateData(); }).uploadVendorImage(this.state.pendingUpload.data, this.state.pendingUpload.mimeType, payload.stallOwner);
      } else { proceedToUpdateData(); }
    },

    renderTodaReport: function() {
        const tbody = document.getElementById('todaReportTableBody');
        const summaryCont = document.getElementById('todaSummaryCards');
        if(!tbody || !summaryCont) return;

        let totalTodas = this.state.todaData.length;
        let totalMembers = this.state.memberData.length;
        let totalMale = 0;
        let totalFemale = 0;

        // Map to aggregate data per TODA
        let todaStats = {};
        this.state.todaData.forEach(t => {
            todaStats[t.name] = { 
                president: t.president, 
                regMembers: parseInt(t.membersCount) || 0, // Expected registered limit
                actualMembers: 0, // Encoded profiles
                male: 0, 
                female: 0 
            };
        });

        // Count profiles and map to their respective TODA
        this.state.memberData.forEach(m => {
            if (m.sex === 'Male') totalMale++;
            if (m.sex === 'Female') totalFemale++;
            
            if (todaStats[m.todaName]) {
                todaStats[m.todaName].actualMembers++;
                if (m.sex === 'Male') todaStats[m.todaName].male++;
                if (m.sex === 'Female') todaStats[m.todaName].female++;
            }
        });

    saveCemeteryBooking: function() {
        const btn = document.getElementById('btnSaveCemModal'); 
        const origText = btn.innerHTML;
        // Format time to 12-hour AM/PM for display in tables and sheets
        const rawTime = document.getElementById('cemTime').value;
        let formattedTime = '';
        if (rawTime) {
            const [hours, minutes] = rawTime.split(':');
            const ampm = hours >= 12 ? 'PM' : 'AM';
            const hr12 = hours % 12 || 12;
            formattedTime = ` ${hr12}:${minutes} ${ampm}`;
        }

        const data = {
            deceasedName: document.getElementById('cemDeceased').value, 
            address: document.getElementById('cemAddress').value,
            phone: document.getElementById('cemPhone').value, 
            burialDate: document.getElementById('cemDate').value + formattedTime, // Combined Date & Time string
            rawDate: document.getElementById('cemDate').value, // Kept separate for backend Calendar use
            rawTime: rawTime, // Kept separate for backend Calendar use
            burialType: document.getElementById('cemType').value, 
            amount: parseFloat(document.getElementById('cemAmount').value) || 0
        };
        
        if(!data.deceasedName || !data.burialDate) { Toast.fire({icon:'warning', title:'Name and Date are required'}); return; }
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving...'; btn.disabled = true;
        
        const handleSuccess = (newId) => {
            btn.innerHTML = origText; btn.disabled = false; Toast.fire({icon:'success', title:'Booking Saved'});
            if(newId) data.id = newId; // Apply the new ID
            this.state.cemeteryData.unshift(data); 
            this.renderCemeteryTable();
            this.initCemeteryCalendar(); // Refresh calendar to show new event
            this.closeCemeteryModal(); // Close modal
        };

        if (window.google && window.google.script) {
            google.script.run.withSuccessHandler(res => { 
            if(res.success) handleSuccess(res.id); 
            else { btn.innerHTML = origText; btn.disabled = false; Toast.fire({icon:'error', title:res.message}); } 
}).saveCemeteryBooking(data);
        } else { setTimeout(() => handleSuccess('demo-id-' + Date.now()), 500); }
    },

    deleteCemeteryBooking: function(id, name) {
    Swal.fire({
        title: 'Delete Booking?',
        text: `Are you sure you want to delete the scheduled burial for ${name}?`,
        icon: 'warning',
        showCancelButton: true,
        confirmButtonColor: '#ef4444',
        cancelButtonColor: '#6b7280',
        confirmButtonText: 'Yes, delete it!'
    }).then((result) => {
        if (result.isConfirmed) {
            if (window.google && window.google.script) {
                google.script.run.withSuccessHandler(res => {
                    if (res.success) {
                        Toast.fire({ icon: 'success', title: 'Booking Deleted' });
                        // Remove from local arrays and re-render the views instantly
                        this.state.cemeteryData = this.state.cemeteryData.filter(c => c.id !== id);
                        this.renderCemeteryTable();
                        this.initCemeteryCalendar();
                    } else {
                        Toast.fire({ icon: 'error', title: res.message });
                    }
                }).deleteCemeteryBookingDB(id);
            } else {
                // Local Demo Fallback
                this.state.cemeteryData = this.state.cemeteryData.filter(c => c.id !== id);
                this.renderCemeteryTable();
                this.initCemeteryCalendar();
                Toast.fire({ icon: 'success', title: 'Booking Deleted' });
            }
        }
    });
},

    // --- CSU / PEACE & ORDER LOGIC ---
    csu: {
        STORAGE_KEY: 'csu_daily_report_data',
        calendarInstance: null,
        
        switchTab: function(tabName) {
            document.getElementById('tabCsuForm').classList.remove('active');
            document.getElementById('tabCsuCalendar').classList.remove('active');
            document.getElementById('containerCsuForm').classList.add('hidden');
            document.getElementById('containerCsuCalendar').classList.add('hidden');
            
            if (tabName === 'form') {
                document.getElementById('tabCsuForm').classList.add('active');
                document.getElementById('containerCsuForm').classList.remove('hidden');
            } else {
                document.getElementById('tabCsuCalendar').classList.add('active');
                document.getElementById('containerCsuCalendar').classList.remove('hidden');
                this.initCalendar();
            }
        },

        initCalendar: function() {
            const calendarEl = document.getElementById('csuCalendar');
            if (!calendarEl) return;
            
            const events = window.app.state.csuData.map(c => ({
                title: c.shift ? `Report: ${c.shift}` : 'Daily Report',
                start: c.date,
                backgroundColor: 'var(--primary-color)',
                borderColor: 'var(--primary-dark)',
                extendedProps: { rawJson: c.jsonData }
            }));

            if (this.calendarInstance) this.calendarInstance.destroy();

            this.calendarInstance = new FullCalendar.Calendar(calendarEl, {
                initialView: 'dayGridMonth',
                height: 550,
                events: events,
                eventClick: function(info) {
                    if (confirm('Load this report? Any unsaved changes on the current form will be overwritten.')) {
                        try {
                            const data = JSON.parse(info.event.extendedProps.rawJson);
                            localStorage.setItem(window.app.csu.STORAGE_KEY, JSON.stringify(data));
                            window.app.csu.loadData();
                            window.app.csu.switchTab('form');
                            Toast.fire({icon: 'success', title: 'Report loaded from history!'});
                        } catch(e) { Toast.fire({icon: 'error', title: 'Error loading data'}); }
                    }
                }
            });
            this.calendarInstance.render();
        },

            let htmlRows = '';
            let guardName = '';
            let totalDeployments = 0;
            
            // Loop through all history to find matches for this Guard ID
            window.app.state.csuData.forEach(report => {
                try {
                    const rData = JSON.parse(report.jsonData);
                    const personnel = rData.tables?.personnel || [];
                    personnel.forEach(p => {
                        // p[0] = ID, p[1] = Name, p[2] = Area, p[3] = In, p[4] = Out, p[5] = Remarks
                        if (p[0] && p[0].toLowerCase() === guardId) {
                            if (!guardName && p[1]) guardName = p[1]; 
                            totalDeployments++;
                            htmlRows += `<tr>
                                <td>${rData.basic?.date || report.date}</td>
                                <td>${rData.basic?.shift || '-'}</td>
                                <td>${p[2] || '-'}</td>
                                <td>${p[3] || '-'}</td>
                                <td>${p[4] || '-'}</td>
                                <td>${p[5] || '-'}</td>
                            </tr>`;
                        }
                    });
                } catch(e) {}
            });
            
            if (!htmlRows) { Toast.fire({icon:'info', title:'No records found for this Guard ID'}); return; }
            
            // Generate Official Report Document
            const printWin = window.open('', '', 'width=900,height=700');
            printWin.document.write(`
                <html><head><title>Market Guard Deployment Report - ${guardId.toUpperCase()}</title>
                <style>
                    body { font-family: Arial, sans-serif; margin: 40px; color: #000; }
                    /* Official Header Styling */
                    .header { text-align: center; margin-bottom: 30px; border-bottom: 2px solid #000; padding-bottom: 20px; }
                    h1 { font-size: 1.6rem; font-weight: 900; text-transform: uppercase; margin:0; }
                    p.sub { color: #444; font-style: italic; margin-top: 5px; }
                    
                    /* Info Grid */
                    .info-grid { display: flex; justify-content: space-between; margin-bottom: 20px; font-size: 1.1rem; }
                    
                    /* Table Styling */
                    table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.95rem; }
                    th, td { border: 1px solid #000; padding: 12px 10px; text-align: left; }
                    th { background-color: #f3f4f6; text-transform: uppercase; font-size: 0.85rem; font-weight: bold; }
                    
                    /* Signature Section */
                    .sig-section { display: flex; justify-content: space-between; margin-top: 60px; text-align: center; page-break-inside: avoid; }
                    .sig-box { flex: 1; display: flex; flex-direction: column; align-items: center; }
                    .sig-line { width: 70%; border-bottom: 1px solid #000; margin-bottom: 5px; height: 30px; }
                    
                    /* Print Adjustments */
                    @media print { 
                        body { margin: 0; padding: 20px; } 
                        @page { size: portrait; margin: 0.5in; } 
                        th { background-color: #f3f4f6 !important; -webkit-print-color-adjust: exact; }
                    }
                </style>
                </head><body>
                    <div class="header">
                        <h1>Market Guard Deployment Report</h1>
                        <p class="sub">Individual Personnel Daily Log & History Summary</p>
                    </div>
                    
                    <div class="info-grid">
                        <div><strong>Guard ID:</strong> <span style="text-decoration: underline;">${guardId.toUpperCase()}</span></div>
                        <div><strong>Guard Name:</strong> <span style="text-decoration: underline;">${guardName || 'Unknown'}</span></div>
                        <div><strong>Total Recorded Shifts:</strong> <span style="text-decoration: underline;">${totalDeployments}</span></div>
                    </div>
                    
                    <table>
                        <thead>
                            <tr>
                                <th style="width:15%">Date</th>
                                <th style="width:20%">Shift</th>
                                <th style="width:25%">Assigned Area</th>
                                <th style="width:12%">Time In</th>
                                <th style="width:12%">Time Out</th>
                                <th>Remarks</th>
                            </tr>
                        </thead>
                        <tbody>${htmlRows}</tbody>
                    </table>
                    
                    <div class="sig-section">
                        <div class="sig-box">
                            <div class="sig-line"></div>
                            <strong>Prepared By</strong>
                            <div style="font-size: 0.8rem; color: #555;">Records Officer / Encoder</div>
                        </div>
                        <div class="sig-box">
                            <div class="sig-line"></div>
                            <strong>Noted By</strong>
                            <div style="font-size: 0.8rem; color: #555;">Team Leader / Market Admin</div>
                        </div>
                    </div>
                </body></html>
            `);
            printWin.document.close();
            printWin.focus();
            setTimeout(() => { printWin.print(); printWin.close(); }, 500);
        },

        autoFillDay: function() {
            const dateInput = document.getElementById('csu-date').value;
            if (dateInput) {
                const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
                const d = new Date(dateInput);
                if (!isNaN(d.getTime())) document.getElementById('csu-day').value = days[d.getDay()];
            } else document.getElementById('csu-day').value = '';
        },
        autoResize: function(el) {
            el.style.height = 'auto'; el.style.height = (el.scrollHeight) + 'px';
        },
        addTableRow: function(tbodyId, type, triggerSave = true) {
            const tbody = document.getElementById(tbodyId);
            const tr = document.createElement('tr');
            tr.innerHTML = this.templates[type] + `<td class="text-center no-print align-top" style="vertical-align:middle;"><button type="button" class="btn btn-ghost btn-sm" style="color:var(--danger-color); padding:4px;" onclick="this.closest('tr').remove(); window.app.csu.saveData();" title="Remove"><i class="fas fa-times"></i></button></td>`;
            tbody.appendChild(tr);
            if(triggerSave) this.saveData();
        },
        getTableData: function(tbodyId) {
            const tbody = document.getElementById(tbodyId);
            const rows = [];
            for (let tr of tbody.children) {
                const rowData = [];
                const inputs = tr.querySelectorAll('input, textarea');
                inputs.forEach(input => rowData.push(input.value));
                rows.push(rowData);
            }
            return rows;
        },
        setTableData: function(tbodyId, type, dataArray) {
            const tbody = document.getElementById(tbodyId);
            tbody.innerHTML = '';
            dataArray.forEach(rowData => {
                this.addTableRow(tbodyId, type, false);
                const newlyAddedRow = tbody.lastElementChild;
                const inputs = newlyAddedRow.querySelectorAll('input, textarea');
                rowData.forEach((val, index) => {
                    if(inputs[index]) {
                        inputs[index].value = val || '';
                        if(inputs[index].tagName === 'TEXTAREA') this.autoResize(inputs[index]);
                    }
                });
            });
        },
        saveData: function() {
            const data = {
                basic: {
                    date: document.getElementById('csu-date').value, day: document.getElementById('csu-day').value,
                    shift: document.getElementById('csu-shift').value, area: document.getElementById('csu-area').value,
                },
                tables: {
                    personnel: this.getTableData('csu-personnel-body'), incident: this.getTableData('csu-incident-body'),
                    violations: this.getTableData('csu-violations-body'), lostfound: this.getTableData('csu-lostfound-body')
                },
                texts: {
                    summary: document.getElementById('csu-summary-activities').value, turnover: document.getElementById('csu-text-turnover').value,
                },
                signatures: {
                    prepName: document.getElementById('csu-sig-prep-name').value, prepTitle: document.getElementById('csu-sig-prep-title').value,
                    verName: document.getElementById('csu-sig-ver-name').value, verTitle: document.getElementById('csu-sig-ver-title').value,
                    appName: document.getElementById('csu-sig-app-name').value, appTitle: document.getElementById('csu-sig-app-title').value,
                }
            };
            localStorage.setItem(this.STORAGE_KEY, JSON.stringify(data));
        },
        loadData: function() {
            const savedStr = localStorage.getItem(this.STORAGE_KEY);
            if (savedStr) {
                try {
                    const data = JSON.parse(savedStr);
                    if(data.basic) {
                        document.getElementById('csu-date').value = data.basic.date || ''; document.getElementById('csu-day').value = data.basic.day || '';
                        document.getElementById('csu-shift').value = data.basic.shift || ''; document.getElementById('csu-area').value = data.basic.area || '';
                    }
                    if(data.tables) {
                        this.setTableData('csu-personnel-body', 'personnel', data.tables.personnel || []);
                        this.setTableData('csu-incident-body', 'incident', data.tables.incident || []);
                        this.setTableData('csu-violations-body', 'violations', data.tables.violations || []);
                        this.setTableData('csu-lostfound-body', 'lostfound', data.tables.lostfound || []);
                    }
                    if(data.texts) {
                        const sumEl = document.getElementById('csu-summary-activities'); if(sumEl) { sumEl.value = data.texts.summary || ''; this.autoResize(sumEl); }
                        const turnEl = document.getElementById('csu-text-turnover'); if(turnEl) { turnEl.value = data.texts.turnover || ''; this.autoResize(turnEl); }
                    }
                    if(data.signatures) {
                        document.getElementById('csu-sig-prep-name').value = data.signatures.prepName || ''; document.getElementById('csu-sig-prep-title').value = data.signatures.prepTitle || '';
                        document.getElementById('csu-sig-ver-name').value = data.signatures.verName || ''; document.getElementById('csu-sig-ver-title').value = data.signatures.verTitle || '';
                        document.getElementById('csu-sig-app-name').value = data.signatures.appName || ''; document.getElementById('csu-sig-app-title').value = data.signatures.appTitle || '';
                    }
                } catch (e) { this.initializeEmptyRows(); }
            } else this.initializeEmptyRows();
        },
        initializeEmptyRows: function() {
            ['csu-personnel-body', 'csu-incident-body', 'csu-violations-body', 'csu-lostfound-body'].forEach(id => document.getElementById(id).innerHTML = '');
            this.addTableRow('csu-personnel-body', 'personnel', false); this.addTableRow('csu-incident-body', 'incident', false);
            this.addTableRow('csu-violations-body', 'violations', false); this.addTableRow('csu-lostfound-body', 'lostfound', false);
        },
        clearData: function() {
            if(confirm("Are you sure you want to clear the entire form? This cannot be undone.")) {
                localStorage.removeItem(this.STORAGE_KEY); document.getElementById('csuReportForm').reset();
                this.initializeEmptyRows(); document.querySelectorAll('#csuReportForm textarea').forEach(ta => { ta.style.height = '80px'; });
            }
        },
        submitReport: function() {
            this.saveData(); 
            const savedStr = localStorage.getItem(this.STORAGE_KEY);
            if (!savedStr) return;
            const data = JSON.parse(savedStr);

            if (!data.basic.date) { Toast.fire({icon: 'warning', title: 'Please select a Date before saving.'}); return; }

            const btn = document.getElementById('btnSubmitCsu');
            const origText = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving...';
            btn.disabled = true;

            if (window.google && window.google.script) {
                google.script.run.withSuccessHandler(res => {
                    btn.innerHTML = origText; btn.disabled = false;
                    if (res.success) { 
                        Toast.fire({icon: 'success', title: 'CSU Report saved to database!'}); 
                        // Instantly update local state and calendar!
                        window.app.state.csuData.push({
                            date: data.basic.date, shift: data.basic.shift, jsonData: savedStr
                        });
                        if (window.app.csu.calendarInstance) window.app.csu.initCalendar();
                    }
                    else Toast.fire({icon: 'error', title: res.message});
                }).saveCsuReport(data);
            } else {
                setTimeout(() => { btn.innerHTML = origText; btn.disabled = false; Toast.fire({icon: 'success', title: 'Report saved (Demo)'}); }, 1000);
            }
        },
        printReport: function() { window.print(); },
        templates: {
            // Updated Personnel Template to include Guard ID as the first input
            personnel: `<td><input type="text" class="csu-table-input" placeholder="ID" oninput="window.app.csu.saveData()"></td>
                        <td><input type="text" class="csu-table-input" placeholder="Name" oninput="window.app.csu.saveData()"></td>
                        <td><input type="text" class="csu-table-input" placeholder="Area" oninput="window.app.csu.saveData()"></td>
                        <td><input type="text" class="csu-table-input" placeholder="0000H" oninput="window.app.csu.saveData()"></td>
                        <td><input type="text" class="csu-table-input" placeholder="0000H" oninput="window.app.csu.saveData()"></td>
                        <td><input type="text" class="csu-table-input" placeholder="Remarks" oninput="window.app.csu.saveData()"></td>`,
            incident: `<td><input type="text" class="csu-table-input" placeholder="0000H" oninput="window.app.csu.saveData()"></td>
                       <td><input type="text" class="csu-table-input" placeholder="Location" oninput="window.app.csu.saveData()"></td>
                       <td><input type="text" class="csu-table-input" placeholder="Type" oninput="window.app.csu.saveData()"></td>
                       <td><textarea class="csu-table-input csu-textarea w-full" rows="1" placeholder="Description & Action" oninput="window.app.csu.autoResize(this); window.app.csu.saveData()"></textarea></td>
                       <td><input type="text" class="csu-table-input" placeholder="Status" oninput="window.app.csu.saveData()"></td>`,
            violations: `<td><input type="text" class="csu-table-input" placeholder="Name/ID" oninput="window.app.csu.saveData()"></td>
                         <td><input type="text" class="csu-table-input" placeholder="Violation" oninput="window.app.csu.saveData()"></td>
                         <td><input type="text" class="csu-table-input" placeholder="Action Taken" oninput="window.app.csu.saveData()"></td>
                         <td><input type="text" class="csu-table-input" placeholder="Remarks" oninput="window.app.csu.saveData()"></td>`,
            lostfound: `<td><input type="text" class="csu-table-input" placeholder="Item" oninput="window.app.csu.saveData()"></td>
                        <td><input type="text" class="csu-table-input" placeholder="Found By" oninput="window.app.csu.saveData()"></td>
                        <td><input type="text" class="csu-table-input" placeholder="Claimed By" oninput="window.app.csu.saveData()"></td>
                        <td><input type="text" class="csu-table-input" placeholder="Status" oninput="window.app.csu.saveData()"></td>`
        }
    }
    
  };

  
  
  document.addEventListener('DOMContentLoaded', () => { window.app.init(); });
</script>
