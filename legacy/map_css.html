<style>
  /* ==========================================================================
     1. DESIGN TOKENS (Variables)
     ========================================================================== */
  :root {
    /* Colors - Brand & UI */
    --primary-color: #2563eb;
    --primary-dark: #1e40af;
    --primary-light: #eff6ff;
    --bg-color: #f3f4f6;
    --card-bg: #ffffff;
    --border-color: #e5e7eb;
    
    /* Colors - Text */
    --text-main: #111827;
    --text-sub: #4b5563;
    --text-muted: #9ca3af;
    
    /* Colors - Status */
    --success-color: #10b981;
    --success-light: #ecfdf5;
    --warning-color: #f59e0b;
    --warning-light: #fff7ed;
    --danger-color: #ef4444;
    --danger-light: #fef2f2;
    
    /* Colors - Stalls */
    --stall-vacant-bg: #f9fafb;
    --stall-vacant-border: #d1d5db;
    --stall-occupied-bg: #d1fae5;
    --stall-occupied-border: #34d399;
    --stall-occupied-text: #064e3b;
    --stall-special-bg: #e0e7ff;

    /* Spacing */
    --space-xs: 4px;
    --space-sm: 8px;
    --space-md: 16px;
    --space-lg: 24px;
    --space-xl: 32px;
    
    /* Dimensions & Borders */
    --sidebar-width: 280px;
    --mobile-header-height: 60px;
    --radius-sm: 6px;
    --radius-md: 8px;
    --radius-lg: 12px;
    --radius-xl: 16px;
    
    /* Shadows - Modern Soft Elevation */
    --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
    --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
    --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
    --shadow-modal: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);

    /* Z-Index Hierarchy */
    --z-mobile-header: 800;
    --z-sidebar-overlay: 900;
    --z-sidebar: 1000;
    --z-loader: 2000;
    --z-modal: 2100;
    --z-login: 3000;
    --z-toast: 10000;
    
    /* Transitions */
    --transition-fast: 0.15s cubic-bezier(0.4, 0, 0.2, 1);
    --transition-base: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    --transition-slow: 0.35s cubic-bezier(0.4, 0, 0.2, 1);
  }

  /* ==========================================================================
     2. GLOBAL RESETS & BASE
     ========================================================================== */
  *, *::before, *::after {
    box-sizing: border-box;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Open Sans", "Helvetica Neue", sans-serif;
    background-color: var(--bg-color);
    margin: 0;
    padding: 0;
    color: var(--text-main);
    height: 100vh;
    height: 100dvh;
    overflow: hidden; 
    -webkit-font-smoothing: antialiased;
  }

  h1, h2, h3, h4 { margin-top: 0; color: var(--text-main); }
  p { margin-top: 0; }

  /* --- SweetAlert2 Override --- */
  .swal2-container { z-index: var(--z-toast) !important; }

  /* ==========================================================================
     3. UTILITIES
     ========================================================================== */
  .hidden { display: none !important; }
  .logo-blend { mix-blend-mode: multiply; display: block; }
  .flex-row { display: flex; align-items: center; gap: var(--space-sm); }
  .text-center { text-align: center; }

  @keyframes fadeIn { 
    from { opacity: 0; transform: translateY(10px); } 
    to { opacity: 1; transform: translateY(0); } 
  }
  
  @keyframes slideUp {
    from { transform: translateY(100%); }
    to { transform: translateY(0); }
  }

  /* ==========================================================================
     4. LAYOUTS
     ========================================================================== */
  /* Main App Container */
  .main-container { display: none; height: 100%; width: 100%; position: relative; }
  .main-container.visible { display: flex; }

  /* Mobile Header */
  .mobile-header {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0;
    height: var(--mobile-header-height);
    background: white;
    z-index: var(--z-mobile-header);
    border-bottom: 1px solid var(--border-color);
    align-items: center;
    padding: 0 var(--space-md);
    box-shadow: var(--shadow-sm);
  }

  .mobile-title {
    font-weight: 700;
    font-size: 1.1rem;
    margin-left: var(--space-md);
    color: var(--text-main);
  }

  /* Main Content Area */
  .content-area { 
    flex: 1; 
    min-width: 0;
    max-width: 100%;
    overflow-y: auto; 
    padding: var(--space-lg); 
    background-color: var(--bg-color); 
    position: relative; 
    -webkit-overflow-scrolling: touch; 
  }
  
  .view-section { display: none; animation: fadeIn var(--transition-base); }
  .view-section.active { display: block; }

  /* Login / Auth Wrapper */
  .login-wrapper {
    display: flex; justify-content: center; align-items: center; 
    height: 100%; width: 100%; padding: var(--space-md);
    background-color: var(--bg-color); position: fixed; top: 0; left: 0; 
    z-index: var(--z-login);
  }

  /* Full Page Loader */
  .loader-wrapper { 
    display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
    background: white; z-index: var(--z-loader); flex-direction: column; 
    justify-content: center; align-items: center; 
  }

  /* ==========================================================================
     5. COMPONENTS
     ========================================================================== */
  
  /* --- Cards --- */
  .card { 
    background: var(--card-bg); border-radius: var(--radius-lg); 
    box-shadow: var(--shadow-sm); padding: var(--space-lg); margin-bottom: var(--space-lg); 
    border: 1px solid var(--border-color);
  }
  .login-card { 
    background: white; padding: var(--space-xl); border-radius: var(--radius-xl); 
    box-shadow: var(--shadow-lg); width: 100%; max-width: 400px; 
    text-align: center; transition: height var(--transition-slow); 
    border: 1px solid var(--border-color);
  }

  /* --- Buttons --- */
  .btn { 
    padding: 10px var(--space-md); border-radius: var(--radius-md); 
    font-weight: 600; cursor: pointer; border: none; font-size: 0.95rem; 
    transition: var(--transition-base); display: inline-flex; 
    align-items: center; justify-content: center; gap: 8px; 
    min-height: 44px; /* Touch target minimum */
  }
  .btn:focus-visible { outline: 2px solid var(--bg-color); box-shadow: 0 0 0 4px var(--primary-color); }
  .btn:disabled { opacity: 0.6; cursor: not-allowed; pointer-events: none; }
  
  .btn-primary { background-color: var(--primary-color); color: white; }
  .btn-primary:hover:not(:disabled) { background-color: var(--primary-dark); }
  .btn-success { background-color: var(--success-color); color: white; }
  .btn-success:hover:not(:disabled) { background-color: #059669; }
  .btn-danger { background-color: var(--danger-color); color: white; }
  .btn-ghost { background: transparent; color: var(--text-sub); border: 1px solid transparent; }
  .btn-ghost:hover:not(:disabled) { background: var(--bg-color); color: var(--text-main); }
  
  .btn-full { width: 100%; }
  .btn-sm { padding: 6px 12px; font-size: 0.85rem; min-height: 36px; }

  /* --- Forms & Inputs --- */
  .form-group { margin-bottom: var(--space-md); text-align: left; }
  .form-group label { 
    display: block; font-size: 0.8rem; font-weight: 600; 
    color: var(--text-sub); margin-bottom: 6px; 
  }
  .input-field { 
    padding: 10px 14px; border: 1px solid var(--border-color); 
    border-radius: var(--radius-md); font-size: 0.95rem; 
    width: 100%; transition: var(--transition-base);
    background-color: white; color: var(--text-main);
    min-height: 44px; /* Touch target minimum */
  }
  .input-field:focus { 
    outline: none; border-color: var(--primary-color); 
    box-shadow: 0 0 0 3px rgba(37,99,235,0.15); 
  }
  .input-field:disabled, .form-group input:read-only { 
    background-color: var(--bg-color); color: var(--text-sub); 
    cursor: not-allowed; border-color: var(--border-color); box-shadow: none;
  }
  .search-container { display: flex; gap: 12px; flex: 1; justify-content: flex-end; }

  /* --- Sidebar --- */
  .sidebar { 
    width: var(--sidebar-width); background: white; border-right: 1px solid var(--border-color); 
    display: flex; flex-direction: column; flex-shrink: 0; 
    transition: transform var(--transition-base); z-index: var(--z-sidebar); 
  }
  .sidebar-overlay { 
    position: fixed; top: 0; left: 0; right: 0; bottom: 0; 
    background: rgba(17, 24, 39, 0.6); z-index: var(--z-sidebar-overlay); 
    display: none; backdrop-filter: blur(2px); 
    transition: opacity var(--transition-base);
  }
  .sidebar.open + .sidebar-overlay { display: block; animation: fadeIn var(--transition-fast); }
  .sidebar-header { padding: var(--space-lg); border-bottom: 1px solid var(--border-color); display: flex; align-items: center; gap: 12px; }
  .sidebar-logo { width: 44px; height: auto; border-radius: 8px; }
  .sidebar-title { font-weight: 800; font-size: 1.25rem; color: var(--text-main); letter-spacing: -0.025em; }
  
  .nav-links { flex: 1; padding: var(--space-md) 0; overflow-y: auto; }
  .nav-item { 
    display: flex; align-items: center; gap: 14px; padding: 14px var(--space-lg); 
    color: var(--text-sub); text-decoration: none; font-weight: 600; 
    cursor: pointer; transition: var(--transition-base); font-size: 0.95rem;
    margin: 4px var(--space-sm); border-radius: var(--radius-md); 
  }
  .nav-item:hover, .nav-item:focus-visible { background-color: var(--bg-color); color: var(--primary-color); outline: none; }
  .nav-item.active { background-color: var(--primary-light); color: var(--primary-color); }
  .nav-item i { width: 20px; text-align: center; font-size: 1.1rem; }
  
  /* Dropdown Navigation styling */
  .nav-parent { justify-content: space-between; cursor: pointer; }
  .nav-parent .submenu-icon { transition: transform var(--transition-base); font-size: 0.8rem; }
  .nav-parent.open .submenu-icon { transform: rotate(180deg); }
  .nav-submenu { max-height: 0; overflow: hidden; transition: max-height 0.3s ease-in-out, padding 0.3s ease-in-out; background: var(--bg-color); border-radius: var(--radius-md); margin: 0 var(--space-sm); }
  .nav-submenu.open { max-height: 500px; padding: 4px 0; margin-bottom: var(--space-sm); }
  .sub-item { padding-left: 44px; margin: 2px var(--space-xs); font-size: 0.9rem; }
  .sub-item i { font-size: 0.95rem; width: 16px; }

  .user-profile-section { padding: var(--space-lg); border-top: 1px solid var(--border-color); background: white; }
  .user-info { font-size: 0.9rem; font-weight: 700; margin-bottom: 4px; color: var(--text-main); }
  .user-role { font-size: 0.8rem; color: var(--text-sub); background: var(--bg-color); padding: 4px 8px; border-radius: var(--radius-sm); display: inline-block; }
  
  .sidebar-toggle { 
    background: transparent; border: none; padding: 10px; border-radius: var(--radius-md); 
    cursor: pointer; color: var(--text-sub); font-size: 1.25rem;
    display: flex; align-items: center; justify-content: center;
  }

  /* --- Modals (Fixed Overlapping Scrollbar Issue) --- */
  .modal-overlay { 
    position: fixed; top: 0; left: 0; right: 0; bottom: 0; 
    background: rgba(17, 24, 39, 0.6); align-items: center; justify-content: center; 
    z-index: var(--z-modal); display: none; backdrop-filter: blur(4px); 
    padding: var(--space-md);
  }
  .modal-overlay.open { display: flex; animation: fadeIn var(--transition-base); }
  .modal-content { 
    background: white; border-radius: var(--radius-xl); width: 100%; max-width: 800px; 
    box-shadow: var(--shadow-modal); display: flex; flex-direction: column; 
    max-height: 90vh; overflow: hidden; /* Prevent parent from scrolling */
  }

  /* --- Stall Side Viewer (Slide-over Inspector Drawer) --- */
  #modalOverlay.modal-overlay {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(15, 23, 42, 0.45); backdrop-filter: blur(3px);
    z-index: var(--z-modal);
    display: flex; justify-content: flex-end; align-items: stretch;
    padding: 0;
    opacity: 0; pointer-events: none;
    transition: opacity 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  }
  #modalOverlay.modal-overlay.open {
    opacity: 1; pointer-events: auto;
    animation: none;
  }
  #modalOverlay .modal-content {
    background: white;
    width: 100%; max-width: 480px;
    height: 100vh; max-height: 100vh;
    border-radius: 0;
    border-left: 1px solid var(--border-color);
    box-shadow: -8px 0 32px rgba(15, 23, 42, 0.15), -2px 0 8px rgba(15, 23, 42, 0.08);
    display: flex; flex-direction: column;
    overflow: hidden;
    transform: translateX(100%);
    transition: transform 0.32s cubic-bezier(0.16, 1, 0.3, 1);
  }
  #modalOverlay.modal-overlay.open .modal-content {
    transform: translateX(0);
  }
  #modalOverlay .modal-header {
    background: #f8fafc;
    border-bottom: 1px solid var(--border-color);
    padding: 18px 20px;
  }
  #modalOverlay .modal-tabs {
    background: #f1f5f9;
    border-bottom: 1px solid var(--border-color);
  }
  #modalOverlay .modal-tab {
    padding: 12px 14px;
    font-size: 0.85rem;
  }
  #modalOverlay .modal-body {
    padding: 20px;
    background: #ffffff;
    overflow-y: auto;
  }
  #modalOverlay .modal-footer {
    position: sticky;
    bottom: 0;
    background: #f8fafc;
    border-top: 1px solid var(--border-color);
    padding: 14px 20px;
    z-index: 10;
  }
  #modalOverlay .modal-grid {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  #modalOverlay .modal-profile-side {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    background: #f8fafc;
    border: 1px solid var(--border-color);
    border-radius: var(--radius-lg);
    padding: 16px;
    margin-bottom: 4px;
  }
  #modalOverlay .modal-form-side {
    width: 100%;
  }

  .modal-header { 
    flex-shrink: 0; padding: var(--space-lg); background: white; 
    border-bottom: 1px solid var(--border-color); display: flex; 
    justify-content: space-between; align-items: center; 
  }
  .modal-header h3 { margin: 0; font-size: 1.25rem; font-weight: 700; }
  
  .modal-tabs { 
    flex-shrink: 0; display: flex; background: var(--bg-color); 
    overflow-x: auto; -webkit-overflow-scrolling: touch; 
    border-bottom: 1px solid var(--border-color);
    /* Hide scrollbar on tabs */
    -ms-overflow-style: none; scrollbar-width: none;
  }
  .modal-tabs::-webkit-scrollbar { display: none; }
  
  .modal-tab { flex: 1; padding: 14px var(--space-md); text-align: center; cursor: pointer; font-size: 0.9rem; font-weight: 600; color: var(--text-sub); border-bottom: 2px solid transparent; transition: var(--transition-base); white-space: nowrap; }
  .modal-tab:hover { background: #e5e7eb; color: var(--text-main); }
  .modal-tab.active { background: white; color: var(--primary-color); border-bottom-color: var(--primary-color); }
  
  .modal-body { 
    flex: 1; min-height: 0; /* Forces the body to shrink and scroll inside flex container */
    padding: var(--space-lg); overflow-y: auto; 
    -webkit-overflow-scrolling: touch; background: white; 
  }
  .tab-content { display: none; }
  .tab-content.active { display: block; animation: fadeIn var(--transition-fast); }
  
  .modal-footer { 
    flex-shrink: 0; padding: var(--space-md) var(--space-lg); 
    background: var(--bg-color); border-top: 1px solid var(--border-color); 
    display: flex; justify-content: flex-end; gap: 12px; 
  }
  
  .modal-grid { display: flex; gap: var(--space-xl); align-items: flex-start; }
  .modal-form-side { flex: 1; min-width: 0; }
  .modal-profile-side { width: 200px; flex-shrink: 0; display: flex; flex-direction: column; align-items: center; }
  .modal-actions { display: flex; gap: 12px; margin-top: var(--space-lg); border-top: 1px solid var(--border-color); padding-top: var(--space-lg); }
  .modal-actions .btn { flex: 1; }

  /* --- Badges & Status Indicators --- */
  .badge { padding: 4px 10px; border-radius: 999px; font-size: 0.75rem; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; }
  .badge-pending { background: var(--warning-light); color: #b45309; }
  .badge-approved { background: var(--success-light); color: var(--stall-occupied-text); }
  .badge-blocked { background: var(--danger-light); color: #b91c1c; }
  .badge-admin { background: var(--primary-light); color: var(--primary-dark); }
  
  .status-badge { display: inline-block; padding: 6px 12px; border-radius: var(--radius-sm); font-size: 0.8rem; font-weight: 700; text-transform: uppercase; color: white; }
  .status-compliant { background-color: var(--success-color); }
  .status-lacking { background-color: var(--warning-color); }
  .status-non-compliant { background-color: var(--danger-color); }

  .status-dot { height: 10px; width: 10px; border-radius: 50%; display: inline-block; margin-right: 8px; }
  .dot-green { background-color: var(--success-color); }
  .dot-orange { background-color: var(--warning-color); }
  .dot-red { background-color: var(--danger-color); }

  /* --- Tables & Reports --- */
  .table-responsive { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; border: 1px solid var(--border-color); border-radius: var(--radius-lg) var(--radius-lg) 0 0; border-bottom: none; background: white;}
  .user-table, .report-table, .history-table { width: 100%; border-collapse: collapse; font-size: 0.9rem; text-align: left; }
  .user-table th, .user-table td, .report-table th, .report-table td { padding: 14px var(--space-md); border-bottom: 1px solid var(--border-color); }
  .user-table th, .report-table th { background-color: var(--bg-color); font-weight: 600; color: var(--text-sub); white-space: nowrap; text-transform: uppercase; font-size: 0.8rem; letter-spacing: 0.05em; }
  .report-table tr:hover td { background-color: var(--bg-color); }
  
  .history-table { font-size: 0.85rem; }
  .history-table th { padding: 10px var(--space-md); background: var(--bg-color); color: var(--text-sub); border-bottom: 1px solid var(--border-color); font-size: 0.8rem; text-transform: uppercase; }
  .history-table td { padding: 12px var(--space-md); border-bottom: 1px solid var(--border-color); }
  .history-table tr:last-child td { border-bottom: none; }

  .report-controls { display: flex; gap: var(--space-md); margin-bottom: var(--space-lg); flex-wrap: wrap; align-items: flex-end; background: var(--card-bg); padding: var(--space-lg); border-radius: var(--radius-lg); border: 1px solid var(--border-color); }
  .pagination-controls { display: flex; justify-content: space-between; align-items: center; padding: var(--space-md); background: white; border: 1px solid var(--border-color); border-radius: 0 0 var(--radius-lg) var(--radius-lg); flex-wrap: wrap; gap: var(--space-sm); }
  .pagination-info { font-size: 0.85rem; color: var(--text-sub); font-weight: 500; }

  /* --- Report Summaries --- */
  .summary-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: var(--space-md); margin-bottom: var(--space-lg); }
  .summary-card { 
    background: white; 
    padding: 16px 8px; 
    border-radius: var(--radius-lg); 
    border: 1px solid var(--border-color); 
    text-align: center; 
    box-shadow: var(--shadow-sm); 
    min-width: 0;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
  }
  .summary-value { 
    font-size: 2rem; 
    font-weight: 800; 
    color: var(--primary-color); 
    line-height: 1.2; 
    margin-bottom: 8px; 
    word-break: break-word;
    max-width: 100%;
  }
  .summary-value.summary-amount,
  .summary-amount {
    font-size: clamp(1.05rem, 1.35vw, 1.35rem);
    font-weight: 800;
    line-height: 1.2;
    margin-bottom: 8px;
    letter-spacing: -0.02em;
    display: inline-flex;
    align-items: baseline;
    justify-content: center;
    gap: 3px;
    max-width: 100%;
    white-space: nowrap;
  }
  .summary-amount .currency-symbol {
    font-size: 0.85em;
    font-weight: 700;
  }
  .summary-label { font-size: 0.8rem; font-weight: 600; color: var(--text-sub); text-transform: uppercase; letter-spacing: 0.05em;}

  @media (max-width: 1280px) {
    .summary-value.summary-amount {
      font-size: 1.15rem;
    }
  }

  /* --- UI Specifics --- */
  .login-logo-img { max-width: 160px; margin: 0 auto var(--space-lg) auto; border-radius: var(--radius-md);}
  .login-error { background-color: var(--danger-light); color: #991b1b; padding: 12px; border-radius: var(--radius-md); font-size: 0.9rem; margin-bottom: var(--space-md); display: none; font-weight: 500;}
  .toggle-auth { margin-top: var(--space-md); font-size: 0.9rem; color: var(--primary-color); cursor: pointer; font-weight: 600; }
  .toggle-auth:hover { text-decoration: underline; }
  
  .loader-logo { width: 120px; margin-bottom: var(--space-xl); border-radius: var(--radius-md);}
  .progress-container { width: 300px; height: 8px; background-color: var(--border-color); border-radius: 999px; overflow: hidden; position: relative; max-width: 80%; }
  .progress-bar { height: 100%; width: 0%; background-color: var(--primary-color); transition: width var(--transition-slow) ease-out; border-radius: 999px; }
  .loading-text { margin-top: 12px; font-size: 0.9rem; color: var(--text-sub); font-weight: 600; }

  .header-controls { display: flex; flex-wrap: wrap; gap: var(--space-md); justify-content: space-between; align-items: center; margin-bottom: var(--space-lg); }
  .tab-group { background: var(--bg-color); padding: 6px; border-radius: var(--radius-md); display: inline-flex; overflow-x: auto; max-width: 100%; white-space: nowrap; -webkit-overflow-scrolling: touch; border: 1px solid var(--border-color); }
  .tab-btn { background: none; border: none; padding: 8px 16px; border-radius: var(--radius-sm); cursor: pointer; font-weight: 600; color: var(--text-sub); transition: var(--transition-base); white-space: nowrap; font-size: 0.9rem;}
  .tab-btn.active { background: white; color: var(--primary-color); box-shadow: var(--shadow-sm); }
  
  .monitoring-grid { 
    display: grid; 
    grid-template-columns: repeat(2, minmax(0, 1fr)); 
    gap: var(--space-lg); 
    min-width: 0;
    max-width: 100%;
  }
  .monitoring-card { 
    background: white; 
    border: 1px solid var(--border-color); 
    padding: var(--space-lg); 
    border-radius: var(--radius-lg); 
    box-shadow: var(--shadow-sm);
